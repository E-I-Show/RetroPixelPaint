<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Retro Pixel Paint</title>
<meta name="description" content="Retro Pixel Paint: ブラウザだけで動く、レトロPC風のドット絵ペイント（8色・16色、表画面と裏画面、線画レイヤー）。ネットワークには接続しません。">
<style>
  :root{
    --bg:#1b1d22; --panel:#24262d; --panel2:#2a2d35; --bd:#3a3d47; --bd2:#4a4e5a;
    --fg:#d6d9e0; --fg2:#c3c7d1; --fg3:#b4b8c4; --muted:#8b90a0; --dim:#5d6272;
    --accent:#4fd1ff; --accent-dim:#2a6f87; --sel:#1f3640; --hdr-open:#20292f;
    --well:#303030; --danger:#ff6b6b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    font-size:12px; display:flex; flex-direction:column; user-select:none;
    touch-action:manipulation;
  }
  .mono{font-family:ui-monospace,Consolas,"Courier New",monospace;}
  button,input,select{font-family:inherit; color:inherit;}
  svg.ic{display:block; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  canvas.pix{image-rendering:pixelated; display:block;}

  /* ===== メニューバー ===== */
  #menubar{
    display:flex; align-items:stretch; background:var(--panel);
    border-bottom:1px solid var(--bd); height:30px; flex:none; position:relative; z-index:50;
  }
  #appLogo{display:flex; align-items:center; gap:7px; padding:0 12px; border-right:1px solid var(--bd);}
  #appLogo .swatches{display:flex; height:10px; border:1px solid #000;}
  #appLogo .swatches i{width:5px; height:8px; display:block;}
  #appLogo b{font-size:12px; letter-spacing:.04em; font-weight:700;}
  .menu-root{position:relative; display:flex;}
  .menu-btn{
    background:none; border:none; color:var(--fg); padding:0 13px; font-size:12px;
    cursor:pointer; font-family:inherit;
  }
  .menu-btn:hover,.menu-root.open .menu-btn{background:var(--panel2);}
  .menu-drop{
    display:none; position:absolute; top:100%; left:0; min-width:215px;
    background:var(--panel2); border:1px solid var(--bd2); box-shadow:0 6px 18px rgba(0,0,0,.5);
    padding:4px 0; z-index:100;
  }
  .menu-root.open .menu-drop{display:block;}
  .menu-item{
    display:flex; justify-content:space-between; align-items:center; gap:18px;
    padding:5px 14px 5px 28px; cursor:pointer; white-space:nowrap; position:relative;
  }
  .menu-item:hover{background:var(--accent-dim);}
  .menu-item .sc{color:var(--muted); font-size:11px;}
  .menu-item.checked::before{content:"✓"; position:absolute; left:10px; color:var(--accent);}
  .menu-item.disabled{color:var(--muted); pointer-events:none;}
  .menu-sep{height:1px; background:var(--bd); margin:4px 6px;}
  /* ステータスバーのチップから開く小さなメニュー */
  #popMenu{display:none; position:fixed; z-index:450; min-width:170px; background:var(--panel2);
    border:1px solid var(--bd2); box-shadow:0 6px 18px rgba(0,0,0,.5); padding:4px 0;}
  #popMenu.show{display:block;}

  /* ===== ツールオプションバー ===== */
  #optionbar{
    flex:none; height:40px; display:flex; align-items:center; gap:12px; padding:0 12px;
    background:var(--panel2); border-bottom:1px solid var(--bd); overflow:hidden; white-space:nowrap;
  }
  .ob-tool{display:flex; align-items:center; gap:7px; min-width:84px; height:24px; padding-right:10px;
    border-right:1px solid var(--bd); color:var(--accent); flex:none;}
  .ob-tool b{font-size:12.5px; color:var(--fg);}
  .ob-sep{width:1px; height:22px; background:var(--bd); flex:none;}
  .ob-lbl{color:var(--muted); font-size:11.5px;}
  .ob-note{color:var(--muted); font-size:11px;}
  .ob-text{color:var(--fg3); font-size:11.5px; overflow:hidden; text-overflow:ellipsis;}
  .ob-grow{flex:1 1 auto; min-width:4px;}
  .grp{display:flex; align-items:center; gap:6px; flex:none;}
  .stepper{display:flex; align-items:center; border:1px solid var(--bd2); border-radius:3px; overflow:hidden; flex:none;}
  .stepper button{width:22px; height:24px; display:flex; align-items:center; justify-content:center;
    padding:0; background:var(--panel); border:none; color:var(--fg); cursor:pointer;}
  .stepper button:hover{background:#333742;}
  .stepper input{width:30px; height:24px; background:var(--bg); color:var(--fg); border:none;
    border-left:1px solid var(--bd2); border-right:1px solid var(--bd2); text-align:center; font-size:12px;}
  select.sel{height:24px; background:var(--bg); color:var(--fg); border:1px solid var(--bd2);
    border-radius:3px; font-size:12px; padding:0 4px;}
  .chip{height:24px; padding:0 10px; background:var(--panel); color:var(--fg); border:1px solid var(--bd2);
    border-radius:12px; font-size:11.5px; cursor:pointer; flex:none;}
  .chip[aria-pressed="true"]{background:var(--sel); color:var(--accent); border-color:var(--accent);}
  .seg{display:flex; border:1px solid var(--bd2); border-radius:3px; overflow:hidden; flex:none;}
  .seg button{height:24px; padding:0 12px; background:var(--panel); color:var(--fg); border:none;
    font-size:11.5px; display:flex; align-items:center; gap:5px; cursor:pointer;}
  .seg button+button{border-left:1px solid var(--bd2);}
  .seg button[aria-pressed="true"]{background:var(--sel); color:var(--accent);}
  .seg button:disabled{color:var(--dim); cursor:default;}
  .seg .ico-out{width:10px; height:8px; border:1.5px solid currentColor;}
  .seg .ico-fill{width:10px; height:8px; background:currentColor;}
  .btn{height:24px; padding:0 10px; background:var(--panel2); color:var(--fg); border:1px solid var(--bd2);
    border-radius:3px; font-size:11.5px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; flex:none;}
  .btn:hover{background:#333742; border-color:#5a5f6e;}
  .btn:disabled{opacity:.4; cursor:default; background:var(--panel2); border-color:var(--bd2);}
  .btn.sm{height:22px; padding:0 8px; font-size:11px;}
  .btn.on{border-color:var(--accent); color:var(--accent); background:var(--sel);}
  .ibtn{width:30px; height:28px; display:flex; align-items:center; justify-content:center; padding:0;
    background:var(--panel); border:1px solid var(--bd2); border-radius:4px; color:var(--fg); cursor:pointer; flex:none;}
  .ibtn:hover{background:#333742;}
  .ibtn:disabled{opacity:.4; cursor:default;}
  input[type=range]{accent-color:var(--accent);}
  label.chk{display:flex; align-items:center; gap:5px; font-size:11.5px; cursor:pointer;}
  label.chk input{margin:0; accent-color:var(--accent);}
  label.chk.dis{color:var(--dim); cursor:default;}
  .swbtn{width:18px; height:18px; padding:0; border:1px solid var(--muted); cursor:pointer; flex:none; image-rendering:pixelated;}
  .sp-only{display:none !important;}

  /* ===== 中段 ===== */
  #main{flex:1; display:flex; min-height:0;}
  #toolbar{width:48px; flex:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 0; background:var(--panel); border-right:1px solid var(--bd); overflow:hidden;}
  .tb-btn{width:36px; height:36px; display:flex; align-items:center; justify-content:center; padding:0;
    background:transparent; border:1px solid transparent; border-radius:4px; color:var(--fg2); cursor:pointer; flex:none;}
  .tb-btn:hover{background:var(--panel2);}
  .tb-btn[aria-pressed="true"]{background:var(--sel); border-color:var(--accent); color:var(--accent);}
  .tb-sep{width:26px; height:1px; background:var(--bd); margin:3px 0; flex:none;}
  .tb-grow{flex:1 1 auto;}
  .colorchips{position:relative; width:38px; height:38px; margin-bottom:2px; flex:none;}
  .colorchips .bgc{position:absolute; left:13px; top:13px; width:24px; height:24px; padding:0;
    border:1px solid var(--muted); cursor:pointer;}
  .colorchips .fgc{position:absolute; left:0; top:0; width:24px; height:24px; padding:0; overflow:hidden;
    border:2px solid var(--fg); box-shadow:0 0 0 1px var(--bg); cursor:pointer; background:var(--bg);}
  .colorchips .fgc canvas{width:100%; height:100%;}

  #canvasWrap{flex:1; position:relative; min-width:0; display:flex; flex-direction:column;}
  #canvasContainer{flex:1; overflow:auto; position:relative; background:var(--well);}
  #viewCanvas{position:absolute; top:0; left:0; display:block; touch-action:none; cursor:crosshair; outline:none;}
  #spacer{position:absolute; top:0; left:0; width:10px; height:10px; pointer-events:none;}
  #canvasContainer::-webkit-scrollbar{width:13px; height:13px;}
  #canvasContainer::-webkit-scrollbar-track{background:#222;}
  #canvasContainer::-webkit-scrollbar-thumb{background:#4a4e5a; border:3px solid #222; border-radius:7px;}
  #canvasContainer::-webkit-scrollbar-corner{background:#222;}

  /* ===== 右ドック ===== */
  #dock{width:280px; flex:none; display:flex; flex-direction:column; background:var(--panel);
    border-left:1px solid var(--bd); overflow:hidden;}
  #dockScroll{flex:1; overflow-y:auto; overflow-x:hidden; touch-action:pan-y;}
  #dockScroll::-webkit-scrollbar{width:9px;}
  #dockScroll::-webkit-scrollbar-thumb{background:#4a4e5a; border-radius:5px;}
  .sheet-handle,.sheet-tabs{display:none;}
  .panel{border-bottom:1px solid var(--bd);}
  .phdr{height:26px; width:100%; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--panel2);
    border:none; border-bottom:1px solid var(--bd); color:var(--fg); font-size:11.5px; font-weight:700; text-align:left; cursor:pointer;}
  .phdr .chev{color:var(--muted); transition:transform .12s;}
  .panel.collapsed .phdr .chev{transform:rotate(-90deg);}
  .panel.collapsed .phdr{border-bottom:none;}
  .panel.collapsed .pbody{display:none;}
  .phdr .sum{margin-left:auto; display:none; align-items:center; gap:6px; font-weight:400; font-size:10.5px; color:var(--muted);}
  .panel.collapsed .phdr .sum{display:flex;}
  .phdr .sum .swatch14{width:14px; height:14px; border:1px solid var(--muted);}
  .cp{display:flex; flex-direction:column; gap:8px; padding:10px;}
  .cp .row{display:flex; align-items:center; gap:8px;}
  .selbox{width:32px; height:32px; border:2px solid var(--accent); flex:none; background:var(--bg);}
  .selbox canvas{width:100%; height:100%;}
  .cdesc{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .cdesc .d1{font-size:11.5px; white-space:nowrap;}
  .cdesc .d2{font-size:10.5px; color:var(--muted); white-space:nowrap;}
  .tilebox{width:26px; height:26px; padding:0; border:1px solid var(--bd2); background:var(--panel2); cursor:pointer; flex:none;}
  .tilebox canvas{width:24px; height:24px;}
  .tilebox.active{outline:2px solid var(--danger); outline-offset:-2px;}
  .palrow{display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px 6px; max-width:260px;}
  .palcv{cursor:pointer; flex:none;}
  .maskbtn{width:34px; height:28px;}
  .maskbtn[aria-pressed="true"]{background:var(--sel); border-color:var(--accent); color:var(--accent);}
  .tabs{display:flex; gap:2px; padding:6px 8px 0; border-bottom:1px solid var(--bd);}
  .tab{height:26px; padding:0 12px; background:transparent; color:var(--muted); border:1px solid transparent;
    border-radius:4px 4px 0 0; font-size:11.5px; cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--panel2); color:var(--fg); border-color:var(--bd);
    border-bottom-color:var(--panel2); margin-bottom:-1px; font-weight:700;}
  .tabbody{display:none; flex-direction:column; align-items:center; gap:8px; padding:10px; background:var(--panel2);}
  .tabbody.show{display:flex;}
  .gradhead{width:208px; display:flex; align-items:center; gap:8px;}
  .stopbtn{width:22px; height:22px; padding:0; border:1px solid var(--bd2); cursor:pointer; flex:none;}
  .stopbtn.unused{background:transparent !important; border:1px dashed var(--bd2); cursor:default;}
  .corners{width:208px; display:flex; justify-content:space-between; align-items:center;}
  .corners>span{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted);}
  .cornerbtn{width:20px; height:20px; padding:0; border:1px solid var(--bd2); cursor:pointer;}
  .bcv{border:1px solid var(--bd2); cursor:pointer;}
  /* グラデの帯の箱: 大きさを固定して、帯を描き直しても箱の大きさが変わらないようにする（大きさの監視が繰り返さない） */
  .gradbox{width:208px; height:24px;}
  .tilebtns{width:208px; display:flex; gap:6px;}
  /* パターンの下の欄: 位相・一筆ごとにずらす（グラデ・グリッド・タイルのどのタブでも同じものが見える）。タブの中身とは線で分ける */
  .patfoot{display:flex; align-items:center; gap:10px; padding:7px 10px; border-top:1px solid var(--bd);}
  .pf-ctl{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .pf-phase{display:flex; align-items:center; gap:6px;}
  .scr{height:27px; width:100%; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--panel);
    color:var(--fg3); border:none; border-bottom:1px solid var(--bd); text-align:left; cursor:pointer;}
  .scr.open{background:var(--hdr-open); color:var(--fg);}
  .scr:disabled{cursor:default; color:var(--dim);}
  .scr .nm{flex:1; font-size:11.5px; font-weight:700;}
  .scr .st{font-size:10.5px; color:var(--accent);}
  .scr .scricon{color:var(--dim);}
  .scr.open .scricon{color:var(--accent);}
  .lrow{height:32px; display:flex; align-items:center; gap:8px; padding:0 8px 0 26px; border-bottom:1px solid var(--bd); cursor:pointer;}
  .lrow:hover{background:#262a31;}
  .lrow.target,.lrow.target:hover{background:var(--sel);}
  .lrow .nm{flex:1; min-width:0; font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lrow .lc{font-size:10.5px; color:var(--muted); white-space:nowrap;}
  .lrow.target .lc{display:none;}
  .lrow .tgt{display:none; align-items:center; gap:4px; color:var(--accent); font-size:10.5px;}
  .lrow.target .tgt{display:flex;}
  .lrow .spc{width:20px; flex:none;}
  .eye{width:20px; height:20px; display:flex; align-items:center; justify-content:center; padding:0;
    background:transparent; border:none; color:var(--fg); cursor:pointer; flex:none;}
  .eye[aria-pressed="false"]{color:var(--dim);}
  .thumb{width:36px; height:22px; border:1px solid var(--bd2); flex:none;}
  .lfoot{display:flex; flex-direction:column; gap:4px; padding:7px 8px;}
  .lfoot .sub{display:flex; gap:12px; padding-left:18px;}
  .lfoot .sub label.chk{font-size:11px;}
  .lfoot .btns{display:flex; gap:6px; margin-top:2px; align-items:center;}
  .navbody{display:flex; justify-content:center; padding:8px;}
  .navcv{cursor:pointer; border:1px solid var(--bd2); touch-action:none;}

  /* ===== ステータスバー ===== */
  #statusbar{flex:none; height:26px; display:flex; align-items:center; gap:14px; padding:0 6px 0 10px;
    background:var(--panel); border-top:1px solid var(--bd); font-size:11px; white-space:nowrap; overflow:hidden;}
  .st-chip{padding:1px 7px; border:1px solid var(--bd2); border-radius:3px; background:none; color:var(--fg);
    font-size:11px; line-height:16px; flex:none;}
  button.st-chip{cursor:pointer;}
  button.st-chip:hover{border-color:#5a5f6e; background:var(--panel2);}
  .st-chip.acc{border-color:var(--accent); color:var(--accent);}
  .st-div{width:1px; height:14px; background:var(--bd); flex:none;}
  #stPress{color:var(--muted); flex:none;}
  #stHint{flex:1 1 auto; min-width:0; text-align:right; color:var(--muted); overflow:hidden; text-overflow:ellipsis;}
  .zoomgrp{display:flex; align-items:center; gap:2px; flex:none;}
  .zbtn{width:22px; height:20px; display:flex; align-items:center; justify-content:center; padding:0;
    background:transparent; border:1px solid var(--bd2); border-radius:3px; color:var(--fg); cursor:pointer;}
  .zbtn:hover{background:var(--panel2);}
  .zbtn:disabled{opacity:.4; cursor:default;}
  .zbtn.fit{margin-left:4px;}
  #stZoom{width:46px; text-align:center;}

  /* ===== モーダル ===== */
  #modalOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:500;
  }
  #modalOverlay.show{display:flex;}
  .modal{
    background:var(--panel2); border:1px solid var(--bd2); border-radius:6px;
    box-shadow:0 12px 40px rgba(0,0,0,.6); min-width:260px; max-width:92vw;
  }
  .modal-title{padding:8px 14px; border-bottom:1px solid var(--bd); font-weight:600; font-size:12.5px;}
  .modal-body{padding:14px;}
  .modal-foot{padding:10px 14px; border-top:1px solid var(--bd); display:flex; justify-content:flex-end; gap:8px;}
  button.ui{
    display:block; width:100%; padding:4px 6px; margin-bottom:3px;
    background:var(--panel2); color:var(--fg); border:1px solid var(--bd2);
    border-radius:3px; cursor:pointer; font-size:12px; font-family:inherit; text-align:center;
  }
  button.ui:hover{background:#333742; border-color:#5a5f6e;}
  button.ui.small{width:auto; display:inline-block; padding:3px 8px; font-size:11px;}
  .modal-foot button.ui{width:auto; min-width:80px; margin:0; padding:5px 14px;}
  .row{display:flex; align-items:center; gap:6px; margin:3px 0;}
  input[type=number]{
    width:52px; background:var(--bg); color:var(--fg); border:1px solid var(--bd2);
    border-radius:3px; padding:2px 4px; font-size:12px;
  }
  .pal-pick{display:grid; grid-template-columns:repeat(8,38px); gap:3px;}
  .pal-pick .cell{
    width:38px; height:38px; border:1px solid var(--bd2); cursor:pointer; position:relative;
    display:flex; align-items:flex-start; justify-content:flex-start;
  }
  .pal-pick .cell span{font-size:9px; padding:1px 2px; pointer-events:none;
    font-family:ui-monospace,Consolas,monospace;}
  .pal-pick .cell.cur{outline:2px solid var(--accent); outline-offset:-2px;}
  .slider-row{display:grid; grid-template-columns:18px 1fr 24px; gap:8px; align-items:center; margin:5px 0;}
  .slider-row b{font-size:12px;}

  /* ===== リファレンスマニュアル ===== */
  .manual{width:680px; max-width:86vw; max-height:68vh; overflow-y:auto;
    padding-right:10px; line-height:1.7; font-size:12px;}
  .manual h2{font-size:13.5px; color:var(--accent); margin:18px 0 6px;
    padding-bottom:3px; border-bottom:1px solid var(--bd);}
  .manual h2:first-of-type{margin-top:0;}
  .manual h3{font-size:12px; margin:10px 0 3px; color:var(--fg);}
  .manual p{margin:4px 0; color:#c3c7d1;}
  .manual ul{margin:4px 0 8px 18px;}
  .manual li{margin:2.5px 0; color:#c3c7d1;}
  .manual b{color:var(--fg);}
  .manual table{border-collapse:collapse; margin:6px 0 10px; width:100%;}
  .manual th,.manual td{border:1px solid var(--bd); padding:4px 8px;
    text-align:left; vertical-align:top; color:#c3c7d1;}
  .manual th{background:var(--panel); color:var(--muted); font-weight:600; white-space:nowrap;}
  .manual td:first-child{white-space:nowrap;}
  .manual kbd{font-family:ui-monospace,Consolas,monospace; background:var(--bg);
    border:1px solid var(--bd2); border-bottom-width:2px; border-radius:3px;
    padding:0 5px; font-size:11px; white-space:nowrap; color:var(--fg);}
  .manual .toc{display:flex; flex-wrap:wrap; gap:4px 12px; padding:8px 12px;
    background:var(--panel); border:1px solid var(--bd); border-radius:4px; margin-bottom:6px;}
  .manual .toc a{color:var(--accent); text-decoration:none; font-size:11.5px; cursor:pointer;}
  .manual .toc a:hover{text-decoration:underline;}
  .manual .note{color:var(--muted); font-size:11px;}
  .manual::-webkit-scrollbar{width:9px;}
  .manual::-webkit-scrollbar-thumb{background:#4a4e5a; border-radius:5px;}
  .about-logo{display:flex; height:14px; border:1px solid #000; width:fit-content; margin:8px 0;}
  .about-logo i{width:14px; height:12px; display:block;}

  /* ===== スマホ（820px以下） ===== */
  #topbar,#bottombar,#sheetShade,#menuSheet{display:none;}
  @media (max-width:820px){

<script>
"use strict";
/* =================================================================
   Retro Pixel Paint  -  ブラウザ版（8色版と16色版の統合）
   VB.NET (WinForms) 版 RetroPixelPaint8 / RetroPixelPaint の移植
   解像度モード(RES)とカラーモード(COLOR)を仕様表で切り替える。
   縦長ドットは4x2ディザ(縦縞ハーフトーン)、正方ピクセルは4x4ベイヤー(DITHER)
   ================================================================= */

const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const $=id=>document.getElementById(id);

/* ===ENGINE-START=== */

// ===== 仕様表 =====
// 解像度モードとカラーモードの違いはここに集める。エンジンは表の行を見て動き、RESとCOLORは互いを参照しない。
// DITHER: ディザ行列とタイルの形（縦長ドット=4x2行列・8段 / 正方ピクセル=4x4ベイヤー・16段）
//   mx,my=行列(タイル)の横・縦、levels=混合比率の段数(位相の数も同じ)、gradSteps=グラデ1区間の段数
const DITHER={
  tall4x2:{key:"tall4x2",mx:4,my:2,levels:8,gradSteps:9,
    matrix:[[0,4,2,6],[3,7,1,5]]},
  bayer4:{key:"bayer4",mx:4,my:4,levels:16,gradSteps:17,
    matrix:[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]]},
};
// RES: 解像度モード（論理の幅・高さ、1ドットの縦の倍率aspectY、使うディザ）。idは.rpiの解像度モード番号
const RES=[
  {id:0,w:320,h:200,aspectY:1,dither:DITHER.bayer4},   // 320×200
  {id:1,w:320,h:400,aspectY:1,dither:DITHER.bayer4},   // 320×400
  {id:2,w:640,h:200,aspectY:2,dither:DITHER.tall4x2},  // 640×200（縦長ドット）
  {id:3,w:640,h:400,aspectY:2,dither:DITHER.tall4x2},  // 640×400（縦長ドット）
  {id:4,w:640,h:400,aspectY:1,dither:DITHER.bayer4},   // 640×400
  {id:5,w:640,h:800,aspectY:1,dither:DITHER.bayer4},   // 640×800
];
const RES_DEFAULT=2;
// COLOR: カラーモード（色数、1色のRGB各ビット数、パレットを編集できるか）。idはパレットモードの番号
const COLOR=[
  {id:0,key:"digital8",count:8,bits:1,editable:false},  // 8色デジタル
  {id:1,key:"analog8",count:8,bits:3,editable:true},    // 8色アナログ（512色中8色）
  {id:2,key:"analog16",count:16,bits:4,editable:true},  // 16色アナログ（4096色中16色）
];
const MAX_COLORS=Math.max(...COLOR.map(c=>c.count));

// ===== ColorEngine =====
const TRANSPARENT_INDEX=-1;
const PaletteMode={Digital8:0,Custom8:1,Analog16:2};  // 値は COLOR の id
// 16色アナログの既定パレット: 0〜7番はデジタル8色と同じ並び（背景色・線色・グラデ・グリッドの色番号がどのモードでも同じ色になる）。
// 8〜15番は16色版の既定パレットのうちデジタル8色にない色（橙・明るい灰・暗い灰・暗い赤・暗い緑・暗い青・肌色・茶）
const DIGITAL8_RGB=[[0,0,0],[0,0,255],[255,0,0],[255,0,255],[0,255,0],[0,255,255],[255,255,0],[255,255,255]];
const ANALOG16_EXTRA=[[221,119,51],[170,170,170],[85,85,85],[170,51,51],[51,170,51],[51,51,170],[221,170,136],[136,85,34]];

class ColorEngine{
  constructor(){
    this.palette=[]; // [r,g,b] × 色数
    this.mode=PaletteMode.Digital8;
    this.initDigital8();
  }
  /** 今のカラーモードの仕様（COLOR表の行） */
  get spec(){ return COLOR[this.mode]; }
  /** 色数 */
  get count(){ return COLOR[this.mode].count; }
  initDigital8(){
    this.mode=PaletteMode.Digital8;
    this.palette=[[0,0,0],[0,0,255],[255,0,0],[255,0,255],[0,255,0],[0,255,255],[255,255,0],[255,255,255]];
  }
  initCustom8(){
    this.mode=PaletteMode.Custom8;
    this.palette=[[0,0,0],[0,0,255],[255,0,0],[255,0,255],[0,255,0],[0,255,255],[255,255,0],[255,255,255]]
      .map(c=>ColorEngine.snapTo512(c));
  }
  /** 16色アナログ（4096色中16色）の既定 */
  initAnalog16(){
    this.mode=PaletteMode.Analog16;
    this.palette=DIGITAL8_RGB.concat(ANALOG16_EXTRA).map(c=>c.slice());
  }
  /** カラーモードの既定パレットにする */
  initDefault(mode){
    if(mode===PaletteMode.Analog16)this.initAnalog16();
    else if(mode===PaletteMode.Custom8)this.initCustom8();
    else this.initDigital8();
  }
  // RGB各bitsビット ⇔ 8ビット（3ビット=512色の0〜7、4ビット=4096色の0〜15。4ビットは16色版と同じ v×17）
  static toBits(v,bits){ const m=(1<<bits)-1; return clamp(Math.round(v*m/255),0,m); }
  static fromBits(v,bits){ const m=(1<<bits)-1; if(v<=0)return 0; if(v>=m)return 255; return Math.round(v*255/m); }
  static to8Bit(v){ if(v<=0)return 0; if(v>=7)return 255; return Math.round(v*255/7); }
  static to3Bit(v){ return clamp(Math.round(v*7/255),0,7); }
  static snapTo512(c){ return [ColorEngine.to8Bit(ColorEngine.to3Bit(c[0])),
    ColorEngine.to8Bit(ColorEngine.to3Bit(c[1])), ColorEngine.to8Bit(ColorEngine.to3Bit(c[2]))]; }
  getColor(i){ if(i>=0&&i<this.count)return this.palette[i]; return null; }
  css(i){ const c=this.getColor(i); return c?`rgb(${c[0]},${c[1]},${c[2]})`:"transparent"; }
  findClosestIndex(r,g,b){
    let best=0,bd=Infinity;
    for(let i=0,n=this.count;i<n;i++){
      const p=this.palette[i];
      const dr=r-p[0],dg=g-p[1],db=b-p[2];
      const d=dr*dr+dg*dg+db*db;
      if(d<bd){bd=d;best=i;}
    }
    return best;
  }
}

// ===== DitherPattern (構造体相当: 常に新オブジェクトを生成) =====
function Pat(c1,c2,ratio,phase){ return {c1,c2,ratio,phase}; }
function PatSolid(i){ return Pat(i,i,0,0); }
function PatTransparent(){ return Pat(TRANSPARENT_INDEX,TRANSPARENT_INDEX,0,0); }
// levels = 混合比率の段数（DITHER表。縦長8・正方16）。比率0とlevelsが両端
function patIsSolid(p,levels){ return p.c1===p.c2||p.ratio===0||p.ratio===levels; }
function patIsFullyTransparent(p){ return p.c1===TRANSPARENT_INDEX&&p.c2===TRANSPARENT_INDEX; }
function patIsEffectivelyTransparent(p,levels){
  if(p.c1===TRANSPARENT_INDEX&&p.c2===TRANSPARENT_INDEX)return true;
  if(p.ratio<=0&&p.c1===TRANSPARENT_INDEX)return true;
  if(p.ratio>=levels&&p.c2===TRANSPARENT_INDEX)return true;
  return false;
}

// ===== DitherEngine (DITHER表の行列で2色を混ぜる: 縦長=4x2・縦縞ハーフトーン / 正方=4x4ベイヤー) =====
class DitherEngine{
  constructor(spec=RES[RES_DEFAULT].dither){ this.strokePhase=0; this.autoPhasePerStroke=false; this.configure(spec); }
  configure(spec){
    this.spec=spec; this.strokePhase%=spec.levels;
    // 行列の幅・高さは2のべき乗なので、1ドットごとの計算はビット演算で行う
    this._mxMask=spec.mx-1; this._mxShift=Math.log2(spec.mx); this._myMask=spec.my-1;
  }
  beginStroke(){ if(this.autoPhasePerStroke) this.strokePhase=(this.strokePhase+1)%this.spec.levels; }
  resolveColor(p,x,y){
    if(patIsFullyTransparent(p))return TRANSPARENT_INDEX;
    const d=this.spec, L=d.levels, r=p.ratio;
    if(r<=0)return p.c1;
    if(r>=L)return p.c2;
    const totalPhase=(p.phase+this.strokePhase)%L;
    const px=totalPhase&this._mxMask, py=(totalPhase>>this._mxShift)%d.my;
    const bx=(x+px)&this._mxMask, by=(y+py)&this._myMask;
    return d.matrix[by][bx]<r ? p.c2 : p.c1;
  }
  /** タイルの色: resolveColor と同じずらし方で、位相（と一筆ごとの位相）の分だけタイルをずらして読む */
  resolveTile(tile,p,x,y){
    const t=(((p&&p.phase)||0)+this.strokePhase)%this.spec.levels;
    return tile.resolveColor(x+(t&this._mxMask),y+((t>>this._mxShift)%this.spec.my));
  }
  /** 擬似透過のパターン: opacity 0=完全透明 〜 levels=不透明 */
  static createTransparencyPattern(colorIndex,opacity,phase,levels){
    if(opacity<=0)return PatTransparent();
    if(opacity>=levels)return PatSolid(colorIndex);
    return Pat(colorIndex,TRANSPARENT_INDEX,levels-opacity,phase);
  }
}

// ===== GradientPalette (最大4色、各セグメントはDITHER表のgradSteps段階: 縦長9・正方17) =====
class GradientPalette{
  constructor(spec=RES[RES_DEFAULT].dither){
    this.MAX_STOPS=4; this.spec=spec;
    this.stopColors=[0,7,-2,-2];
    this.stopCount=2;
    this.entries=[]; this.entryCount=0;
    this.generate();
  }
  get ENTRIES_PER_SEG(){ return this.spec.gradSteps; }
  configure(spec){ this.spec=spec; this.generate(); }
  generate(){
    if(this.stopCount<2)this.stopCount=2;
    const segCount=this.stopCount-1;
    this.entryCount=this.ENTRIES_PER_SEG*segCount+1;
    this.entries=new Array(this.entryCount);
    let pos=0;
    for(let seg=0;seg<segCount;seg++){
      const c1=this.stopColors[seg], c2=this.stopColors[seg+1];
      const steps=(seg<segCount-1)?this.ENTRIES_PER_SEG:this.ENTRIES_PER_SEG+1;
      for(let i=0;i<steps;i++){
        const ratio=Math.min(this.spec.levels,i);
        if(pos<this.entryCount){ this.entries[pos]=Pat(c1,c2,ratio,0); pos++; }
      }
    }
  }
}

// ===== TilePattern (rows行×cols列: 縦長=2行×4列 / 正方=4行×4列) =====
class TilePattern{
  constructor(rows=RES[RES_DEFAULT].dither.my,cols=RES[RES_DEFAULT].dither.mx){
    this.tile=[];
    for(let py=0;py<rows;py++)this.tile.push(new Array(cols).fill(0));
  }
  get rows(){ return this.tile.length; }
  get cols(){ return this.tile[0].length; }
  resolveColor(x,y){ return this.tile[y&(this.tile.length-1)][x&(this.tile[0].length-1)]; }
  clone(){ const t=new TilePattern(this.rows,this.cols);
    for(let py=0;py<this.rows;py++)for(let px=0;px<this.cols;px++)t.tile[py][px]=this.tile[py][px];
    return t; }
}

// ===== GridPalette (16x16、四隅バイリニア) =====
class GridPalette{
  constructor(spec=RES[RES_DEFAULT].dither){
    this.GRID_SIZE=16; this.spec=spec;
    this.cornerTL=0; this.cornerTR=7; this.cornerBL=4; this.cornerBR=2;
    this.cells=[];
    this.generate();
  }
  configure(spec){ this.spec=spec; this.generate(); }
  generate(){
    const gs=this.GRID_SIZE, maxIdx=gs-1, d=this.spec;
    this.cells=[];
    for(let gy=0;gy<gs;gy++){
      const row=[];
      for(let gx=0;gx<gs;gx++){
        const tile=new TilePattern(d.my,d.mx);
        const fx=gx/maxIdx, fy=gy/maxIdx;
        const wTL=(1-fx)*(1-fy), wTR=fx*(1-fy), wBL=(1-fx)*fy;
        const phX=(gx*3)%d.mx, phY=(gy*3)%d.my;
        for(let py=0;py<d.my;py++){
          for(let px=0;px<d.mx;px++){
            const bx=(px+phX)%d.mx, by=(py+phY)%d.my;
            const threshold=(d.matrix[by][bx]+0.5)/d.levels;
            let ci;
            if(threshold<wTL)ci=this.cornerTL;
            else if(threshold<wTL+wTR)ci=this.cornerTR;
            else if(threshold<wTL+wTR+wBL)ci=this.cornerBL;
            else ci=this.cornerBR;
            tile.tile[py][px]=ci;
          }
        }
        row.push(tile);
      }
      this.cells.push(row);
    }
  }
}

// ===== PressureManager (Pointer Events筆圧) =====
class PressureManager{
  constructor(){
    this.enabled=false;
    this.currentPressure=1.0;
    this.pressureBrushSize=true;
    this.pressureGradient=false;
    this.pressureCurve=2.0;
    this.pseudoTransparency=0;
    this.diagInfo="";
  }
  get isEnabled(){ return this.enabled; }
  enable(){ this.enabled=true; }
  disable(){ this.enabled=false; this.currentPressure=1.0; this.diagInfo=""; }
  // PointerEventから筆圧を取得（ペンのみ実筆圧、マウス等は1.0）
  processPointerEvent(ev){
    if(!this.enabled)return;
    if(ev.pointerType==="pen"){
      const raw=clamp(ev.pressure,0,1);
      this.currentPressure=Math.pow(raw,this.pressureCurve);
      this.diagInfo="pen";
    }else{
      this.currentPressure=1.0;
      this.diagInfo=ev.pointerType||"";
    }
  }
  getBrushSize(maxSize){
    if(!this.pressureBrushSize||!this.isEnabled)return maxSize;
    return Math.max(1,Math.round(1.0+(maxSize-1.0)*this.currentPressure));
  }
  getGradientPosition(entryCount){
    if(!this.pressureGradient||!this.isEnabled)return 0;
    return Math.min(entryCount-1,Math.floor(this.currentPressure*entryCount));
  }
}

// ===== DrawTool / DotMode =====
const DrawTool={Pencil:0,Line:1,Rectangle:2,FilledRectangle:3,Ellipse:4,FilledEllipse:5,
  Fill:6,GradientFill:7,ColorPicker:8,CanvasShift:9,Eraser:10};
const DotMode={DoubleHeight:0,Scanline:1};

// ===== DrawingEngine (大きさと1ドットの形はRES表の行で決まる。既定は640x200論理 / 640x400表示) =====
class DrawingEngine{
  constructor(colorEngine,res=RES[RES_DEFAULT]){
    this.colors=colorEngine;
    this.dither=new DitherEngine(res.dither);
    this.pressure=new PressureManager();
    this.currentDotMode=DotMode.DoubleHeight;
    this.currentPattern=PatSolid(0);
    this.currentTile=null;
    this.useTileForDrawing=false;
    this.brushSize=1;
    this.eraserSize=4;
    this.currentTool=DrawTool.Pencil;
    this.drawOnLineLayer=false;
    // 表画面(0)・裏画面(1)。どちらも通常レイヤー(pix)と線画レイヤー(line)を持つ。線色と、線画・通常レイヤーの表示も画面ごと
    this.screens=[{lineColor:0,lineVisible:true,pixVisible:true},{lineColor:0,lineVisible:true,pixVisible:true}];
    this.baseColor=[255,255,255];          // 通常レイヤーを隠したときの下地の色（表示だけで、絵には入らない）
    this.screen=0;                         // 表示中の画面。描画先はこの画面の通常レイヤーか線画レイヤー
    this.srcOther=false;                   // もう一方の画面から描く（ストロークの始めにアプリが決める）
    this.srcIncludeLine=false;             // 通常レイヤーへ写すとき、相手の線画がある所は相手の線色を写す
    this.srcOverwriteTransparent=false;    // 線画レイヤーへ写すとき、相手の線画の透明な所でこちらの線画を消す
    this.lineLayerFillBoundary=false;
    this.lineLayerOnlyBoundary=false;
    this.colorMask=new Array(MAX_COLORS).fill(false);
    this.MAX_UNDO=50;
    this.MAX_UNDO_BYTES=64*1024*1024;      // 元に戻す履歴の合計の上限（超えたら古いものから捨てる）
    this.configure(res);
  }
  /** 解像度モードを設定し、キャンバスを作り直す（絵と元に戻す履歴は消える） */
  configure(res){
    this.res=res;
    this.w=res.w; this.h=res.h;               // 論理の幅・高さ
    this.aspectY=res.aspectY;                 // 1ドットの縦の倍率（縦長2・正方1）
    this.displayH=res.h*res.aspectY;          // 表示の高さ
    this.dither.configure(res.dither);
    for(const sc of this.screens){
      sc.pix=new Int8Array(this.w*this.h);      // 通常レイヤー: パレットインデックス(-1=透明)
      sc.line=new Uint8Array(this.w*this.h);    // 線画レイヤー(0/1)
      sc.touched=false;
      sc.pixVisible=true;                       // 通常レイヤーの表示は、作り直したら表示に戻す（ファイルにも保存しない）
    }
    this.screen=0; this._bind();
    this._undoStack=[]; this._redoStack=[];
    this.clearCanvas(0);
  }
  /** pixels・linePixels は表示中の画面のレイヤーを指す */
  _bind(){ const sc=this.screens[this.screen]; this.pixels=sc.pix; this.linePixels=sc.line; }
  /** 表示する画面を替える（描画先もその画面になる） */
  showScreen(s){ this.screen=s?1:0; this._bind(); }
  get lineLayerColor(){ return this.screens[this.screen].lineColor; }
  set lineLayerColor(v){ this.screens[this.screen].lineColor=v; }
  get lineLayerVisible(){ return this.screens[this.screen].lineVisible; }
  set lineLayerVisible(v){ this.screens[this.screen].lineVisible=v; }
  get normalLayerVisible(){ return this.screens[this.screen].pixVisible!==false; }
  set normalLayerVisible(v){ this.screens[this.screen].pixVisible=!!v; }
  /** 両方の画面を消す（通常レイヤーは colorIndex、線画は透明） */
  /** 元に戻す・やり直しの履歴を消す */
  clearHistory(){ this._undoStack=[]; this._redoStack=[]; }
  clearAll(colorIndex=0){ for(const sc of this.screens){ sc.pix.fill(colorIndex); sc.line.fill(0); sc.touched=false; } }
  /** 画面 from の通常レイヤーと線画レイヤーを、画面 to へ写す（線色と表示はそのまま） */
  copyScreen(from,to){ this.screens[to].pix.set(this.screens[from].pix); this.screens[to].line.set(this.screens[from].line); }
  // レイヤー番号: 画面sの通常=2s、線画=2s+1（表の通常0・表の線画1・裏の通常2・裏の線画3）
  layerData(id){ const sc=this.screens[id>>1]; return (id&1)?sc.line:sc.pix; }
  get targetLayer(){ return this.screen*2+(this.drawOnLineLayer?1:0); }
  /** 描画先のレイヤー（ペン・図形・塗潰しなどが変える1枚） */
  targetLayers(){ return [this.targetLayer]; }
  /** 画面sの通常と線画 */
  screenLayers(s=this.screen){ return [s*2,s*2+1]; }
  get canvasWidth(){ return this.w; }
  get canvasHeight(){ return this.h; }
  get displayHeight(){ return this.displayH; }
  clearCanvas(colorIndex=0){ this.pixels.fill(colorIndex); }
  clearLineLayer(){ this.linePixels.fill(0); }
  /** 縦長ドット→正方ピクセル: 各行を2行に複製する（表・裏の通常と線画の4枚）。見た目は変わらない。元に戻す履歴は消える（段階5） */
  convertToSquare(res){
    const W=this.w, H=this.h;
    if(this.aspectY!==2||res.aspectY!==1||res.w!==W||res.h!==H*2)return false;
    const old=this.screens.map(sc=>({pix:sc.pix,line:sc.line,touched:sc.touched,vis:sc.pixVisible}));
    const scr=this.screen;
    this.configure(res);
    for(let s=0;s<2;s++){
      const sc=this.screens[s], o=old[s];
      for(let y=0;y<H;y++){
        const a=o.pix.subarray(y*W,(y+1)*W), b=o.line.subarray(y*W,(y+1)*W);
        sc.pix.set(a,2*y*W); sc.pix.set(a,(2*y+1)*W);
        sc.line.set(b,2*y*W); sc.line.set(b,(2*y+1)*W);
      }
      sc.touched=o.touched; sc.pixVisible=o.vis;   // 通常レイヤーの表示もそのまま
    }
    this.showScreen(scr);
    return true;
  }
  /** 正方ピクセル→縦長ドット: 1行おきに取り出す（表・裏の通常と線画の4枚）。row 0=偶数の行（Y=0,2,4…）・1=奇数の行（Y=1,3,5…）。
      lineOr なら線画は2行を重ねる（上下どちらかに線があれば線）。元に戻す履歴は消える（段階6の追加） */
  convertToTall(res,row,lineOr){
    const W=this.w, H=this.h;
    if(this.aspectY!==1||res.aspectY!==2||res.w!==W||res.h*2!==H)return false;
    const old=this.screens.map(sc=>({pix:sc.pix,line:sc.line,touched:sc.touched,vis:sc.pixVisible}));
    const scr=this.screen;
    this.configure(res);
    for(let s=0;s<2;s++){
      const sc=this.screens[s], o=old[s];
      sc.pix.set(DrawingEngine.halveRows(o.pix,W,H,row,false));
      sc.line.set(DrawingEngine.halveRows(o.line,W,H,row,lineOr));
      sc.touched=o.touched; sc.pixVisible=o.vis;   // 通常レイヤーの表示もそのまま
    }
    this.showScreen(scr);
    return true;
  }
  /** 高さ H の層から1行おきに取り出して高さ H/2 に（row 0=偶数の行・1=奇数の行）。or なら2行を重ねる（線画の 0/1 用） */
  static halveRows(src,W,H,row,or){
    const h=H>>1, out=new src.constructor(W*h), k=row?1:0;
    for(let y=0;y<h;y++){
      const a=2*y*W, d=y*W;
      if(or){ for(let x=0;x<W;x++)out[d+x]=(src[a+x]|src[a+W+x])?1:0; }
      else out.set(src.subarray(a+k*W,a+k*W+W),d);
    }
    return out;
  }
  /** 幅320 → 幅640 に拡大（段階6の追加）: res が縦長ドットなら1ドットを横2つに（同じ行数）、正方ピクセルなら縦横2つずつに。
      見た目は変わらない（表・裏の通常と線画の4枚）。元に戻す履歴は消える */
  enlargeTo(res){
    const W=this.w, H=this.h;
    if(this.aspectY!==1||res.w!==W*2||res.h!==(res.aspectY===2?H:H*2))return false;
    const old=this.screens.map(sc=>({pix:sc.pix,line:sc.line,touched:sc.touched,vis:sc.pixVisible}));
    const scr=this.screen, rows=res.aspectY===2?1:2, W2=res.w;
    this.configure(res);
    for(let s=0;s<2;s++){
      const sc=this.screens[s], o=old[s];
      for(const [src,dst] of [[o.pix,sc.pix],[o.line,sc.line]]){
        for(let y=0;y<H;y++){
          const d=y*rows*W2;
          for(let x=0;x<W;x++){ const v=src[y*W+x]; dst[d+2*x]=v; dst[d+2*x+1]=v; }
          if(rows===2)dst.copyWithin(d+W2,d,d+W2);
        }
      }
      sc.touched=o.touched; sc.pixVisible=o.vis;   // 通常レイヤーの表示もそのまま
    }
    this.showScreen(scr);
    return true;
  }

  // --- Undo/Redo: 操作ごとに変わった層だけを記録する ---
  // layers はレイヤー番号の配列。省略したときは表示中の画面の通常と線画（段階3までと同じ）
  // lc: 線色も記録する画面の番号（インポートで線画と一緒に線色も読み込むとき。段階5）
  _snap(layers,lc){
    const ls=(layers||this.screenLayers()).slice();
    const st={layers:ls, data:ls.map(id=>this.layerData(id).slice())};
    if(lc&&lc.length){ st.lc=lc.slice(); st.lcv=lc.map(sc=>this.screens[sc].lineColor); }
    return st;
  }
  _restore(s){
    s.layers.forEach((id,k)=>this.layerData(id).set(s.data[k]));
    if(s.lc)s.lc.forEach((sc,k)=>{ this.screens[sc].lineColor=s.lcv[k]; });
    this.lastRestored=s.layers;
  }
  _size(s){ let n=0; for(const d of s.data)n+=d.length; return n; }
  /** 履歴の上限: 50回まで。元に戻す・やり直しの合計が64MBを超えたら、古いものから捨てる */
  _trim(){
    let bytes=0;
    for(const st of this._undoStack)bytes+=this._size(st);
    for(const st of this._redoStack)bytes+=this._size(st);
    while(this._undoStack.length>this.MAX_UNDO||(bytes>this.MAX_UNDO_BYTES&&this._undoStack.length>1)){
      bytes-=this._size(this._undoStack.shift());
    }
  }
  pushUndo(layers,lc){
    const st=this._snap(layers,lc);
    for(const id of st.layers)this.screens[id>>1].touched=true;   // 描き始めた画面の印（.rp8 保存の確認に使う）
    this._undoStack.push(st);
    this._redoStack.length=0;
    this._trim();
  }
  undo(){
    if(this._undoStack.length===0)return false;
    const st=this._undoStack.pop();
    this._redoStack.push(this._snap(st.layers,st.lc));
    this._restore(st);
    return true;
  }
  redo(){
    if(this._redoStack.length===0)return false;
    const st=this._redoStack.pop();
    this._undoStack.push(this._snap(st.layers,st.lc));
    this._restore(st);
    this._trim();
    return true;
  }
  cloneState(layers){ return this._snap(layers); }
  restoreState(s){ this._restore(s); }
  /** 直前のpushUndo時点まで巻き戻す(redoスタックを汚さない)。2本指ジェスチャ移行時等に使用 */
  cancelToLastUndo(){
    if(this._undoStack.length===0)return false;
    this._restore(this._undoStack.pop());
    return true;
  }

  // --- ピクセル操作 ---
  putPixel(x,y,pattern){
    const w=this.w;
    if(x<0||x>=w||y<0||y>=this.h)return;
    if(this.srcOther){
      // もう一方の画面から描く: 描く形はツールどおり、色はもう一方の画面の同じ位置から（パターンは使わない）
      const i=y*w+x, o=this.screens[1-this.screen];
      if(this.drawOnLineLayer){
        // 線画レイヤーへ: 相手の線画だけを写す。「透明も上書き」なら相手の線画の透明な所でこちらの線画を消す
        if(o.line[i])this.linePixels[i]=1;
        else if(this.srcOverwriteTransparent)this.linePixels[i]=0;
        return;
      }
      // 通常レイヤーへ: 相手の色を写す（16色版の「裏画面で描画」）。「線画も含める」なら相手の線画がある所は相手の線色
      const cur=this.pixels[i];
      if(cur>=0&&cur<this.colors.count&&this.colorMask[cur])return;
      let ci=o.pix[i];
      if(this.srcIncludeLine&&o.line[i])ci=o.lineColor;
      if(ci<0)return;
      this.pixels[i]=ci;
      return;
    }
    if(this.drawOnLineLayer){
      // 線画レイヤーモード: 透明パターン→消しゴム、それ以外→ドット打ち
      this.linePixels[y*w+x]=patIsFullyTransparent(pattern)?0:1;
      return;
    }
    // Xキー・ペンの消しゴム側で、描画色がパターン（タイル）のとき: そのパターンの透明でない所だけを消す（位相も描くときと同じ）
    const mk=pattern.eraseMask;
    if(mk&&(mk.tile?this.dither.resolveTile(mk.tile,mk.pat,x,y):this.dither.resolveColor(mk.pat,x,y))===TRANSPARENT_INDEX)return;
    const curIdx=this.pixels[y*w+x];
    if(curIdx>=0&&curIdx<this.colors.count&&this.colorMask[curIdx])return;
    let colorIdx;
    if(this.useTileForDrawing&&this.currentTile!==null){
      colorIdx=this.dither.resolveTile(this.currentTile,pattern,x,y);
    }else{
      colorIdx=this.dither.resolveColor(pattern,x,y);
    }
    if(colorIdx===TRANSPARENT_INDEX)return;
    this.pixels[y*w+x]=colorIdx;
  }
  // ブラシ: 正方ピクセルは円（16色版と同じ dx²+dy²≦r²）、縦長ドットは縦2倍表示の補正で縦半径を横の約半分にした楕円
  putBrush(cx,cy,pattern,size){
    if(size<=1){ this.putPixel(cx,cy,pattern); return; }
    if(this.aspectY===1){
      const r=size>>1, r2=r*r;
      for(let dy=-r;dy<=r;dy++){
        for(let dx=-r;dx<=r;dx++){
          if(dx*dx+dy*dy<=r2)this.putPixel(cx+dx,cy+dy,pattern);
        }
      }
      return;
    }
    const rx=size>>1;
    const ry=Math.max(1,(rx+1)>>1);
    const rx2=rx*rx, ry2=ry*ry, limit=rx2*ry2;
    for(let dy=-ry;dy<=ry;dy++){
      for(let dx=-rx;dx<=rx;dx++){
        if(dx*dx*ry2+dy*dy*rx2<=limit)this.putPixel(cx+dx,cy+dy,pattern);
      }
    }
  }
  getEffectiveBrushSize(){ return this.pressure.getBrushSize(this.brushSize); }

  // 筆圧考慮パターン取得(筆圧グラデ時はタイル一時無効化、実質透明エントリはスキップ)
  getEffectivePattern(gradPalette){
    const L=this.dither.spec.levels;
    let pat=this.currentPattern;
    let useTile=(this.currentTile!==null);
    if(this.pressure.pressureGradient&&this.pressure.isEnabled&&gradPalette&&gradPalette.entryCount>0){
      const pos=this.pressure.getGradientPosition(gradPalette.entryCount);
      pat=gradPalette.entries[pos];
      if(patIsEffectivelyTransparent(pat,L)){
        let found=false;
        for(let bk=pos-1;bk>=0;bk--){
          if(!patIsEffectivelyTransparent(gradPalette.entries[bk],L)){pat=gradPalette.entries[bk];found=true;break;}
        }
        if(!found){
          for(let fw=pos+1;fw<gradPalette.entryCount;fw++){
            if(!patIsEffectivelyTransparent(gradPalette.entries[fw],L)){pat=gradPalette.entries[fw];found=true;break;}
          }
        }
      }
      useTile=false;
    }
    if(this.pressure.pseudoTransparency>0&&!patIsFullyTransparent(pat)){
      const baseColor=(pat.ratio<=L/2)?pat.c1:pat.c2;
      pat=DitherEngine.createTransparencyPattern(baseColor,L-this.pressure.pseudoTransparency,pat.phase,L);
      useTile=false;
    }
    this.useTileForDrawing=useTile;
    return pat;
  }

  // --- 図形描画 ---
  drawLine(x0,y0,x1,y1,pattern,brushSz){
    let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
    const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
    let err=dx-dy;
    for(;;){
      this.putBrush(x0,y0,pattern,brushSz);
      if(x0===x1&&y0===y1)break;
      const e2=2*err;
      if(e2>-dy){err-=dy;x0+=sx;}
      if(e2<dx){err+=dx;y0+=sy;}
    }
  }
  drawRect(x0,y0,x1,y1,pattern,filled,brushSize=1){
    const lx=Math.min(x0,x1),rx=Math.max(x0,x1);
    const ly=Math.min(y0,y1),ry=Math.max(y0,y1);
    if(filled){
      for(let yi=ly;yi<=ry;yi++)for(let xi=lx;xi<=rx;xi++)this.putPixel(xi,yi,pattern);
    }else{
      for(let xi=lx;xi<=rx;xi++){this.putBrush(xi,ly,pattern,brushSize);this.putBrush(xi,ry,pattern,brushSize);}
      for(let yi=ly;yi<=ry;yi++){this.putBrush(lx,yi,pattern,brushSize);this.putBrush(rx,yi,pattern,brushSize);}
    }
  }
  drawEllipse(x0,y0,x1,y1,pattern,filled,brushSize=1){
    const lx=Math.min(x0,x1),rx=Math.max(x0,x1);
    const ly=Math.min(y0,y1),ry=Math.max(y0,y1);
    const cx=(lx+rx)/2, cy=(ly+ry)/2;
    const a=(rx-lx)/2, b=(ry-ly)/2;
    if(a<0.5||b<0.5){this.drawLine(lx,ly,rx,ry,pattern,brushSize);return;}
    if(filled){
      for(let yi=ly;yi<=ry;yi++)for(let xi=lx;xi<=rx;xi++){
        const dx2=(xi-cx)/a, dy2=(yi-cy)/b;
        if(dx2*dx2+dy2*dy2<=1.0)this.putPixel(xi,yi,pattern);
      }
    }else{
      const ia=Math.trunc(a), ib=Math.trunc(b);
      if(ia<1||ib<1){this.drawLine(lx,ly,rx,ry,pattern,brushSize);return;}
      const icx=Math.trunc(cx), icy=Math.trunc(cy);
      const plot=(px,py)=>{
        this.putBrush(icx+px,icy+py,pattern,brushSize);
        this.putBrush(icx-px,icy+py,pattern,brushSize);
        this.putBrush(icx+px,icy-py,pattern,brushSize);
        this.putBrush(icx-px,icy-py,pattern,brushSize);
      };
      // 中点アルゴリズム（判定値は4倍して整数で。段階6の追加で、横の端が1ドットはみ出して円が横に広がっていたのを直した）
      const a2=ia*ia, b2=ib*ib;
      let x=0, y=ib, d=4*b2-4*a2*ib+a2;
      while(b2*x<a2*y){                          // 上下の弧（傾きが1より緩い所）
        plot(x,y);
        if(d<0){ x++; d+=4*b2*(2*x+1); }
        else{ x++; y--; d+=4*b2*(2*x+1)-8*a2*y; }
      }
      d=b2*(2*x+1)*(2*x+1)+4*a2*(y-1)*(y-1)-4*a2*b2;
      while(y>=0){                               // 左右の弧
        plot(x,y);
        if(y===0)break;
        if(d>0){ y--; d-=4*a2*(2*y-1); }
        else{ y--; x++; d+=8*b2*x-4*a2*(2*y-1); }
      }
      for(let xx=x+1;xx<=ia;xx++)plot(xx,0);     // とても平たい楕円: 横の端まで足す
    }
  }

  // スキャンライン方式FloodFill(線画レイヤー境界対応)
  floodFill(x,y,pattern){
    const w=this.w, h=this.h;
    if(x<0||x>=w||y<0||y>=h)return;

    if(this.drawOnLineLayer){
      // 線画レイヤー上のFill
      const oldVal=this.linePixels[y*w+x];
      const newVal=patIsFullyTransparent(pattern)?0:1;
      // もう一方の画面から描くときは、つながった範囲へ相手の線画を写す
      const src=this.srcOther?this.screens[1-this.screen].line:null, over=this.srcOverwriteTransparent;
      if(!src&&oldVal===newVal)return;
      const visited=new Uint8Array(w*h);
      const lp=this.linePixels;
      const stk=[[y,x,x]];
      while(stk.length>0){
        const [cy,xL0,xR0]=stk.pop();
        if(cy<0||cy>=h)continue;
        let xL=xL0,xR=xR0;
        while(xL>0&&lp[cy*w+xL-1]===oldVal&&!visited[cy*w+xL-1])xL--;
        while(xR<w-1&&lp[cy*w+xR+1]===oldVal&&!visited[cy*w+xR+1])xR++;
        let drew=false;
        for(let xi=xL;xi<=xR;xi++){
          const o=cy*w+xi;
          if(visited[o]||lp[o]!==oldVal)continue;
          visited[o]=1; lp[o]=src?(src[o]?1:(over?0:lp[o])):newVal; drew=true;
        }
        if(!drew)continue;
        for(const ny of [cy-1,cy+1]){
          if(ny<0||ny>=h)continue;
          let inSpan=false,spanStart=0;
          for(let xi=xL;xi<=xR;xi++){
            const o=ny*w+xi;
            if(lp[o]===oldVal&&!visited[o]){
              if(!inSpan){inSpan=true;spanStart=xi;}
            }else{
              if(inSpan){stk.push([ny,spanStart,xi-1]);inSpan=false;}
            }
          }
          if(inSpan)stk.push([ny,spanStart,xR]);
        }
      }
      return;
    }

    // メインキャンバスFloodFill
    const oldIdx=this.pixels[y*w+x];
    const useLineOnly=this.lineLayerOnlyBoundary;
    const useLineBound=this.lineLayerFillBoundary||useLineOnly;

    // 線画のみ境界モードで開始点が線画上なら何もしない
    if(useLineOnly&&this.linePixels[y*w+x])return;

    // 同色判定: タイル/線画のみ境界/もう一方の画面から描くときはスキップ
    if(!this.useTileForDrawing&&!useLineOnly&&!this.srcOther){
      if(patIsSolid(pattern,this.dither.spec.levels)){
        const solidIdx=this.dither.resolveColor(pattern,x,y);
        if(solidIdx===oldIdx)return;
      }
    }

    const visited=new Uint8Array(w*h);
    const px=this.pixels, lp=this.linePixels;
    const canF=(o)=>!visited[o]&&!(useLineBound&&lp[o])&&(useLineOnly||px[o]===oldIdx);
    const stk=[[y,x,x]];
    while(stk.length>0){
      const [cy,xL0,xR0]=stk.pop();
      if(cy<0||cy>=h)continue;
      let xL=xL0,xR=xR0;
      while(xL>0&&canF(cy*w+xL-1))xL--;
      while(xR<w-1&&canF(cy*w+xR+1))xR++;
      let drew=false;
      for(let xi=xL;xi<=xR;xi++){
        const o=cy*w+xi;
        if(visited[o])continue;
        if(useLineBound&&lp[o])continue;
        if(!useLineOnly&&px[o]!==oldIdx)continue;
        visited[o]=1;
        this.putPixel(xi,cy,pattern);
        drew=true;
      }
      if(!drew)continue;
      for(const ny of [cy-1,cy+1]){
        if(ny<0||ny>=h)continue;
        let inSpan=false,spanStart=0;
        for(let xi=xL;xi<=xR;xi++){
          if(canF(ny*w+xi)){
            if(!inSpan){inSpan=true;spanStart=xi;}
          }else{
            if(inSpan){stk.push([ny,spanStart,xi-1]);inSpan=false;}
          }
        }
        if(inSpan)stk.push([ny,spanStart,xR]);
      }
    }
  }

  gradientFill(x0,y0,x1,y1,gradPal){
    if(!gradPal||gradPal.entryCount<2)return;
    const dx=x1-x0, dy=y1-y0;
    const lenSq=dx*dx+dy*dy;
    if(lenSq<1.0)return;
    const w=this.w, h=this.h;
    for(let py=0;py<h;py++){
      for(let px=0;px<w;px++){
        let t=((px-x0)*dx+(py-y0)*dy)/lenSq;
        t=clamp(t,0,1);
        let entryIdx=Math.floor(t*(gradPal.entryCount-1));
        entryIdx=clamp(entryIdx,0,gradPal.entryCount-1);
        this.putPixel(px,py,gradPal.entries[entryIdx]);
      }
    }
  }

  // キャンバス全体ラップアラウンド移動
  // 線画はいつも属する画面と一緒に動く。both=true なら表と裏の両方（表裏を同期）、false なら表示中の画面だけ
  shiftCanvas(dx,dy,both=false){
    if(dx===0&&dy===0)return;
    const w=this.w, h=this.h;
    for(const sc of (both?this.screens:[this.screens[this.screen]])){
      const newPix=new Int8Array(w*h);
      const newLine=new Uint8Array(w*h);
      for(let y=0;y<h;y++){
        const sy=(((y-dy)%h)+h)%h;
        for(let x=0;x<w;x++){
          const sx=(((x-dx)%w)+w)%w;
          newPix[y*w+x]=sc.pix[sy*w+sx];
          newLine[y*w+x]=sc.line[sy*w+sx];
        }
      }
      sc.pix.set(newPix);
      sc.line.set(newLine);
    }
  }

  // 表示用ピクセルバッファ生成(Uint32 RGBA / 線画レイヤー合成)。幅×displayH
  // 縦長ドットは1行を2行に複製(スキャンラインは上段を黒)、正方ピクセルは1行ずつ
  renderTo(buf32){
    const n=this.colors.count, w=this.w, h=this.h;
    const pal=new Uint32Array(n);
    for(let i=0;i<n;i++){
      const c=this.colors.palette[i];
      pal[i]=(0xFF<<24|c[2]<<16|c[1]<<8|c[0])>>>0;
    }
    const black=0xFF000000>>>0;
    const lineCol=(this.lineLayerColor>=0&&this.lineLayerColor<n)?pal[this.lineLayerColor]:black;
    const tall=(this.aspectY===2);
    const scan=tall&&(this.currentDotMode===DotMode.Scanline);
    const lineVis=this.lineLayerVisible;
    // 通常レイヤーを隠しているときは、下地の色の上に線画だけを出す
    const pixVis=this.normalLayerVisible!==false, bc=this.baseColor||[255,255,255];
    const base=(0xFF<<24|bc[2]<<16|bc[1]<<8|bc[0])>>>0;
    for(let ly=0;ly<h;ly++){
      const src=ly*w;
      const r1=(tall?ly*2:ly)*w, r2=(tall?ly*2+1:ly)*w;
      for(let x=0;x<w;x++){
        const idx=this.pixels[src+x];
        let argb=pixVis?((idx>=0&&idx<n)?pal[idx]:0):base;
        if(lineVis&&this.linePixels[src+x])argb=lineCol;
        if(scan){ buf32[r1+x]=black; buf32[r2+x]=argb; }
        else{ buf32[r1+x]=argb; buf32[r2+x]=argb; }
      }
    }
  }
}

/** 矩形・楕円の範囲。s=始点、p=今の点（どちらも論理の座標）。返り値は両端を含む {x0,y0,x1,y1}。
    square（Shift）: 見た目で正方形・正円にする。幅と高さを「列の数」「行の数×asp（縦長ドットは1ドット＝横1×縦2）」で比べ、大きい方にそろえる。
    center（Ctrl・⌘）: 始点を中心にして、今の点までを半分の大きさにする（列と行は奇数で、中心の1ドットをはさむ） */
function shapeBox(s,p,square,center,asp){
  const sx=p.x<s.x?-1:1, sy=p.y<s.y?-1:1;
  let ax=Math.abs(p.x-s.x), ay=Math.abs(p.y-s.y);
  if(square){
    if(center){
      const S=Math.max(2*ax+1,(2*ay+1)*asp);
      ax=Math.round((S-1)/2); ay=Math.max(0,Math.round((S/asp-1)/2));
    }else{
      const S=Math.max(ax+1,(ay+1)*asp);
      ax=S-1; ay=Math.max(1,Math.round(S/asp))-1;
    }
  }
  return center?{x0:s.x-ax,y0:s.y-ay,x1:s.x+ax,y1:s.y+ay}:{x0:s.x,y0:s.y,x1:s.x+sx*ax,y1:s.y+sy*ay};
}

const container=$("canvasContainer");
const viewCanvas=$("viewCanvas");
const vctx=viewCanvas.getContext("2d");
const spacer=$("spacer");
let padX=0,padY=0;
let renderQueued=false;

function updateSpacer(){
  padX=Math.floor(container.clientWidth/2);
  padY=Math.floor(container.clientHeight/2);
  spacer.style.width=(engine.w*App.zoom+padX*2)+"px";
  spacer.style.height=(engine.displayH*App.zoom+padY*2)+"px";
}
// 表示用キャンバスの画素数は、画面で実際に占める実画素の数（ブラウザが位置と大きさを実画素にそろえたあとの数）にぴったり合わせる。
// ずれると画面に出すときに全体がわずかに拡大縮小されてにじむ。分かるときは ResizeObserver の device-pixel-content-box の値を使う
let _devBox=null, _devPending=false;
function resizeViewCanvas(){
  const dpr=window.devicePixelRatio||1;
  const w=container.clientWidth, h=container.clientHeight;
  viewCanvas.style.width=w+"px";
  viewCanvas.style.height=h+"px";
  const known=_devBox&&_devBox.cw===w&&_devBox.ch===h;
  const bw=Math.max(1,known?_devBox.w:Math.round(w*dpr)), bh=Math.max(1,known?_devBox.h:Math.round(h*dpr));
  if(viewCanvas.width!==bw)viewCanvas.width=bw;
  if(viewCanvas.height!==bh)viewCanvas.height=bh;
}
try{
  new ResizeObserver(entries=>{
    const e=entries[entries.length-1], s=e.devicePixelContentBoxSize&&e.devicePixelContentBoxSize[0];
    if(!s)return;
    // 表示の大きさ×画素比から2画素以上離れた値は使わない（画素比を差し替えた環境などで、CSS pxの数が返ることがある）
    const dpr=window.devicePixelRatio||1, cw=e.contentRect.width, ch=e.contentRect.height;
    if(Math.abs(s.inlineSize-cw*dpr)>2||Math.abs(s.blockSize-ch*dpr)>2){ _devBox=null; return; }
    _devBox={cw:Math.round(cw),ch:Math.round(ch),w:s.inlineSize,h:s.blockSize};
    // 大きさを変えるのは次のフレームで（ResizeObserver の中で大きさを変えると
    // "ResizeObserver loop completed with undelivered notifications." のエラーになる）
    if(!_devPending&&(viewCanvas.width!==Math.max(1,s.inlineSize)||viewCanvas.height!==Math.max(1,s.blockSize))){
      _devPending=true;
      requestAnimationFrame(()=>{ _devPending=false; resizeViewCanvas(); requestRender(); });
    }
  }).observe(viewCanvas,{box:"device-pixel-content-box"});
}catch(e){}
const VIEW_BG32=(0xFF<<24|0x30<<16|0x30<<8|0x30)>>>0;
let _blitImg=null;
/** 最近傍で、表示用の絵（offBuf32）を画面の実画素へ自前で写す。実画素 d には floor((d+0.5-t)/倍率) 番目のドット（toCanvas と同じ式）。
    倍率は横 ex・縦 ey（実画素/表示ドット）。透明は画面の地の色 */
function blitNearest(tx,ty,ex,ey){
  const W=viewCanvas.width, H=viewCanvas.height, ow=offCanvas.width, oh=offCanvas.height;
  const map=(n,t,m,eff)=>{
    const a=new Int32Array(n); let lo=-1, hi=-1;
    for(let d=0;d<n;d++){ const s=Math.floor((d+0.5-t)/eff); a[d]=s; if(s>=0&&s<m){ if(lo<0)lo=d; hi=d; } }
    return {a,lo,hi};
  };
  const mx=map(W,tx,ow,ex), my=map(H,ty,oh,ey);
  if(mx.lo<0||my.lo<0)return;
  const rw=mx.hi-mx.lo+1, rh=my.hi-my.lo+1;
  if(!_blitImg||_blitImg.width!==rw||_blitImg.height!==rh)_blitImg=vctx.createImageData(rw,rh);
  const out=new Uint32Array(_blitImg.data.buffer), sxs=mx.a.subarray(mx.lo,mx.hi+1);
  let prev=-1;
  for(let r=0;r<rh;r++){
    const sy=my.a[my.lo+r], o=r*rw;
    if(sy===prev){ out.copyWithin(o,o-rw,o); continue; }   // 同じ行のドットなら上の行を写す
    prev=sy;
    const src=sy*ow;
    for(let c=0;c<rw;c++){ const v=offBuf32[src+sxs[c]]; out[o+c]=v?v:VIEW_BG32; }
  }
  vctx.putImageData(_blitImg,mx.lo,my.lo);
}
function refreshCanvas(){ offDirty=true; requestRender(); UI.scheduleThumbs(); }
function requestRender(){
  if(renderQueued)return;
  renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false; renderView(); });
}
function renderView(){
  if(offDirty){
    engine.renderTo(offBuf32);
    offCtx.putImageData(offImage,0,0);
    offDirty=false;
  }
  const dpr=window.devicePixelRatio||1;
  const sl=container.scrollLeft, st=container.scrollTop;
  vctx.setTransform(1,0,0,1,0,0);
  vctx.fillStyle="#303030";
  vctx.fillRect(0,0,viewCanvas.width,viewCanvas.height);
  const z=App.zoom;
  const eff=z*dpr;
  const smoothOn=!App.zoomSnapInteger&&Math.abs(eff-Math.round(eff))>0.002;
  // 実画素/CSS px は、キャンバスの画素数÷表示の大きさ（画素比とほんの少し違うことがある）。位置も倍率もこの値で計算する
  const kx=viewCanvas.width/(container.clientWidth||viewCanvas.width), ky=viewCanvas.height/(container.clientHeight||viewCanvas.height);
  const ex=z*kx, ey=z*ky, tx=(padX-sl)*kx, ty=(padY-st)*ky;
  const whole=(v)=>v===Math.round(v);
  if(!smoothOn&&!(whole(ex)&&whole(ey)&&whole(tx)&&whole(ty))){
    // 最近傍で、倍率か位置が実画素の整数でない: 境目の丸めがぶれないよう自前で写す
    blitNearest(tx,ty,ex,ey);
  }else{
    vctx.imageSmoothingEnabled=smoothOn;
    if(smoothOn)vctx.imageSmoothingQuality="high";
    vctx.setTransform(ex,0,0,ey,tx,ty);
    vctx.drawImage(offCanvas,0,0);
  }
  // グリッド(論理ドット単位: 横1px・縦aspectY px, Zoom>=4)
  if(App.showGrid&&z>=4){
    vctx.setTransform(kx,0,0,ky,0,0);
    vctx.strokeStyle="rgba(255,255,255,0.235)";
    vctx.lineWidth=1;
    const ox=padX-sl, oy=padY-st;
    const vw=container.clientWidth, vh=container.clientHeight;
    const W=engine.w, H=engine.h, ay=engine.aspectY;
    const dw=W*z, dh=engine.displayH*z;
    const x0=clamp(Math.ceil((0-ox)/z),0,W), x1=clamp(Math.floor((vw-ox)/z),0,W);
    const ly0=clamp(Math.ceil((0-oy)/(ay*z)),0,H), ly1=clamp(Math.floor((vh-oy)/(ay*z)),0,H);
    const top=clamp(oy,0,vh), bot=clamp(oy+dh,0,vh);
    const left=clamp(ox,0,vw), right=clamp(ox+dw,0,vw);
    vctx.beginPath();
    for(let xi=x0;xi<=x1;xi++){
      const sx=ox+xi*z+0.5;
      vctx.moveTo(sx,top); vctx.lineTo(sx,bot);
    }
    for(let yi=ly0;yi<=ly1;yi++){
      const sy=oy+yi*ay*z+0.5;
      vctx.moveTo(left,sy); vctx.lineTo(right,sy);
    }
    vctx.stroke();
  }
  vctx.setTransform(1,0,0,1,0,0);
  UI.paintNav();
}
container.addEventListener("scroll",requestRender);
// リサイズの実処理は次フレームへ遅延して実行する。
// ResizeObserverのコールバック内で同期的にcanvas/spacerのサイズを変更すると、
// 同一フレーム内の再リサイズと見なされ "ResizeObserver loop completed with
// undelivered notifications." がコンソールへ報告されるため(実害はないがノイズになる)。
let _resizePending=false;
new ResizeObserver(()=>{
  if(_resizePending)return;
  _resizePending=true;
  requestAnimationFrame(()=>{
    _resizePending=false;
    resizeViewCanvas();
    updateSpacer();
    requestRender();
  });
}).observe(container);

function toCanvas(ev){
  const rect=viewCanvas.getBoundingClientRect();
  const vx=ev.clientX-rect.left, vy=ev.clientY-rect.top;
  const dispX=Math.floor((vx+container.scrollLeft-padX)/App.zoom);
  const dispY=Math.floor((vy+container.scrollTop-padY)/App.zoom);
  return {x:dispX, y:Math.floor(dispY/engine.aspectY)};
}
function toDisplayCanvas(ev){
  const rect=viewCanvas.getBoundingClientRect();
  const vx=ev.clientX-rect.left, vy=ev.clientY-rect.top;
  return {x:(vx+container.scrollLeft-padX)/App.zoom,
          y:(vy+container.scrollTop-padY)/App.zoom, vx, vy};
}
function inBounds(p){ return p.x>=0&&p.x<engine.w&&p.y>=0&&p.y<engine.h; }

// ===== ズーム =====
const ZOOM_MAX=16;
/** 画面に収まる倍率（余白8pxずつ） */
function fitZoomRaw(){
  const cw=container.clientWidth, ch=container.clientHeight;
  if(!cw||!ch)return 1;
  return Math.min((cw-16)/engine.w,(ch-16)/engine.displayH);
}
/** ズームの下限: 整数倍のみなら1、ふだんは0.5（大きいキャンバスでは全体表示の倍率まで下げる） */
function zoomMin(){ return App.zoomSnapInteger?1:Math.max(0.1,Math.min(0.5,Math.floor(fitZoomRaw()*1000)/1000)); }
/** 全体表示: 画面に収まる倍率にして中央へ */
function zoomToFit(){
  let z=fitZoomRaw();
  if(App.zoomSnapInteger)z=Math.max(1,Math.floor(z));
  setZoom(z,{x:engine.w/2,y:engine.displayH/2,vx:container.clientWidth/2,vy:container.clientHeight/2});
  scrollToCanvasPoint(engine.w/2,engine.h/2);
  requestRender();
}
function normalizeZoom(z){
  if(!isFinite(z))return App.zoom;
  z=clamp(z,zoomMin(),ZOOM_MAX);
  if(App.zoomSnapInteger)z=clamp(Math.round(z),1,ZOOM_MAX);
  return Math.round(z*1000)/1000;
}
function zoomLabel(){
  const z=App.zoom;
  if(Math.abs(z-Math.round(z))<0.005)return String(Math.round(z))+"x";
  let s=z.toFixed(2);
  if(s.endsWith("0"))s=s.slice(0,-1);
  return s+"x";
}
function viewCenterAnchor(){
  const vx=container.clientWidth/2, vy=container.clientHeight/2;
  return {x:(vx+container.scrollLeft-padX)/App.zoom,
          y:(vy+container.scrollTop-padY)/App.zoom, vx, vy};
}
function setZoom(z,anchor){
  const oldZoom=App.zoom;
  App.zoom=normalizeZoom(z);
  if(App.zoom===oldZoom)return;
  updateSpacer();
  if(anchor){
    container.scrollLeft=Math.max(0,anchor.x*App.zoom+padX-anchor.vx);
    container.scrollTop=Math.max(0,anchor.y*App.zoom+padY-anchor.vy);
  }else{
    scrollToCanvasPoint(App.lastDrawPoint.x,App.lastDrawPoint.y);
  }
  onZoomChanged();
  requestRender();
}
/** ズーム1段階: 整数モード=±1 / スムーズ=×1.25 */
function stepZoom(dir,anchor){
  if(App.zoomSnapInteger)setZoom(App.zoom+dir,anchor);
  else setZoom(dir>0?App.zoom*1.25:App.zoom/1.25,anchor);
}
function scrollToCanvasPoint(cx,cy){
  container.scrollLeft=Math.max(0,cx*App.zoom+padX-container.clientWidth/2);
  container.scrollTop=Math.max(0,cy*engine.aspectY*App.zoom+padY-container.clientHeight/2);
}
function onZoomChanged(){
  updateStatus(null,null);
  UI.updateZoomButtons();
}
viewCanvas.addEventListener("wheel",ev=>{
  if(!ev.ctrlKey){
    // キャンバスはスクロールする箱の外に重ねてあるので、ホイールのスクロールは箱へ渡す（Shift+ホイールは横）
    ev.preventDefault();
    const k=ev.deltaMode===1?16:ev.deltaMode===2?container.clientHeight:1;
    let dx=ev.deltaX*k, dy=ev.deltaY*k;
    if(ev.shiftKey&&!dx){ dx=dy; dy=0; }
    container.scrollLeft+=dx; container.scrollTop+=dy;
    return;
  }
  if(ev.ctrlKey){
    ev.preventDefault();
    const anchor=toDisplayCanvas(ev);
    if(App.zoomSnapInteger){
      setZoom(App.zoom+(ev.deltaY<0?1:-1),anchor);
    }else{
      setZoom(App.zoom*Math.exp(-ev.deltaY*0.0022),anchor);
    }
  }
},{passive:false});
