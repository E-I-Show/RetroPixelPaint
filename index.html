}
/** Xキー・ペンの消しゴム側で消すパターン: 背景色（線画レイヤーは透明）。
    描画色がグラデ・グリッド・タイル保存から選んだパターン（タイル）なら、そのパターンの透明でない所だけを消す印を付ける。
    パレットの色・透明・スポイトで選んだ色（2色が同じ）は全部消す。線画レイヤーはパターンを使わずに描くので全部消す */
function xEraserPattern(){
  const pat=eraserShapePattern();
  if(engine.drawOnLineLayer)return pat;
  const cp=engine.currentPattern;
  if(App.isTileActive&&engine.currentTile!==null)pat.eraseMask={tile:engine.currentTile,pat:{...cp}};
  else if(cp.c1!==cp.c2)pat.eraseMask={tile:null,pat:{...cp}};
  return pat;
}
function eraserShapePattern(){
  return engine.drawOnLineLayer?PatTransparent():PatSolid(App.bgColorIndex);
}
function canvasModified(){ App.dirty=true; }

// ===== タッチジェスチャ(2本指パン/ピンチズーム) / 長押しスポイト =====
const Gesture={pts:new Map(),active:false,suppress:false,startDist:1,startZoom:2,anchor:null};
// タッチポインタの取りこぼし対策: キャンバス外や捕捉漏れのup/cancelでも追跡から除去
window.addEventListener("pointerup",ev=>{
  if(ev.pointerType!=="touch")return;
  Gesture.pts.delete(ev.pointerId);
  if(Gesture.pts.size<2)Gesture.active=false;
  if(Gesture.pts.size===0)Gesture.suppress=false;
},true);
window.addEventListener("pointercancel",ev=>{
  if(ev.pointerType!=="touch")return;
  Gesture.pts.delete(ev.pointerId);
  if(Gesture.pts.size<2)Gesture.active=false;
  if(Gesture.pts.size===0)Gesture.suppress=false;
},true);
const longPress={timer:null,sx:0,sy:0};
function clearLongPress(){ if(longPress.timer){clearTimeout(longPress.timer);longPress.timer=null;} }
function armLongPress(ev){
  if(engine.currentTool===DrawTool.ColorPicker||Input.polylineMode)return;
  clearLongPress();
  longPress.sx=ev.clientX; longPress.sy=ev.clientY;
  longPress.timer=setTimeout(()=>{
    longPress.timer=null;
    if(Input.polylineMode)return;
    const p=toCanvas({clientX:longPress.sx,clientY:longPress.sy});
    if(!inBounds(p))return;
    if(Input.isDrawing)cancelActiveStroke();
    else if(Input.fillDone){Input.fillDone=false;revertStrokeStart();refreshCanvas();}
    colorPicked(engine.pixels[p.y*engine.w+p.x]);
    if(navigator.vibrate){try{navigator.vibrate(25);}catch(e){}}
  },550);
}
/** 始めたばかりの描画を取り消す: 直前の記録まで戻し、やり直しの履歴も描き始める前に戻す */
function revertStrokeStart(){
  engine.cancelToLastUndo();
  if(Input.redoBackup){ engine._redoStack=Input.redoBackup; Input.redoBackup=null; }
}
/** 描きかけストロークをundo履歴を汚さず破棄(2本指移行・長押しスポイト用) */
function cancelActiveStroke(){
  if(!Input.isDrawing)return;
  Input.isDrawing=false;
  Input.savedState=null;
  revertStrokeStart();
  viewCanvas.style.cursor="crosshair";
  refreshCanvas();
}
function startPinch(){
  Gesture.active=true; Gesture.suppress=true;
  const a=[...Gesture.pts.values()];
  Gesture.startDist=Math.max(10,Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y));
  Gesture.startZoom=App.zoom;
  const rect=viewCanvas.getBoundingClientRect();
  const vx=(a[0].x+a[1].x)/2-rect.left, vy=(a[0].y+a[1].y)/2-rect.top;
  Gesture.anchor={cx:(vx+container.scrollLeft-padX)/App.zoom,
                  cy:(vy+container.scrollTop-padY)/App.zoom};
}
function updatePinch(){
  if(Gesture.pts.size<2||!Gesture.anchor)return;
  const a=[...Gesture.pts.values()];
  const rect=viewCanvas.getBoundingClientRect();
  const vx=(a[0].x+a[1].x)/2-rect.left, vy=(a[0].y+a[1].y)/2-rect.top;
  const dist=Math.max(10,Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y));
  const z=normalizeZoom(Gesture.startZoom*dist/Gesture.startDist);
  const changed=(z!==App.zoom);
  App.zoom=z;
  if(changed)updateSpacer();
  container.scrollLeft=Math.max(0,Gesture.anchor.cx*z+padX-vx);
  container.scrollTop=Math.max(0,Gesture.anchor.cy*z+padY-vy);
  if(changed)onZoomChanged();
  requestRender();
}

function endPolyline(){
  Input.polyLastPreview=null;
  if(!Input.polylineMode)return;
  engine.restoreState(Input.polylineState);
  Input.polylineMode=false;
  Input.polylineState=null;
  App.dirty=true;
  refreshCanvas();
}

viewCanvas.addEventListener("contextmenu",ev=>ev.preventDefault());
viewCanvas.addEventListener("mousedown",ev=>{ if(ev.button===1)ev.preventDefault(); });   // 中ボタンの自動スクロールを出さない
// キャンバスにフォーカスがあるときの矢印キー・PageUp/PageDown は箱をスクロール（キャンバスを箱の中に置いていたときと同じ）
viewCanvas.addEventListener("keydown",ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const step=40, page=Math.max(40,container.clientHeight-40);
  const d={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step],PageUp:[0,-page],PageDown:[0,page]}[ev.key];
  if(!d)return;
  ev.preventDefault();
  container.scrollLeft+=d[0]; container.scrollTop+=d[1];
});

viewCanvas.addEventListener("pointerdown",ev=>{
  if(ev._menuClosed){ closeAllMenus(); ev.preventDefault(); return; }
  viewCanvas.focus({preventScroll:true});

  // === タッチ: 2本指でパン/ピンチへ移行、ペン描画中の手のひらは無視 ===
  if(ev.pointerType==="touch"){
    if(Input.isDrawing&&Input.activePointerType!=="touch")return;
    Gesture.pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(Gesture.pts.size===2){
      clearLongPress();
      if(Input.isDrawing)cancelActiveStroke();
      else if(Input.fillDone){ Input.fillDone=false; revertStrokeStart(); refreshCanvas(); }   // 1本目で塗った分を取り消す
      if(Input.polylineMode&&!Input.polylineToggle)endPolyline();
      else if(Input.polylineMode){
        // 調整中プレビューを破棄してパン/ズームへ(頂点は確定しない)
        Input.polyLastPreview=null;
        engine.restoreState(Input.polylineState);
        refreshCanvas();
      }
      startPinch();
      return;
    }
    if(Gesture.pts.size>2||Gesture.active||Gesture.suppress)return;
    armLongPress(ev);
  }

  viewCanvas.setPointerCapture(ev.pointerId);
  Input.activePointerId=ev.pointerId;
  Input.activePointerType=ev.pointerType;
  Input.fillDone=false;
  engine.pressure.processPointerEvent(ev);
  UI.updatePressureDisplay();
  // ペンの消しゴム側/バレルボタン → Xキー消しゴムと同等
  Input.penEraser=(ev.pointerType==="pen"&&(ev.buttons&32)!==0);

  // スペース+ドラッグ・中ボタンのドラッグ → パン
  if((Input.spaceDown&&ev.button===0)||ev.button===1){
    Input.isPanning=true;
    Input.panPrev={x:ev.clientX,y:ev.clientY,sl:container.scrollLeft,st:container.scrollTop};
    viewCanvas.style.cursor="grabbing";
    ev.preventDefault();
    return;
  }

  const p=toCanvas(ev);
  if(!inBounds(p))return;

  // 右クリック → 常にスポイト
  if(ev.button===2){
    if(Input.polylineMode)endPolyline();
    colorPicked(engine.pixels[p.y*engine.w+p.x]);
    return;
  }
  if(ev.button!==0)return;
  ev.preventDefault();

  // 連続線モード中のクリック
  if(Input.polylineMode){
    if(ev.pointerType==="touch"){
      // タッチ: ホバーが無いため確定はpointerup(離した位置)で行う。
      // ここではドラッグ調整を開始し、プレビューを指位置へ
      Input.polyLastPreview=p;
      engine.restoreState(Input.polylineState);
      engine.drawLine(Input.startPoint.x,Input.startPoint.y,p.x,p.y,Input.activePattern,Input.activeBrushSize);
      refreshCanvas();
      return;
    }
    // マウス/ペン: クリック位置でセグメント確定(ホバーでプレビュー済み)
    engine.restoreState(Input.polylineState);
    engine.drawLine(Input.startPoint.x,Input.startPoint.y,p.x,p.y,Input.activePattern,Input.activeBrushSize);
    Input.polylineState=engine.cloneState(engine.targetLayers());
    Input.startPoint=p;
    refreshCanvas();
    return;
  }

  // もう一方の画面から描く: ペン・直線・矩形・楕円・塗潰し・グラデ塗（消しゴム・X押下・ペンの消しゴム側は対象外）
  Input.srcOtherStroke=App.drawFromOther&&SRC_OTHER_TOOLS.includes(engine.currentTool);
  engine.srcOther=Input.srcOtherStroke&&!eraserActive();
  engine.srcIncludeLine=App.srcIncludeLine;
  engine.srcOverwriteTransparent=App.srcOverwriteTransparent;
  Input.redoBackup=engine._redoStack.slice();   // ジェスチャで取り消したときに、やり直しの履歴を戻すため
  warnHiddenTarget();                             // 隠しているレイヤーに描き始めたら知らせる（1回だけ）

  switch(engine.currentTool){
    case DrawTool.Eraser:{
      const pat=eraserShapePattern();
      const bs=engine.pressure.getBrushSize(engine.eraserSize);
      engine.pushUndo(engine.targetLayers());
      engine.dither.beginStroke();
      engine.useTileForDrawing=false;
      Input.isDrawing=true;
      Input.lastPoint=p;
      App.lastDrawPoint=p;
      engine.putBrush(p.x,p.y,pat,bs);
      refreshCanvas();
      break;
    }
    case DrawTool.Pencil:{
      const pat=getDrawPattern();
      const bs=engine.getEffectiveBrushSize();
      engine.pushUndo(engine.targetLayers());
      engine.dither.beginStroke();
      Input.isDrawing=true;
      Input.lastPoint=p;
      App.lastDrawPoint=p;
      engine.putBrush(p.x,p.y,pat,bs);
      refreshCanvas();
      break;
    }
    case DrawTool.Line:{
      Input.activePattern=eraserActive()?xEraserPattern():{...engine.currentPattern};
      engine.useTileForDrawing=!eraserActive()&&engine.currentTile!==null;
      Input.activeBrushSize=engine.brushSize;
      if(ev.shiftKey||Input.polylineToggle){
        engine.pushUndo(engine.targetLayers());
        engine.dither.beginStroke();
        Input.polylineMode=true;
        Input.startPoint=p;
        Input.polylineState=engine.cloneState(engine.targetLayers());
        if(ev.pointerType==="touch")Input.polyLastPreview=p;
      }else{
        engine.pushUndo(engine.targetLayers());
        engine.dither.beginStroke();
        Input.isDrawing=true;
        Input.startPoint=p;
        Input.savedState=engine.cloneState(engine.targetLayers());
      }
      break;
    }
    case DrawTool.Rectangle:
    case DrawTool.FilledRectangle:
    case DrawTool.Ellipse:
    case DrawTool.FilledEllipse:{
      Input.activePattern=eraserActive()?xEraserPattern():{...engine.currentPattern};
      engine.useTileForDrawing=!eraserActive()&&engine.currentTile!==null;
      Input.activeBrushSize=engine.brushSize;
      engine.pushUndo(engine.targetLayers());
      engine.dither.beginStroke();
      Input.isDrawing=true;
      Input.startPoint=p;
      Input.savedState=engine.cloneState(engine.targetLayers());
      Input.shapeToggleUi=shapeToggleUi(); setShapeMods(ev); Input.shapeLast=p;
      break;
    }
    case DrawTool.Fill:{
      const pat2=getDrawPattern();
      engine.pushUndo(engine.targetLayers());
      engine.dither.beginStroke();
      engine.floodFill(p.x,p.y,pat2);
      Input.fillDone=true;
      refreshCanvas();
      canvasModified();
      break;
    }
    case DrawTool.GradientFill:{
      engine.useTileForDrawing=false;
      engine.pushUndo(engine.targetLayers());
      engine.dither.beginStroke();
      Input.isDrawing=true;
      Input.startPoint=p;
      Input.savedState=engine.cloneState(engine.targetLayers());
      break;
    }
    case DrawTool.ColorPicker:{
      colorPicked(engine.pixels[p.y*engine.w+p.x]);
      break;
    }
    case DrawTool.CanvasShift:{
      // 表裏を同期なら表と裏の4枚、しないなら表示中の画面の2枚を記録する
      Input.shiftBoth=App.shiftSync;
      const L=Input.shiftBoth?[0,1,2,3]:engine.screenLayers();
      engine.pushUndo(L);
      Input.isDrawing=true;
      Input.startPoint=p;
      Input.savedState=engine.cloneState(L);
      viewCanvas.style.cursor="move";
      break;
    }
  }
});

viewCanvas.addEventListener("pointermove",ev=>{
  // === タッチジェスチャ ===
  if(ev.pointerType==="touch"&&Gesture.pts.has(ev.pointerId)){
    Gesture.pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(Gesture.active){ updatePinch(); return; }
    if(longPress.timer&&Math.hypot(ev.clientX-longPress.sx,ev.clientY-longPress.sy)>9)clearLongPress();
    if(Gesture.suppress)return;
  }
  engine.pressure.processPointerEvent(ev);
  UI.updatePressureDisplay();

  if(Input.isPanning){
    container.scrollLeft=Input.panPrev.sl+Input.panPrev.x-ev.clientX;
    container.scrollTop=Input.panPrev.st+Input.panPrev.y-ev.clientY;
    return;
  }

  const p=toCanvas(ev);
  if(inBounds(p))updateStatus(p.x,p.y);

  // 連続線モードのプレビュー
  if(Input.polylineMode){
    if(!ev.shiftKey&&!Input.polylineToggle){ endPolyline(); return; }
    if(inBounds(p))Input.polyLastPreview=p;
    engine.restoreState(Input.polylineState);
    if(inBounds(p)){
      engine.drawLine(Input.startPoint.x,Input.startPoint.y,p.x,p.y,Input.activePattern,Input.activeBrushSize);
    }
    refreshCanvas();
    return;
  }

  if(!Input.isDrawing)return;

  switch(engine.currentTool){
    case DrawTool.Eraser:{
      const evs=(ev.getCoalescedEvents&&ev.getCoalescedEvents().length>0)?ev.getCoalescedEvents():[ev];
      const pat=eraserShapePattern();
      for(const ce of evs){
        engine.pressure.processPointerEvent(ce);
        const cp=toCanvas(ce);
        const bs=engine.pressure.getBrushSize(engine.eraserSize);
        engine.drawLine(Input.lastPoint.x,Input.lastPoint.y,cp.x,cp.y,pat,bs);
        Input.lastPoint=cp;
        App.lastDrawPoint=cp;
      }
      refreshCanvas();
      break;
    }
    case DrawTool.Pencil:{
      // 合体イベントで滑らかなペン入力
      const evs=(ev.getCoalescedEvents&&ev.getCoalescedEvents().length>0)?ev.getCoalescedEvents():[ev];
      for(const ce of evs){
        engine.pressure.processPointerEvent(ce);
        const cp=toCanvas(ce);
        engine.srcOther=Input.srcOtherStroke&&!eraserActive();   // 途中でXを押したら消しゴム
        const livePat=getDrawPattern();
        const bs=engine.getEffectiveBrushSize();
        engine.drawLine(Input.lastPoint.x,Input.lastPoint.y,cp.x,cp.y,livePat,bs);
        Input.lastPoint=cp;
        App.lastDrawPoint=cp;
      }
      refreshCanvas();
      break;
    }
    case DrawTool.Line:
      engine.restoreState(Input.savedState);
      engine.drawLine(Input.startPoint.x,Input.startPoint.y,p.x,p.y,Input.activePattern,Input.activeBrushSize);
      refreshCanvas();
      break;
    case DrawTool.Rectangle:
    case DrawTool.FilledRectangle:
    case DrawTool.Ellipse:
    case DrawTool.FilledEllipse:
      setShapeMods(ev); Input.shapeLast=p;
      drawShapeTo(p);
      refreshCanvas();
      break;
    case DrawTool.GradientFill:
      engine.restoreState(Input.savedState);
      engine.useTileForDrawing=false;
      if(gradPalette&&gradPalette.entryCount>=2){
        engine.gradientFill(Input.startPoint.x,Input.startPoint.y,p.x,p.y,gradPalette);
      }
      refreshCanvas();
      break;
    case DrawTool.CanvasShift:
      engine.restoreState(Input.savedState);
      engine.shiftCanvas(p.x-Input.startPoint.x,p.y-Input.startPoint.y,Input.shiftBoth);
      refreshCanvas();
      break;
  }
});

viewCanvas.addEventListener("pointerup",ev=>{
  let touchWasGesture=false;
  if(ev.pointerType==="touch"){
    touchWasGesture=Gesture.active||Gesture.suppress;
    clearLongPress();
    Gesture.pts.delete(ev.pointerId);
    if(Gesture.active&&Gesture.pts.size<2)Gesture.active=false;
    if(Gesture.pts.size===0)Gesture.suppress=false;
  }
  if(Input.activePointerId!==ev.pointerId)return;
  if(Input.isPanning){
    Input.isPanning=false;
    viewCanvas.style.cursor=Input.spaceDown?"grab":"crosshair";
    return;
  }
  if(Input.polylineMode){
    // タッチの連続線: 指を離した位置でセグメント確定(ドラッグで調整可能)
    if(ev.pointerType==="touch"&&!touchWasGesture){
      const pUp=toCanvas(ev);
      engine.restoreState(Input.polylineState);
      if(inBounds(pUp)){
        engine.drawLine(Input.startPoint.x,Input.startPoint.y,pUp.x,pUp.y,Input.activePattern,Input.activeBrushSize);
        Input.polylineState=engine.cloneState(engine.targetLayers());
        Input.startPoint=pUp;
        App.lastDrawPoint=pUp;
      }
      Input.polyLastPreview=null;
      refreshCanvas();
    }
    return;  // 連続線中はUpで終了しない
  }
  if(!Input.isDrawing)return;
  Input.isDrawing=false;

  const p=toCanvas(ev);
  switch(engine.currentTool){
    case DrawTool.Pencil:
    case DrawTool.Eraser:
      break; // 既にmoveで描画済み
    case DrawTool.Line:
      engine.restoreState(Input.savedState);
      engine.drawLine(Input.startPoint.x,Input.startPoint.y,p.x,p.y,Input.activePattern,Input.activeBrushSize);
      break;
    case DrawTool.Rectangle:
    case DrawTool.FilledRectangle:
    case DrawTool.Ellipse:
    case DrawTool.FilledEllipse:
      setShapeMods(ev);
      drawShapeTo(p);
      Input.shapeLast=null;
      break;
    case DrawTool.GradientFill:
      engine.restoreState(Input.savedState);
      engine.useTileForDrawing=false;
      if(gradPalette&&gradPalette.entryCount>=2){
        engine.gradientFill(Input.startPoint.x,Input.startPoint.y,p.x,p.y,gradPalette);
      }
      break;
    case DrawTool.CanvasShift:
      engine.restoreState(Input.savedState);
      engine.shiftCanvas(p.x-Input.startPoint.x,p.y-Input.startPoint.y,Input.shiftBoth);
      viewCanvas.style.cursor="crosshair";
      break;
  }
  App.lastDrawPoint=p;
  Input.savedState=null;
  refreshCanvas();
  canvasModified();
});
viewCanvas.addEventListener("pointercancel",ev=>{
  if(ev.pointerType==="touch"){
    clearLongPress();
    const wasGesture=Gesture.active||Gesture.suppress;
    Gesture.pts.delete(ev.pointerId);
    if(Gesture.pts.size<2)Gesture.active=false;
    if(Gesture.pts.size===0)Gesture.suppress=false;
    // 連続線のドラッグ調整中に不意のcancelが届いた場合(Android)は、
    // 最後にプレビューした位置で頂点を確定する(置いたはずの点が消えるのを防ぐ)
    if(Input.polylineMode&&!wasGesture&&ev.pointerId===Input.activePointerId&&Input.polyLastPreview){
      const pC=Input.polyLastPreview;
      Input.polyLastPreview=null;
      engine.restoreState(Input.polylineState);
      if(inBounds(pC)){
        engine.drawLine(Input.startPoint.x,Input.startPoint.y,pC.x,pC.y,Input.activePattern,Input.activeBrushSize);
        Input.polylineState=engine.cloneState(engine.targetLayers());
        Input.startPoint=pC;
        App.lastDrawPoint=pC;
      }
      refreshCanvas();
    }
  }
  Input.isDrawing=false; Input.isPanning=false;
});

// ===== キーボード =====
function isTextTarget(ev){
  const t=ev.target;
  if(!t)return false;
  if(t.tagName==="TEXTAREA"||t.tagName==="SELECT")return true;
  if(t.tagName==="INPUT"){
    const ty=(t.type||"").toLowerCase();
    return ty!=="checkbox"&&ty!=="radio"&&ty!=="range"&&ty!=="button";
  }
  return false;
}
// ボタン/チェックボックス操作後にフォーカスを残さない
// (Spaceでのボタン誤再発動や、ショートカットキーの阻害を防ぐ)
document.addEventListener("click",ev=>{
  const t=ev.target;
  const b=(t&&t.closest)?t.closest("button"):null;
  if(b)b.blur();
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t&&t.tagName==="INPUT"&&(t.type==="checkbox"||t.type==="radio"))t.blur();
});
window.addEventListener("keydown",ev=>{
  if(isTextTarget(ev)||Modal.isOpen())return;
  if(ev.code==="Space"){
    if(!Input.spaceDown){Input.spaceDown=true; if(!Input.isPanning)viewCanvas.style.cursor="grab";}
    ev.preventDefault();
    return;
  }
  if(ev.code==="KeyX"&&!ev.ctrlKey&&!ev.metaKey){ Input.xKeyDown=true; return; }
  if(ev.key==="F1"){ showManual(); ev.preventDefault(); return; }
  if(Input.isDrawing&&(ev.key==="Delete"||((ev.ctrlKey||ev.metaKey)&&(ev.code==="KeyZ"||ev.code==="KeyY")))){ ev.preventDefault(); return; }
  if(ev.key==="Delete"){
    // Delキー: 描画先のレイヤーを全消去（通常: マスク全解除＋背景色で塗りつぶし／線画: 線画だけ消す）
    clearTargetLayer(true);
    ev.preventDefault();
    return;
  }
  const ctrl=ev.ctrlKey||ev.metaKey;
  if(ctrl&&!ev.shiftKey&&ev.code==="KeyZ"){ doUndo(); ev.preventDefault(); return; }
  if(ctrl&&((ev.shiftKey&&ev.code==="KeyZ")||ev.code==="KeyY")){ doRedo(); ev.preventDefault(); return; }
  if(ctrl&&ev.code==="KeyS"){ saveRpi(); ev.preventDefault(); return; }
  if(ctrl&&ev.code==="KeyO"){ $("fileOpen").click(); ev.preventDefault(); return; }
  // ツールの1文字ショートカット（B E L R O G Shift+G I V）と ［ ］でサイズ
  if(!ctrl&&!ev.altKey&&!Input.isDrawing){
    const k=(ev.key||"").toLowerCase();
    if(k==="g"){ selectTool(ev.shiftKey?"grad":"fill"); ev.preventDefault(); return; }
    const map={b:"pen",e:"eraser",l:"line",r:"rect",o:"ellipse",i:"picker",v:"shift"};
    if(map[k]&&!ev.shiftKey){ selectTool(map[k]); ev.preventDefault(); return; }
    if(ev.key==="["||ev.key==="]"){ stepSize(ev.key==="]"?1:-1); ev.preventDefault(); return; }
  }
});
window.addEventListener("keyup",ev=>{
  if(ev.code==="Space"){
    Input.spaceDown=false;
    if(!Input.isPanning)viewCanvas.style.cursor="crosshair";
  }
  if(ev.code==="KeyX")Input.xKeyDown=false;
  if(Input.polylineMode&&ev.key==="Shift"&&!Input.polylineToggle)endPolyline();
});
/* ---------- 矩形・楕円: Shift で正方形・正円、Ctrl（Mac は ⌘ も）で始点を中心に（段階6の追加） ----------
   キーのないスマホ・タブレットは、オプション帯の切り替えボタン（正方形／正円・中心から）で同じことをする。キーとボタンは、どちらかが ON なら効く */
function isShapeTool(tool){ return tool===DrawTool.Rectangle||tool===DrawTool.FilledRectangle||tool===DrawTool.Ellipse||tool===DrawTool.FilledEllipse; }
/** 切り替えボタンを出す画面か: スマホの画面か、指で操作する端末（キーボードのないタブレットなど）。
    ボタンが見えていないときは、ON にしてあっても効かせない（PC の幅に戻したときに、見えないまま効き続けるのを防ぐ） */
function shapeToggleUi(){
  try{ return !!(window.matchMedia&&window.matchMedia("(max-width:820px), (pointer:coarse)").matches); }catch(e){ return false; }
}
/** 修飾キーと切り替えボタンから、今の形の決め方 */
function shapeModsNow(){
  const k=Input.shapeKeys, ui=Input.shapeToggleUi;
  return {square:!!k.shift||(ui&&!!App.shapeSquare),center:!!k.ctrl||(ui&&!!App.shapeCenter)};
}
/** ポインターやキーのイベントから、押している修飾キーを読む */
function setShapeMods(ev){
  Input.shapeKeys={shift:!!ev.shiftKey,ctrl:!!(ev.ctrlKey||ev.metaKey)};
  Input.shapeMods=shapeModsNow();
}
/** ドラッグを始めた時の状態に戻してから、今の点 p までの矩形・楕円を描く（決め方の形にして） */
function drawShapeTo(p){
  const m=Input.shapeMods, b=shapeBox(Input.startPoint,p,m.square,m.center,engine.aspectY), tool=engine.currentTool;
  engine.restoreState(Input.savedState);
  if(tool===DrawTool.Rectangle||tool===DrawTool.FilledRectangle)
    engine.drawRect(b.x0,b.y0,b.x1,b.y1,Input.activePattern,tool===DrawTool.FilledRectangle,Input.activeBrushSize);
  else engine.drawEllipse(b.x0,b.y0,b.x1,b.y1,Input.activePattern,tool===DrawTool.FilledEllipse,Input.activeBrushSize);
}
/** ドラッグの途中で決め方が変わったら、マウス（指）を動かさなくても描き直す */
function redrawShapeIfChanged(){
  if(!Input.isDrawing||!Input.shapeLast||!Input.savedState||!isShapeTool(engine.currentTool))return;
  const was=Input.shapeMods, m=shapeModsNow();
  if(was&&was.square===m.square&&was.center===m.center)return;   // 押しっぱなしの繰り返しは描き直さない
  Input.shapeMods=m;
  drawShapeTo(Input.shapeLast);
  refreshCanvas();
}
// ドラッグの途中で Shift・Ctrl（⌘）を押したり離したりしたとき
function onShapeModKey(ev){
  if(ev.key!=="Shift"&&ev.key!=="Control"&&ev.key!=="Meta")return;
  if(!Input.isDrawing||!Input.shapeLast)return;
  Input.shapeKeys={shift:!!ev.shiftKey,ctrl:!!(ev.ctrlKey||ev.metaKey)};
  redrawShapeIfChanged();
}
window.addEventListener("keydown",onShapeModKey);
window.addEventListener("keyup",onShapeModKey);
/** オプション帯の切り替えボタン（key: shapeSquare・shapeCenter）。このページを開いている間だけ覚える */
function toggleShapeOpt(key){
  App[key]=!App[key];
  UI.syncOptionBar();
  if(Input.isDrawing&&Input.shapeLast){ Input.shapeToggleUi=shapeToggleUi(); redrawShapeIfChanged(); }
}
window.addEventListener("blur",()=>{

window.addEventListener("beforeunload",ev=>{

// 進行中の連続線があれば確定分までで終了してから履歴操作を行う
// (連続線の内部スナップショットが、Undo/Redo後のキャンバスへ古い状態を書き戻すのを防ぐ)

/* =================================================================
   モーダルシステム / ダイアログ
   ================================================================= */
function el(tag,props={},...children){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==="class")e.className=v;
    else if(k==="style")e.style.cssText=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="text")e.textContent=v;
    else e.setAttribute(k,v);
  }
  for(const c of children)if(c!=null)e.append(c);
  return e;
}

const Modal={
  _depth:0,
  isOpen(){ return this._depth>0; },
  open(title,bodyEl,buttons){
    return new Promise(resolve=>{
      const ov=$("modalOverlay");
      this._depth++;
      let done=false;
      const foot=el("div",{class:"modal-foot"});
      const m=el("div",{class:"modal"},
        el("div",{class:"modal-title",text:title}),
        el("div",{class:"modal-body"},bodyEl),
        foot);
      const close=(val)=>{
        if(done)return; done=true;
        ov.removeChild(m);
        Modal._depth--;
        if(Modal._depth===0)ov.classList.remove("show");
        document.removeEventListener("keydown",onKey,true);
        resolve(val);
      };
      for(const b of buttons){
        foot.append(el("button",{class:"ui"+(b.primary?" primary":""),text:b.label,
          onclick:()=>close(typeof b.value==="function"?b.value():b.value)}));
      }
      const onKey=(ev)=>{
        if(ev.key==="Escape"){ ev.stopPropagation(); close(null); }
        else if(ev.key==="Enter"&&ev.target.tagName!=="BUTTON"){
          ev.stopPropagation();
          const prim=buttons.find(b=>b.primary)||buttons[0];
          if(prim)close(typeof prim.value==="function"?prim.value():prim.value);
        }
      };
      document.addEventListener("keydown",onKey,true);
      ov.append(m);
      ov.classList.add("show");
    });
  },
  alert(msg){
    return this.open(t("確認"),el("div",{text:msg,style:"min-width:220px;"}),[{label:"OK",value:true}]);
  },
  confirm(msg,title=t("確認")){
    return this.open(title,el("div",{text:msg,style:"min-width:220px;"}),
      [{label:t("はい"),value:true},{label:t("いいえ"),value:false}]);
  },
};

      if(done)return; done=true;

      document.removeEventListener("keydown",onKey,true);

    };

      body.append(el("div",{style:"margin-top:8px;"},
        el("button",{class:"ui small",text:t("透明"),onclick:()=>finish(TRANSPARENT_INDEX)})));
    }

  });
}

// ===== PaletteEditorForm (8色アナログ=512色: RGB各3bit・0〜7 / 16色アナログ=4096色: RGB各4bit・0〜15) =====
async function paletteEditor(rgb,bits=3){
  const M=(1<<bits)-1, N=M+1, cs=(bits===4)?12:22;   // 1色の段階の最大値・段数、格子の1マス
  const to8=(v)=>ColorEngine.fromBits(v,bits);
  let r3=ColorEngine.toBits(rgb[0],bits), g3=ColorEngine.toBits(rgb[1],bits), b3=ColorEngine.toBits(rgb[2],bits);
  const prev=el("div",{style:"width:64px;height:40px;border:1px solid var(--bd2);"});
  const hex=el("span",{class:"mono",style:"font-size:15px;margin-left:12px;"});
  const grid=el("canvas",{width:String(cs*N),height:String(cs*N),
    style:`width:${cs*N}px;height:${cs*N}px;border:1px solid var(--bd2);cursor:crosshair;margin-top:10px;display:block;`});
  const gctx=grid.getContext("2d");
  const sliders={};
  const mkSlider=(label)=>{
    const val=el("b",{class:"mono"});
    const rng=el("input",{type:"range",min:"0",max:String(M),step:"1"});
    rng.addEventListener("input",()=>{
      const v=parseInt(rng.value,10);
      if(label==="R")r3=v; else if(label==="G")g3=v; else b3=v;
      update();
    });
    sliders[label]={rng,val};
    return el("div",{class:"slider-row"},el("b",{text:label+":"}),rng,val);
  };
  function drawGrid(){
    for(let gy=0;gy<N;gy++)for(let bx=0;bx<N;bx++){
      gctx.fillStyle=`rgb(${to8(r3)},${to8(gy)},${to8(bx)})`;
      gctx.fillRect(bx*cs,gy*cs,cs,cs);
    }
    const mx=b3*cs+cs/2, my=g3*cs+cs/2;
    gctx.lineWidth=2; gctx.strokeStyle="#fff";
    gctx.beginPath(); gctx.arc(mx,my,5,0,Math.PI*2); gctx.stroke();
    gctx.lineWidth=1; gctx.strokeStyle="#000";
    gctx.beginPath(); gctx.arc(mx,my,6,0,Math.PI*2); gctx.stroke();
  }
  function update(){
    prev.style.background=`rgb(${to8(r3)},${to8(g3)},${to8(b3)})`;
    hex.textContent="#"+[r3,g3,b3].map(v=>v.toString(16).toUpperCase()).join("");
    sliders.R.val.textContent=r3; sliders.G.val.textContent=g3; sliders.B.val.textContent=b3;
    sliders.R.rng.value=r3; sliders.G.rng.value=g3; sliders.B.rng.value=b3;
    drawGrid();
  }
  grid.addEventListener("pointerdown",ev=>{
    const rect=grid.getBoundingClientRect();
    b3=clamp(Math.floor((ev.clientX-rect.left)/cs),0,M);
    g3=clamp(Math.floor((ev.clientY-rect.top)/cs),0,M);
    update();
  });
  const body=el("div",{},
    mkSlider("R"),mkSlider("G"),mkSlider("B"),
    el("div",{style:"display:flex;align-items:center;margin-top:10px;"},prev,hex),
    el("div",{text:t("クリックでG(縦)×B(横)を選択 / Rはスライダーで調整"),
      style:"color:var(--muted);font-size:10px;margin-top:8px;"}),
    grid);
  update();
  const ok=await Modal.open(bits===4?t("色の選択 (4096色)"):t("色の選択 (512色)"),body,
    [{label:"OK",value:true},{label:t("キャンセル"),value:null}]);
  if(!ok)return null;
  return [to8(r3),to8(g3),to8(b3)];
}

  {id:"fillgrp",label:"塗り",icon:"fill",more:true},
  {id:"picker"},{id:"shift",label:"移動"},
];
function toolDef(id){ return TOOL_DEFS.find(d=>d.id===id); }
function toolIdOf(tool){
  switch(tool){
    case DrawTool.Pencil:return "pen";
    case DrawTool.Eraser:return "eraser";
    case DrawTool.Line:return "line";
    case DrawTool.Rectangle: case DrawTool.FilledRectangle:return "rect";
    case DrawTool.Ellipse: case DrawTool.FilledEllipse:return "ellipse";
    case DrawTool.Fill:return "fill";
    case DrawTool.GradientFill:return "grad";
    case DrawTool.ColorPicker:return "picker";
    case DrawTool.CanvasShift:return "shift";
  }
  return "pen";
}
function toolOfId(id){
  switch(id){
    case "pen":return DrawTool.Pencil;
    case "eraser":return DrawTool.Eraser;
    case "line":return DrawTool.Line;
    case "rect":return App.shapeFill?DrawTool.FilledRectangle:DrawTool.Rectangle;
    case "ellipse":return App.shapeFill?DrawTool.FilledEllipse:DrawTool.Ellipse;
    case "fill":return DrawTool.Fill;
    case "grad":return DrawTool.GradientFill;
    case "picker":return DrawTool.ColorPicker;
    case "shift":return DrawTool.CanvasShift;
  }
  return DrawTool.Pencil;
}
/** ツールを選ぶ（ツールバー・下部ツールバー・ショートカット共通） */
function selectTool(id){
  if(id==="rect"||id==="ellipse")App.lastShape=id;
  if(id==="fill"||id==="grad")App.lastFill=id;
  const tool=toolOfId(id);
  if(engine.currentTool===tool){ UI.updateToolButtons(); return; }
  engine.currentTool=tool;
  UI.updateToolButtons();
}
/** 矩形・楕円の描き方（枠線／塗り）。選択中の図形ツールも切り替える */
function setShapeFill(filled){
  App.shapeFill=!!filled;
  const id=toolIdOf(engine.currentTool);
  if(id==="rect"||id==="ellipse")engine.currentTool=toolOfId(id);
  UI.updateToolButtons();
  markSettings();
}
/** ［ ］キー: 今のツールのサイズを1つ増減 */
function stepSize(dir){
  if(engine.currentTool===DrawTool.Eraser)engine.eraserSize=clamp(engine.eraserSize+dir,1,BRUSH_MAX);
  else engine.brushSize=clamp(engine.brushSize+dir,1,BRUSH_MAX);
  UI.syncOptionBar(); markSettings();
}
/** 描画先（通常レイヤー／線画レイヤー） */
function setDrawTarget(onLine){
  if(engine.drawOnLineLayer===!!onLine)return;
  endPolyline();
  engine.drawOnLineLayer=!!onLine;
  App.hiddenWarned=false;
  refreshCanvas();
  UI.syncLayerPanel(); UI.syncOptionBar(); UI.updateStatusBar();
}
/** 全消去（Delキー・スマホの全消去ボタン・編集→全てクリア）: 描画先のレイヤーだけを消す。元に戻せる
    通常レイヤー: 背景色で塗りつぶす。unmask=true（Delキーとボタン）ならマスクも全解除。線画は残る
    線画レイヤー: 線画だけを消す。通常レイヤーとマスクはそのまま（マスクは通常レイヤーにしか効かないため） */
function clearTargetLayer(unmask){
  endPolyline();
  engine.pushUndo(engine.targetLayers());
  if(engine.drawOnLineLayer){
    engine.clearLineLayer();
  }else{
    if(unmask)engine.colorMask.fill(false);
    engine.clearCanvas(App.bgColorIndex);
  }
  refreshCanvas();
  UI.updatePaletteDisplay();
  App.dirty=true;
}

const SRC_OTHER_TOOLS=[DrawTool.Pencil,DrawTool.Line,DrawTool.Rectangle,DrawTool.FilledRectangle,
  DrawTool.Ellipse,DrawTool.FilledEllipse,DrawTool.Fill,DrawTool.GradientFill];
/** 表示する画面（0=表・1=裏）を替える。描画先はその画面の同じ種類のレイヤー */
function showScreen(sc){
  sc=sc?1:0;
  if(engine.screen===sc)return;
  endPolyline();
  engine.showScreen(sc);

  configure(res,cm);
  engine.currentDotMode=dot;

  UI.syncLayerPanel(); UI.updateStatusBar(); UI.syncOptionBar(); UI.updatePaletteDisplay();

/** カラーモードの切り替え（8色デジタル／8色アナログ／16色アナログ）。元に戻す履歴の対象外。切り替えたら true
    8色→16色アナログ: 0〜7番の色はそのまま、8〜15番に既定の色を足す（絵は変わらない）
    16色アナログ→8色: 8〜15番を使っている所を、0〜7番のいちばん近い色へ（ピクセル・履歴・タイル・グラデ・グリッドなど）
    絵の見た目が変わるときは、実行前に確認する */
async function setPaletteMode(m){
  if(colors.mode===m||!COLOR[m])return false;
  const oldPal=colors.palette.map(c=>c.slice()), oldN=colors.count;
  const def=new ColorEngine(); def.initDefault(m);
  let newPal;
  if(m===PaletteMode.Analog16)newPal=oldPal.slice(0,8).concat(def.palette.slice(8));
  else if(m===PaletteMode.Custom8&&colors.mode===PaletteMode.Analog16)newPal=oldPal.slice(0,8);
  else newPal=def.palette;
  const map=nearestMap(oldPal,newPal);
  const changes=pictureChanges(oldPal,newPal,map);
  if(changes){
    const msg=oldN>newPal.length
      ?t("8色にすると、8〜15番の色は0〜7番のいちばん近い色に置き換わります。この変更は元に戻せません。カラーモードを変更しますか？")
      :t("パレットの色が変わるので、絵の色も変わります。この変更は元に戻せません。カラーモードを変更しますか？");
    if(!await Modal.confirm(msg,t("カラーモードの変更")))return false;
  }
  endPolyline();
  stashColorSettings();
  colors.mode=m;
  colors.palette=newPal.map(c=>c.slice());
  if(oldN>colors.count)remapColorIndices(map);
  for(let i=colors.count;i<MAX_COLORS;i++)engine.colorMask[i]=false;
  if(changes)App.dirty=true;
  afterModeChange(false);
  markSettings(); UI.updateStatusBar();
  return true;
}

function canvasPoint(cv,ev){
  const rect=cv.getBoundingClientRect();
  const sx=rect.width?cv.width/rect.width:1, sy=rect.height?cv.height/rect.height:1;
  return {x:(ev.clientX-rect.left)*sx, y:(ev.clientY-rect.top)*sy};
}

  _navGeom(){

    const vw=container.clientWidth/z, vh=container.clientHeight/z;
    const x0=clamp(vx,0,engine.w), y0=clamp(vy,0,engine.displayH);
    const x1=clamp(vx+vw,0,engine.w), y1=clamp(vy+vh,0,engine.displayH);

    }
  },

    const n=colors.count, pal=new Uint32Array(n);
    for(let i=0;i<n;i++){
      const c=colors.palette[i];
      pal[i]=(0xFF<<24|c[2]<<16|c[1]<<8|c[0])>>>0;
    }
    return pal;
  },

  /** 描画色（パターン・タイル・透明）の見本。縦長ドットは1ドットを縦長に描く */
  paintSelected(cv){
    if(!cv)return;
    const ay=engine.aspectY, cols=14, rows=Math.max(1,Math.round(14/ay));
    if(cv.width!==cols)cv.width=cols;
    if(cv.height!==rows)cv.height=rows;
    const ctx=cv.getContext("2d");
    const img=ctx.createImageData(cols,rows);
    const b32=new Uint32Array(img.data.buffer);
    const pal=UI.pal32();
    const useTile=App.isTileActive&&engine.currentTile!==null;
    const de=new DitherEngine(engine.dither.spec);
    const pat=engine.currentPattern;
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      const ci=useTile?de.resolveTile(engine.currentTile,pat,x,y):de.resolveColor(pat,x,y);
      b32[y*cols+x]=(ci>=0&&ci<pal.length)?pal[ci]:(((x>>1)+(y>>(ay===2?0:1)))&1?UI.TRANS_LIGHT32:UI.TRANS_GRAY32);
    }
    ctx.putImageData(img,0,0);
  },
  colorDesc(){
    const p=engine.currentPattern, L=engine.dither.spec.levels;
    if(App.isTileActive&&engine.currentTile!==null)return t("タイル");
    if(patIsEffectivelyTransparent(p,L))return t("透明");
    const nm=(c)=>c===TRANSPARENT_INDEX?t("透明"):String(c);
    if(p.c1===p.c2||p.ratio<=0)return nm(p.c1)+" "+t("単色");
    if(p.ratio>=L)return nm(p.c2)+" "+t("単色");
    return nm(p.c1)+"+"+nm(p.c2)+" "+p.ratio+"/"+L;
  },

  paintTilePreview(){
    const R=this.refs;
    const ctx=R.cvsTilePrev.getContext("2d");
    if(App.lastTile===null){
      ctx.fillStyle="#2a2d35"; ctx.fillRect(0,0,24,24);
    }else{
      const img=ctx.createImageData(24,24);
      const b32=new Uint32Array(img.data.buffer);
      const pal=UI.pal32();
      for(let py=0;py<24;py++)for(let px=0;px<24;px++){
        const ci=App.lastTile.resolveColor(px,py);
        b32[py*24+px]=(ci>=0&&ci<pal.length)?pal[ci]:UI.TRANS_GRAY32;
      }
      ctx.putImageData(img,0,0);
      if(!tileUsable(App.lastTile)){
        ctx.strokeStyle="rgba(255,90,90,0.9)"; ctx.lineWidth=1.5; ctx.beginPath();
        for(let k=-24;k<24;k+=6){ ctx.moveTo(Math.max(0,k),Math.max(0,-k)); ctx.lineTo(Math.min(24,k+24),Math.min(24,24-k)); }
        ctx.stroke();
      }
    }
    R.tileBox.classList.toggle("active",App.isTileActive&&App.lastTile!==null);
  },

  /** パレット: 8色は1行（1マス26×28）、16色は8列×2行（1マス26×26） */
  paintPal8(){
    const R=this.refs, cv=R.cvsPal;
    const rows=colors.count>8?2:1, cw=26, ch=rows>1?26:28, H=ch*rows;
    if(cv.height!==H){ cv.height=H; cv.style.height=H+"px"; }
    const ctx=cv.getContext("2d");
    for(let i=0;i<colors.count;i++){
      const x=(i%8)*cw, y=Math.floor(i/8)*ch;
      ctx.fillStyle=colors.css(i);
      ctx.fillRect(x,y,cw,ch);
      if(i===App.selectedLeft){
        ctx.lineWidth=2; ctx.strokeStyle="#fff";
        ctx.strokeRect(x+2,y+2,cw-4,ch-4);
        ctx.lineWidth=1; ctx.strokeStyle="#000";
        ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);
      }
      const c=colors.palette[i];
      const br=(c[0]*299+c[1]*587+c[2]*114)/1000;
      ctx.font="9px Consolas,monospace";
      ctx.fillStyle=br>128?"#000":"#fff";
      ctx.fillText(String(i),x+3,y+11);
      if(engine.colorMask[i]){
        const x1=x+4,y1=y+4,x2=x+cw-5,y2=y+ch-5;
        ctx.lineWidth=3; ctx.strokeStyle="#000";
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.moveTo(x2,y1);ctx.lineTo(x1,y2);ctx.stroke();
        ctx.lineWidth=1; ctx.strokeStyle="#fff";
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.moveTo(x2,y1);ctx.lineTo(x1,y2);ctx.stroke();
      }
    }
  },

  /** 整数倍の拡大: 1ドットを画面の実画素で kx×ky（縦長は ky=2×kx）にする。cssDot は1ドットのおよその幅（CSSのpx） */
  _dotGeom(cssDot){
    const dpr=(typeof window!=="undefined"&&window.devicePixelRatio>0)?window.devicePixelRatio:1;
    const kx=Math.max(1,Math.round(cssDot*dpr));
    return {dpr,kx,ky:kx*(engine.aspectY===2?2:1)};
  },
  /** nx×ny ドットを、1ドット kx×ky 画素のブロックで描く（キャンバスの画素＝画面の実画素）。
      colorAt(x,y) が色番号以外（透明）を返したドットは、checker なら市松、そうでなければ灰色 */
  _paintDots(cv,nx,ny,kx,ky,dpr,colorAt,checker){
    const W=nx*kx, H=ny*ky;
    if(cv.width!==W)cv.width=W;
    if(cv.height!==H)cv.height=H;
    const bd=cv.clientLeft||0;   // 枠線があるときは、その分だけ要素を大きくする（box-sizing:border-box）
    cv.style.width=(W/dpr+2*bd)+"px"; cv.style.height=(H/dpr+2*bd)+"px";
    const ctx=cv.getContext("2d");
    const img=ctx.createImageData(W,H), b32=new Uint32Array(img.data.buffer);
    const pal=UI.pal32();
    const cs=Math.max(1,Math.ceil(kx/2));   // 市松の1マス（画素）
    const rowA=new Uint32Array(W), rowB=new Uint32Array(W);
    for(let y=0;y<ny;y++){
      let trans=false;
      for(let x=0;x<nx;x++){
        const ci=colorAt(x,y), x0=x*kx;
        if(ci>=0&&ci<pal.length){ rowA.fill(pal[ci],x0,x0+kx); rowB.fill(pal[ci],x0,x0+kx); continue; }
        if(!checker){ rowA.fill(UI.TRANS_GRAY32,x0,x0+kx); rowB.fill(UI.TRANS_GRAY32,x0,x0+kx); continue; }
        trans=true;
        for(let sx=0;sx<kx;sx++){
          const odd=Math.floor(sx/cs)&1;
          rowA[x0+sx]=odd?UI.TRANS_LIGHT32:UI.TRANS_GRAY32;
          rowB[x0+sx]=odd?UI.TRANS_GRAY32:UI.TRANS_LIGHT32;
        }
      }
      for(let sy=0;sy<ky;sy++)b32.set((trans&&(Math.floor(sy/cs)&1))?rowB:rowA,(y*ky+sy)*W);
    }
    ctx.putImageData(img,0,0);
    return ctx;
  },
  /** スマホのグラデ帯: 幅いっぱい・高さ約48px。1ドットを2px（縦長は2×4px）の整数倍で描く */
  _paintGradBarSp(cv){
    const box=this.refs.gradBox, ec=gradPalette.entryCount;
    const bw=(box?box.clientWidth:0)-2*(cv.clientLeft||0);   // 帯の枠線の分を引く
    if(bw<=0||ec<1)return;
    const g=this._dotGeom(2);
    const nx=Math.max(1,Math.floor(bw*g.dpr/g.kx)), ny=Math.max(1,Math.floor(48*g.dpr/g.ky));
    const dither=new DitherEngine(engine.dither.spec);
    // 項目の範囲はドット単位で決める（選ぶときも同じ式）
    this._paintDots(cv,nx,ny,g.kx,g.ky,g.dpr,
      (x,y)=>dither.resolveColor(gradPalette.entries[Math.min(ec-1,Math.floor(x*ec/nx))],x,y),false);
    cv._sp={nx,kx:g.kx,dpr:g.dpr};
  },
  /** スマホ: 選択中のパターン（またはタイル）を、1ドット8px（縦長は8×16px）の整数倍で拡大表示する。
      パターン画面のタブの中身の下の空き部分いっぱいに、ドットの区切りと繰り返しの単位の線を付けて描く */
  paintPatLoupe(){
    const R=this.refs, box=R.loupeBox, cv=R.cvsLoupe;
    if(!box||!cv)return;
    const useTile=App.isTileActive&&engine.currentTile!==null;
    // 説明（「色+色 比率」など）。幅が足りないときは + の後ろで折り返せるようにする
    if(R.plDesc)R.plDesc.textContent=this.colorDesc().replace("+","+​");
    if(!isNarrow())return;
    const bw=box.clientWidth, bh=box.clientHeight;
    if(bw<=0||bh<=0)return;
    const g=this._dotGeom(8);
    const nx=Math.max(1,Math.floor(bw*g.dpr/g.kx)), ny=Math.max(1,Math.floor(bh*g.dpr/g.ky));
    const tile=engine.currentTile, pat=engine.currentPattern, de=new DitherEngine(engine.dither.spec);
    const ctx=this._paintDots(cv,nx,ny,g.kx,g.ky,g.dpr,
      useTile?(x,y)=>de.resolveTile(tile,pat,x,y):(x,y)=>de.resolveColor(pat,x,y),true);
    // ドットの区切り（薄く）と、繰り返しの単位（縦長4×2・正方4×4）ごとの区切り（少し濃く）。
    // 線の太さは実画素で1〜2本程度（1ドット24画素なら2本）、境目をまたぐように引く
    const pw=useTile?tile.cols:engine.dither.spec.mx, ph=useTile?tile.rows:engine.dither.spec.my;
    const W=cv.width, H=cv.height, lw=Math.max(1,Math.round(g.kx/12)), lo=Math.floor(lw/2);
    for(const [edge,style] of [[false,"rgba(128,128,128,0.3)"],[true,"rgba(150,150,150,0.75)"]]){
      ctx.fillStyle=style;
      for(let x=1;x<nx;x++)if((x%pw===0)===edge)ctx.fillRect(x*g.kx-lo,0,lw,H);
      for(let y=1;y<ny;y++)if((y%ph===0)===edge)ctx.fillRect(0,y*g.ky-lo,W,lw);
    }
    // 箱の中央に置く
    cv.style.left=Math.floor((bw-W/g.dpr)/2)+"px";
    cv.style.top=Math.floor((bh-H/g.dpr)/2)+"px";
  },

  paintGradBar(cv){
    const R=this.refs;
    cv=cv||R.cvsGrad;
    if(!cv)return;
    if(cv===R.cvsGrad&&isNarrow()){ this._paintGradBarSp(cv); return; }
    // PC: 208×24（1ドット1px）。スマホの大きさで描いたあとなら元に戻す
    if(cv._sp){ cv._sp=null; cv.width=208; cv.height=24; cv.style.width="208px"; cv.style.height="24px"; }
    const ctx=cv.getContext("2d");
    const w=208,h=24;
    const img=ctx.createImageData(w,h);
    const b32=new Uint32Array(img.data.buffer);
    const pal=UI.pal32();
    const dither=new DitherEngine(engine.dither.spec);
    const ec=gradPalette.entryCount;
    if(ec<1)return;
    for(let i=0;i<ec;i++){
      const x0=Math.floor(i*w/ec), x1=Math.floor((i+1)*w/ec);
      const pat=gradPalette.entries[i];
      for(let py=0;py<h;py++){
        for(let px=x0;px<x1&&px<w;px++){
          const ci=dither.resolveColor(pat,px,py);
          b32[py*w+px]=(ci>=0&&ci<pal.length)?pal[ci]:UI.TRANS_GRAY32;
        }
      }
    }
    ctx.putImageData(img,0,0);
  },

  paintGrid(){
    const R=this.refs;
    const ctx=R.cvsGrid.getContext("2d");
    const w=208,h=208,gs=16;
    const img=ctx.createImageData(w,h);
    const b32=new Uint32Array(img.data.buffer);
    const pal=UI.pal32();
    for(let gy=0;gy<gs;gy++){
      const y0=Math.floor(gy*h/gs), y1=Math.floor((gy+1)*h/gs);
      for(let gx=0;gx<gs;gx++){
        const x0=Math.floor(gx*w/gs), x1=Math.floor((gx+1)*w/gs);
        const tile=gridPalette.cells[gy][gx];
        if(!tile)continue;
        for(let py=y0;py<y1;py++){
          for(let px=x0;px<x1;px++){
            const ci=tile.resolveColor(px-x0,py-y0);
            b32[py*w+px]=(ci>=0&&ci<pal.length)?pal[ci]:UI.TRANS_GRAY32;
          }
        }
      }
    }
    ctx.putImageData(img,0,0);
    ctx.strokeStyle="rgba(0,0,0,0.235)";
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=gs;i++){
      const yy=Math.min(h-0.5,Math.floor(i*h/gs)+0.5);
      const xx=Math.min(w-0.5,Math.floor(i*w/gs)+0.5);
      ctx.moveTo(0,yy);ctx.lineTo(w,yy);
      ctx.moveTo(xx,0);ctx.lineTo(xx,h);
    }
    ctx.stroke();
  },

  paintTileStore(){
    const R=this.refs;
    const ctx=R.cvsTileStore.getContext("2d");
    const w=208,h=208,cell=26;
    const img=ctx.createImageData(w,h);
    const b32=new Uint32Array(img.data.buffer);
    const pal=UI.pal32();
    const empty32=(0xFF<<24|0x35<<16|0x2d<<8|0x2a)>>>0;
    for(let row=0;row<8;row++){
      for(let col=0;col<8;col++){
        const tile=App.storedTiles[row*8+col];
        const x0=col*cell, y0=row*cell;
        for(let py=0;py<cell;py++){
          for(let px=0;px<cell;px++){
            let v=empty32;
            if(tile){
              const ci=tile.resolveColor(px,py);
              v=(ci>=0&&ci<pal.length)?pal[ci]:UI.TRANS_GRAY32;
            }
            b32[(y0+py)*w+x0+px]=v;
          }
        }
      }
    }
    ctx.putImageData(img,0,0);
    // 今の色数で表せない色番号を含むタイル（8色のときの8〜15番）は斜線
    ctx.strokeStyle="rgba(255,90,90,0.9)"; ctx.lineWidth=1.5;
    for(let i=0;i<64;i++){
      const tile=App.storedTiles[i];
      if(!tile||tileUsable(tile))continue;
      const x0=(i%8)*cell, y0=Math.floor(i/8)*cell;
      ctx.beginPath();
      for(let k=-cell;k<cell;k+=6){ ctx.moveTo(x0+Math.max(0,k),y0+Math.max(0,-k)); ctx.lineTo(x0+Math.min(cell,k+cell),y0+Math.min(cell,cell-k)); }
      ctx.stroke();
    }
    ctx.strokeStyle="rgba(0,0,0,0.31)";
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let i=0;i<=8;i++){
      const p=Math.min(w-0.5,i*cell+0.5);
      ctx.moveTo(0,p);ctx.lineTo(w,p);
      ctx.moveTo(p,0);ctx.lineTo(p,h);
    }
    ctx.stroke();
  },

  /** レイヤーの小さな見本（描画の直後は少し遅らせてまとめて描く） */
  scheduleThumbs(){
    if(this._thumbTimer)return;
    this._thumbTimer=setTimeout(()=>{ this._thumbTimer=null; this.paintThumbs(); },250);
  },
  paintThumbs(){
    const R=this.refs;
    if(!R.thumbNormal)return;
    const w=engine.w, h=engine.h, tw=36, th=22;
    const pal=UI.pal32();
    const cN=R.thumbNormal.getContext("2d"), iN=cN.createImageData(tw,th), bN=new Uint32Array(iN.data.buffer);
    const cL=R.thumbLine.getContext("2d"), iL=cL.createImageData(tw,th), bL=new Uint32Array(iL.data.buffer);
    const white=0xFFFFFFFF>>>0;
    const lc=(engine.lineLayerColor>=0&&engine.lineLayerColor<pal.length)?pal[engine.lineLayerColor]:(0xFF000000>>>0);
    const px=engine.pixels, lp=engine.linePixels;
    for(let ty=0;ty<th;ty++){
      const sy0=Math.floor(ty*h/th), sy1=Math.max(sy0+1,Math.floor((ty+1)*h/th));
      const syc=Math.min(h-1,Math.floor((ty+0.5)*h/th));
      for(let tx=0;tx<tw;tx++){
        const sx0=Math.floor(tx*w/tw), sx1=Math.max(sx0+1,Math.floor((tx+1)*w/tw));
        const sxc=Math.min(w-1,Math.floor((tx+0.5)*w/tw));
        const ci=px[syc*w+sxc];
        bN[ty*tw+tx]=(ci>=0&&ci<pal.length)?pal[ci]:UI.TRANS_GRAY32;
        let any=0;
        for(let sy=sy0;sy<sy1&&!any;sy++){ const o=sy*w; for(let sx=sx0;sx<sx1;sx++){ if(lp[o+sx]){any=1;break;} } }
        bL[ty*tw+tx]=any?lc:white;
      }
    }
    cN.putImageData(iN,0,0);
    cL.putImageData(iL,0,0);
  },

  /** 解像度モード・カラーモードが変わったとき: 段数で決まる選択肢（位相・擬似透過）とパレットの形を今のモードに合わせる */
  onModeChanged(){
    const R=this.refs, L=engine.dither.spec.levels;
    if(R.selPhase&&R.selPhase.options.length!==L){
      const v=(parseInt(R.selPhase.value,10)||0)%L;
      R.selPhase.replaceChildren();
      for(let i=0;i<L;i++)R.selPhase.append(el("option",{value:String(i),text:String(i)}));
      R.selPhase.value=String(v);
    }
    this.buildOptionBar();
    this.syncFromEngine();
    this.updatePaletteDisplay();
    this.paintThumbs();
  },
  updatePaletteDisplay(){
    const R=this.refs;
    this.paintSelected(R.cvsSel);
    this.paintSelected(R.fgCanvas);
    this.paintSelected(R.topFgCanvas);
    if(R.selD2)R.selD2.textContent=this.colorDesc();
    if(R.sumColor){
      const p=engine.currentPattern;
      const c=(App.isTileActive&&engine.currentTile)?null:(p.ratio>=engine.dither.spec.levels?p.c2:p.c1);
      setSwatchColor(R.sumColor,c===null?TRANSPARENT_INDEX:c);
    }
    if(R.bgChip)setSwatchColor(R.bgChip,App.bgColorIndex);
    if(R.topBg)setSwatchColor(R.topBg,App.bgColorIndex);
    this.paintTilePreview();
    this.paintPal8();
    this.paintGradBar();
    if(R.ob&&R.ob.gradCv)this.paintGradBar(R.ob.gradCv);
    this.paintGrid();
    this.paintTileStore();
    this.paintPatLoupe();
    R.selGradStops.value=String(gradPalette.stopCount);
    for(let i=0;i<4;i++){
      const used=i<gradPalette.stopCount;
      R.gradStopEls[i].classList.toggle("unused",!used);
      R.gradStopEls[i].disabled=!used;
      if(used)setSwatchColor(R.gradStopEls[i],gradPalette.stopColors[i]);
    }
    const corners=[gridPalette.cornerTL,gridPalette.cornerTR,gridPalette.cornerBL,gridPalette.cornerBR];
    for(let i=0;i<4;i++)setSwatchColor(R.cornerEls[i],corners[i]);
    this.updateLineColorDisplay();
    this.syncOptionBar();
  },
};

/* ---------------- スマホ: パネルシート・メニュー ---------------- */
function isNarrow(){
  try{ return !!(window.matchMedia&&window.matchMedia("(max-width:820px)").matches); }catch(e){ return false; }
}
function bbTap(id){
  const cur=toolIdOf(engine.currentTool);
  if(id==="shape"){
    if(cur==="rect"||cur==="ellipse")selectTool(cur==="rect"?"ellipse":"rect");
    else selectTool(App.lastShape||"rect");
    return;
  }
  if(id==="fillgrp"){
    if(cur==="fill"||cur==="grad")selectTool(cur==="fill"?"grad":"fill");
    else selectTool(App.lastFill||"fill");
    return;
  }
  selectTool(id);
}
function sheetOpen(){ return document.body.classList.contains("sheet-open"); }
function openSheet(tab){
  closeMenuSheet();
  if(tab)UI.selectSheetTab(tab);
  document.body.classList.add("sheet-open");
  if(UI.refs.btnSheet)UI.refs.btnSheet.setAttribute("aria-pressed","true");
}
function closeSheet(){
  document.body.classList.remove("sheet-open");
  if(UI.refs.btnSheet)UI.refs.btnSheet.setAttribute("aria-pressed","false");
}
function toggleSheet(){ if(sheetOpen())closeSheet(); else openSheet(App.sheetTab||"color"); }
function closeMenuSheet(){ document.body.classList.remove("menu-open"); }
function toggleMenuSheet(){
  if(document.body.classList.contains("menu-open")){ closeMenuSheet(); return; }
  closeSheet();
  const ms=$("menuSheet");
  ms.innerHTML="";
  for(const m of menuDefs()){
    ms.append(el("div",{class:"ms-title",text:m.label}));
    for(const it of m.items){
      if(it.sep)continue;
      const item=el("div",{class:"menu-item"},el("span",{text:it.label}),it.sc?el("span",{class:"sc",text:it.sc}):null);
      item._def=it;
      item.addEventListener("click",()=>{ closeMenuSheet(); it.action(); });
      ms.append(item);
    }
  }
  refreshMenuStates(ms);
  document.body.classList.add("menu-open");
}
/* ステータスバーのチップから開く小さなメニュー */
function showPopMenu(anchor,items){
  const pm=$("popMenu");
  pm.innerHTML="";
  for(const it of items){
    const item=el("div",{class:"menu-item"+(it.checked?" checked":"")},el("span",{text:it.label}));
    item.addEventListener("click",()=>{ hidePopMenu(); it.action(); });
    pm.append(item);
  }
  const r=anchor.getBoundingClientRect();
  pm.style.left=Math.max(4,r.left)+"px";
  pm.style.bottom=Math.max(4,window.innerHeight-r.top+4)+"px";
  pm.classList.add("show");
}
function hidePopMenu(){ const pm=$("popMenu"); if(pm)pm.classList.remove("show"); }
function colorModeMenu(anchor){
  showPopMenu(anchor,[
    {label:t(COLOR_MODE_LABELS[PaletteMode.Digital8]),checked:colors.mode===PaletteMode.Digital8,action:()=>setPaletteMode(PaletteMode.Digital8)},
    {label:t(COLOR_MODE_LABELS[PaletteMode.Custom8]),checked:colors.mode===PaletteMode.Custom8,action:()=>setPaletteMode(PaletteMode.Custom8)},
    {label:t(COLOR_MODE_LABELS[PaletteMode.Analog16]),checked:colors.mode===PaletteMode.Analog16,action:()=>setPaletteMode(PaletteMode.Analog16)},
  ]);
}

// パターン/タイル変更のエンジン反映
function patternChanged(){ engine.currentPattern={...App.selectedPattern}; }
/** タイルの色番号がすべて今の色数の中にあるか */
function tileUsable(t){ return t.tile.every(r=>r.every(c=>c>=TRANSPARENT_INDEX&&c<colors.count)); }
function pressureGradientDisabled(){
  engine.pressure.pressureGradient=false;
  UI.syncFromEngine();
}

/* =================================================================
   ファイルI/O (RP82/RP81, PAL, TLS, RPI, RPP) - DOM非依存部
   ================================================================= */
/* ===IO-START=== */
// RP82: デスクトップ版8色ペイントの形式（640×200・8色）。書き出せるのは640×200縦長・8色のとき
function encodeRp8(eng,col){
  const W=eng.w, H=eng.h;
  const size=4+2+2+1+1+24+H*(W>>1)+1+H*(W>>3);
  const buf=new ArrayBuffer(size);
  const dv=new DataView(buf);
  let o=0;
  for(const ch of "RP82")dv.setUint8(o++,ch.charCodeAt(0));
  dv.setInt16(o,W,true);o+=2;
  dv.setInt16(o,H,true);o+=2;
  dv.setUint8(o++,eng.currentDotMode);
  dv.setUint8(o++,col.mode===PaletteMode.Digital8?0:1);
  for(let i=0;i<8;i++){
    const c=col.palette[i];
    dv.setUint8(o++,c[0]);dv.setUint8(o++,c[1]);dv.setUint8(o++,c[2]);
  }
  // メインピクセル(2px/byte)
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x+=2){
      const i1=eng.pixels[y*W+x]&7;
      const i2=eng.pixels[y*W+x+1]&7;
      dv.setUint8(o++,(i1<<4)|i2);
    }
  }
  // 線画レイヤー(8px/byte, MSBファースト)
  dv.setUint8(o++,eng.lineLayerColor&0xFF);
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x+=8){
      let b=0;
      for(let bit=0;bit<8;bit++){
        if(eng.linePixels[y*W+x+bit])b|=1<<(7-bit);
      }
      dv.setUint8(o++,b);
    }
  }
  return buf;
}

/** .rp8（RP81・RP82）の先頭か */
function isRp8(ab){
  if(ab.byteLength<34)return false;
  const u=new Uint8Array(ab,0,4);
  const m=magicOf(u);
  return m==="RP81"||m==="RP82";
}
function decodeRp8(ab,eng,col){
  if(ab.byteLength<34)return false;
  const dv=new DataView(ab);
  let o=0;
  const magic=magicOf(new Uint8Array(ab,0,4));
  o=4;
  if(magic!=="RP81"&&magic!=="RP82")return false;
  const w=dv.getInt16(o,true);o+=2;
  const h=dv.getInt16(o,true);o+=2;
  const dotMode=dv.getUint8(o++);
  const palMode=dv.getUint8(o++);
  for(let i=0;i<8;i++){
    col.palette[i]=[dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2)];
    o+=3;
  }
  col.mode=(palMode===0)?PaletteMode.Digital8:PaletteMode.Custom8;
  eng.currentDotMode=(dotMode===1)?DotMode.Scanline:DotMode.DoubleHeight;
  eng.clearCanvas(0);
  eng.clearLineLayer();
  const W=eng.w, H=eng.h;
  const maxY=Math.min(H-1,h-1);
  const maxW=Math.min(W,w);
  for(let y=0;y<=maxY;y++){
    for(let x=0;x<maxW;x+=2){
      if(o>=ab.byteLength)return true;
      const packed=dv.getUint8(o++);
      eng.pixels[y*W+x]=(packed>>4)&7;
      if(x+1<W)eng.pixels[y*W+x+1]=packed&7;
    }
  }
  if(magic==="RP82"&&o<ab.byteLength){
    eng.lineLayerColor=dv.getUint8(o++);
    for(let y=0;y<=maxY;y++){
      for(let x=0;x<maxW;x+=8){
        if(o>=ab.byteLength)return true;
        const b=dv.getUint8(o++);
        for(let bit=0;bit<8;bit++){
          if(x+bit<W)eng.linePixels[y*W+x+bit]=(b>>(7-bit))&1;
        }
      }
    }
  }
  return true;
}

// .pal: 8色は8行・各行RGBの3桁（0〜7）、16色アナログは16行・各行3桁の16進（0〜F。16色版と同じ）。改行はCRLF
function encodePal(col){
  let s="";
  if(col.count===16){
    for(let i=0;i<16;i++){
      const c=col.palette[i];
      s+=[0,1,2].map(k=>ColorEngine.toBits(c[k],4).toString(16).toUpperCase()).join("")+"\r\n";
    }
    return s;
  }
  for(let i=0;i<8;i++){
    const c=col.palette[i];
    s+=String(ColorEngine.to3Bit(c[0]))+String(ColorEngine.to3Bit(c[1]))+String(ColorEngine.to3Bit(c[2]))+"\r\n";
  }
  return s;
}
/** .pal の色数を見分ける: 色の行（3文字以上）が9行以上なら16色、それ以外は8色 */
function palFileCount(text){
  return text.split(/\r?\n/).filter(l=>l.trim().length>=3).length>8?16:8;
}
/** .pal を今のパレットへ読む（col の色数の形で読む。色数の確かめは呼ぶ側） */
function decodePal(text,col){
  const lines=text.split(/\r?\n/);
  if(col.count===16){
    for(let i=0;i<Math.min(16,lines.length);i++){
      const hx=lines[i].trim();
      if(hx.length>=3)col.palette[i]=[0,1,2].map(k=>ColorEngine.fromBits(parseInt(hx[k],16)&15,4));
    }
    return;
  }
  for(let i=0;i<Math.min(8,lines.length);i++){
    const hx=lines[i].trim();
    if(hx.length>=3){
      col.palette[i]=[
        ColorEngine.to8Bit(parseInt(hx[0],16)&7),
        ColorEngine.to8Bit(parseInt(hx[1],16)&7),
        ColorEngine.to8Bit(parseInt(hx[2],16)&7)];
    }
  }
}

// .tls: 縦長ドット用（4×2）はテキスト「TLS1」＋改行、正方ピクセル用（4×4）は16色版と同じバイナリ（「TLS1」・列8・行8・各枠 0=空 / 1＋4行×2バイト）
function encodeTls(storedTiles,kind){
  if(kind==="bayer4"){
    const b=[84,76,83,49,8,8];
    for(let i=0;i<64;i++){
      const t=storedTiles[i];
      if(!t){ b.push(0); continue; }
      b.push(1);
      for(let py=0;py<4;py++){
        const r=t.tile[py];
        b.push(((r[0]&15)<<4)|(r[1]&15),((r[2]&15)<<4)|(r[3]&15));
      }
    }
    return new Uint8Array(b);
  }
  let s="TLS1\r\n64\r\n";
  for(let i=0;i<64;i++){
    const t=storedTiles[i];
    if(!t){s+="EMPTY\r\n";continue;}
    const vals=[];
    for(let py=0;py<2;py++)for(let px=0;px<4;px++)vals.push(t.tile[py][px]);
    s+=vals.join(",")+"\r\n";
  }
  return s;
}
function _tlsBytes(data){
  if(typeof data==="string")return null;
  if(ArrayBuffer.isView(data))return new Uint8Array(data.buffer,data.byteOffset,data.byteLength);
  return new Uint8Array(data);
}
/** .tls の形: "tall4x2"（テキスト）・"bayer4"（バイナリ）・null（どちらでもない） */
function tlsKind(data){
  const u=_tlsBytes(data);
  if(u===null){
    if(!data.startsWith("TLS1"))return null;
    const c=data.charAt(4);
    return (c==="\r"||c==="\n")?"tall4x2":null;
  }
  if(u.length<6||u[0]!==84||u[1]!==76||u[2]!==83||u[3]!==49)return null;
  if(u[4]===13||u[4]===10)return "tall4x2";
  if(u[4]===8)return "bayer4";
  return null;
}
/** .tls を保存欄へ読む（文字列はテキストとして、バイト列は形を見分けて読む）。読めたら true */
function decodeTls(data,storedTiles){
  const u=_tlsBytes(data);
  if(u!==null&&tlsKind(u)==="bayer4"){
    const count=Math.min(u[4]*u[5],64);
    let o=6;
    for(let i=0;i<count&&o<u.length;i++){
      if(u[o++]===0){ storedTiles[i]=null; continue; }
      if(o+8>u.length)break;
      const tile=new TilePattern(4,4);
      for(let py=0;py<4;py++){
        const b1=u[o++], b2=u[o++];
        tile.tile[py][0]=(b1>>4)&15; tile.tile[py][1]=b1&15;
        tile.tile[py][2]=(b2>>4)&15; tile.tile[py][3]=b2&15;
      }
      storedTiles[i]=tile;
    }
    return true;
  }
  let text=data;
  if(u!==null)text=new TextDecoder().decode(u);
  const lines=text.split(/\r?\n/);
  if(lines.length<2||lines[0].trim()!=="TLS1")return false;
  let count=parseInt(lines[1].trim(),10);
  if(isNaN(count))count=0;
  for(let i=0;i<Math.min(64,count);i++){
    if(i+2>=lines.length)break;
    const ln=lines[i+2].trim();
    if(ln==="EMPTY"){storedTiles[i]=null;continue;}
    const parts=ln.split(",");
    if(parts.length===8){
      const tile=new TilePattern();
      let pi=0;
      for(let py=0;py<2;py++)for(let px=0;px<4;px++){
        const cv=parseInt(parts[pi],10);
        tile.tile[py][px]=isNaN(cv)?0:cv;
        pi++;
      }
      storedTiles[i]=tile;
    }
  }
  return true;
}

// ===== 段階5: 統合形式 .rpi・16色ペイントの .rpp・インポートの変換・画像の減色（ここまでDOMに依存しない） =====

/** ファイルの先頭4バイトの形式名（"RPI1"・"RP81"・"RP82"・"RPP1"〜"RPP3"）。どれでもなければ null。
    バイト列を文字に直さずに、数で比べる（R=82 P=80 I=73 8=56 1=49） */
function magicOf(u){
  if(!u||u.length<4||u[0]!==82||u[1]!==80)return null;
  const c=u[2], d=u[3];
  if(c===73&&d===49)return "RPI1";
  if(c===56&&(d===49||d===50))return d===49?"RP81":"RP82";
  if(c===80&&d>=49&&d<=51)return ["RPP1","RPP2","RPP3"][d-49];
  return null;
}

// --- .rpi（Retro Paint Image）: 先頭「RPI1」、数値はリトルエンディアン ---
//  0 「RPI1」 / 4 解像度モード(0〜5) / 5 幅(2) / 7 高さ(2) / 9 カラーモード(0〜2) / 10 縦長ドットの表示(0=ダブルハイト,1=スキャンライン)
//  11 背景色 / 12 表示中の画面(0=表,1=裏) / 13 表の線色 / 14 裏の線色 / 15 線画の表示(bit0=表,bit1=裏) / 16 色数N / 17 パレット(N×3)
//  続けて 表の通常(高さ×幅÷2・2ドットで1バイト、上位4bitが左) / 表の線画(高さ×幅÷8・上位ビットが左) / 裏の通常 / 裏の線画
const RPI_HEAD=17;
function rpiSize(w,h,n){ return RPI_HEAD+n*3+2*((w*h)>>1)+2*((w*h)>>3); }
function packNibbles(pix,u,o){
  for(let i=0,n=pix.length;i<n;i+=2){ const a=pix[i], b=pix[i+1]; u[o++]=((a<0?0:a&15)<<4)|(b<0?0:b&15); }
  return o;
}
function packBits(line,u,o){
  for(let i=0,n=line.length;i<n;i+=8){ let b=0; for(let k=0;k<8;k++)if(line[i+k])b|=128>>k; u[o++]=b; }
  return o;
}
function unpackNibbles(u,o,pix){ for(let i=0,n=pix.length;i<n;i+=2){ const b=u[o++]; pix[i]=b>>4; pix[i+1]=b&15; } return o; }
function unpackBits(u,o,line){ for(let i=0,n=line.length;i<n;i+=8){ const b=u[o++]; for(let k=0;k<8;k++)line[i+k]=(b>>(7-k))&1; } return o; }
/** .rpi に保存する: 解像度モード・カラーモード・表示方式・背景色・表示中の画面・画面ごとの線色と線画の表示・パレット・4枚のレイヤー */
function encodeRpi(eng,col,bg){
  const W=eng.w, H=eng.h, N=col.count;
  const buf=new ArrayBuffer(rpiSize(W,H,N)), u=new Uint8Array(buf), dv=new DataView(buf);
  u.set([82,80,73,49],0);   // "RPI1"
  u[4]=eng.res.id; dv.setUint16(5,W,true); dv.setUint16(7,H,true);
  u[9]=col.mode; u[10]=eng.currentDotMode===DotMode.Scanline?1:0;
  u[11]=clamp(bg|0,0,N-1); u[12]=eng.screen?1:0;
  u[13]=clamp(eng.screens[0].lineColor|0,0,N-1); u[14]=clamp(eng.screens[1].lineColor|0,0,N-1);
  u[15]=(eng.screens[0].lineVisible?1:0)|(eng.screens[1].lineVisible?2:0);
  u[16]=N;
  let o=RPI_HEAD;
  for(let i=0;i<N;i++){ const c=col.palette[i]; u[o++]=c[0]; u[o++]=c[1]; u[o++]=c[2]; }
  for(const sc of eng.screens){ o=packNibbles(sc.pix,u,o); o=packBits(sc.line,u,o); }
  return buf;
}
function isRpi(ab){
  if(!ab||ab.byteLength<RPI_HEAD)return false;
  const u=new Uint8Array(ab,0,4);
  return u[0]===82&&u[1]===80&&u[2]===73&&u[3]===49;
}
/** .rpi を読む（エンジンには入れない）。形が正しくなければ null。screens[s] は {pix,line} */
function decodeRpi(ab){
  if(!isRpi(ab))return null;
  const u=new Uint8Array(ab), dv=new DataView(ab);
  const resId=u[4], W=dv.getUint16(5,true), H=dv.getUint16(7,true), cm=u[9], N=u[16];
  const res=RES[resId], cs=COLOR[cm];
  if(!res||!cs||res.w!==W||res.h!==H||N!==cs.count||ab.byteLength<rpiSize(W,H,N))return null;
  const idx=(v)=>v<N?v:0;
  const palette=[]; let o=RPI_HEAD;
  for(let i=0;i<N;i++){ palette.push([u[o],u[o+1],u[o+2]]); o+=3; }
  const screens=[];
  for(let s=0;s<2;s++){
    const pix=new Int8Array(W*H), line=new Uint8Array(W*H);
    o=unpackNibbles(u,o,pix); o=unpackBits(u,o,line);
    if(N<16)for(let i=0;i<pix.length;i++)if(pix[i]>=N)pix[i]=0;   // 今の色数で表せない番号は0番に
    screens.push({pix,line});
  }
  return {res:resId,w:W,h:H,color:cm,dot:u[10]===1?DotMode.Scanline:DotMode.DoubleHeight,bg:idx(u[11]),screen:u[12]?1:0,
    lineColor:[idx(u[13]),idx(u[14])],lineVisible:[!!(u[15]&1),!!(u[15]&2)],palette,screens};
}

// --- .rpp（16色ペイント）: 「RPP1」〜「RPP3」・幅(2)・高さ(2)・パレット16色(RGB)・表の画面（1行を2ドットで1バイト、上位4bitが左）。RPP3 は続けて裏の画面 ---
const RPP_HEAD=8+48;
function isRpp(ab){
  if(!ab||ab.byteLength<RPP_HEAD)return false;
  const u=new Uint8Array(ab,0,4);
  return u[0]===82&&u[1]===80&&u[2]===80&&u[3]>=49&&u[3]<=51;
}
/** .rpp を読む（16色版の LoadRpp と同じ）: {magic,w,h,palette,screens:[表,裏またはnull]}。裏は RPP3 で続きがあるときだけ */
function decodeRpp(ab){
  if(!isRpp(ab))return null;
  const u=new Uint8Array(ab), dv=new DataView(ab);
  const magic=magicOf(u);
  const w=dv.getInt16(4,true), h=dv.getInt16(6,true);
  if(w<1||h<1||w>4096||h>4096)return null;
  const palette=[]; let o=8;
  for(let i=0;i<16;i++){ palette.push([u[o],u[o+1],u[o+2]]); o+=3; }
  const read=()=>{
    const pix=new Int8Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x+=2){
      if(o>=u.length)return pix;
      const b=u[o++];
      pix[y*w+x]=b>>4;
      if(x+1<w)pix[y*w+x+1]=b&15;
    }
    return pix;
  };
  const front=read();
  const back=(magic==="RPP3"&&o<u.length)?read():null;
  return {magic,w,h,palette,screens:[front,back]};
}
/** .rpp に書き出す（RPP3・表画面と裏画面）。8色のときはパレットの9〜16番目を黒で埋める。bake[s] なら画面sの線画を線色で焼き込む */
function encodeRpp(eng,col,bake){
  const W=eng.w, H=eng.h, n=W*H;
  const buf=new ArrayBuffer(RPP_HEAD+2*((W+1)>>1)*H), u=new Uint8Array(buf), dv=new DataView(buf);
  u.set([82,80,80,51],0);   // "RPP3"
  dv.setInt16(4,W,true); dv.setInt16(6,H,true);
  let o=8;
  for(let i=0;i<16;i++){ const c=i<col.count?col.palette[i]:[0,0,0]; u[o++]=c[0]; u[o++]=c[1]; u[o++]=c[2]; }
  for(let s=0;s<2;s++){
    const sc=eng.screens[s], bk=!!(bake&&bake[s]);
    const v=(i)=>{ const c=(bk&&sc.line[i])?sc.lineColor:sc.pix[i]; return c<0?0:c&15; };
    for(let i=0;i<n;i+=2)u[o++]=(v(i)<<4)|v(i+1);
  }
  return buf;
}
// 正方ピクセルの解像度モード（面積の小さい順）
const SQUARE_RES=RES.filter(r=>r.aspectY===1).sort((a,b)=>a.w*a.h-b.w*b.h).map(r=>r.id);
/** .rpp を開くときの解像度モード: 正方4種類のどれかと同じ大きさならそのモード。違えば全体が入るいちばん小さい正方モードに左上詰め。
    640×800 にも入らなければ 640×800 で、はみ出た分は切り取る */
function rppTargetRes(w,h){
  for(const id of SQUARE_RES)if(RES[id].w===w&&RES[id].h===h)return {res:id,exact:true,crop:false};
  for(const id of SQUARE_RES)if(w<=RES[id].w&&h<=RES[id].h)return {res:id,exact:false,crop:false};
  return {res:SQUARE_RES[SQUARE_RES.length-1],exact:false,crop:true};
}

/** .rp8 を読む（エンジンには入れない。インポート用）: {magic,w,h,dot,palMode,palette,pix,line,lineColor}。RP81 は線画なし（line=null） */
function parseRp8(ab){
  if(!isRp8(ab))return null;
  const u=new Uint8Array(ab), dv=new DataView(ab);
  const magic=magicOf(u);
  const w=dv.getInt16(4,true), h=dv.getInt16(6,true);
  if(w<1||h<1||w>4096||h>4096)return null;
  const dot=u[8]===1?DotMode.Scanline:DotMode.DoubleHeight, palMode=u[9]===0?PaletteMode.Digital8:PaletteMode.Custom8;
  const palette=[]; let o=10;
  for(let i=0;i<8;i++){ palette.push([u[o],u[o+1],u[o+2]]); o+=3; }
  const pix=new Int8Array(w*h);
  let full=true;
  for(let y=0;y<h&&full;y++)for(let x=0;x<w;x+=2){
    if(o>=u.length){ full=false; break; }
    const b=u[o++];
    pix[y*w+x]=(b>>4)&7;
    if(x+1<w)pix[y*w+x+1]=b&7;
  }
  let line=null, lineColor=0;
  if(magic==="RP82"&&full&&o<u.length){
    const lc=u[o++]; lineColor=lc<8?lc:0;
    line=new Uint8Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x+=8){
      if(o>=u.length)break;
      const b=u[o++];
      for(let k=0;k<8&&x+k<w;k++)line[y*w+x+k]=(b>>(7-k))&1;
    }
  }
  return {magic,w,h,dot,palMode,palette,pix,line,lineColor};
}

// --- 色差（OKLab）: 人の見え方に近い色差。混ぜた色は光の強さ（線形のRGB）で平均する ---
function srgbToLinear(v){ v/=255; return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4); }
function oklabOfLinear(r,g,b){
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
  const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
  const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,
          1.9779984951*l-2.4285922050*m+0.4505937099*s,
          0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
function oklabOf(c){ return oklabOfLinear(srgbToLinear(c[0]),srgbToLinear(c[1]),srgbToLinear(c[2])); }
function labDist2(a,b){ const d0=a[0]-b[0], d1=a[1]-b[1], d2=a[2]-b[2]; return d0*d0+d1*d1+d2*d2; }
/** いちばん近い色の番号（OKLab）。同じ近さなら小さい番号 */
function nearestIndexLab(lab,palLab){
  let best=0, bd=Infinity;
  for(let i=0;i<palLab.length;i++){ const d=labDist2(lab,palLab[i]); if(d<bd){ bd=d; best=i; } }
  return best;
}

// --- インポート: 専用ファイルの画面を、今の絵の1画面へ写す ---
/** 大きさの合わせ方の倍率（縦横比は保つ）。fit: 0=そのまま / 1=画面に合わせる（全体が入るように縮小だけ） / 2=幅を合わせる / 3=高さを合わせる
    （2と3は拡大もする。はみ出た分は位置に合わせて切り取る）。true・false は 1・0 と同じ */
function fitScale(fit,ew,eh,W,H){
  const f=+fit||0;
  if(f===1)return Math.min(1,W/ew,H/eh);
  if(f===2)return W/ew;
  if(f===3)return H/eh;
  return 1;
}
/** 色の対応表（元の色番号 → 今のパレットの色番号）。nearest=false は色番号のまま（今の色数にない番号だけ近い色）、true はどれも近い色 */
function importColorMap(srcPal,dstPal,dstCount,nearest){
  const dl=dstPal.slice(0,dstCount).map(oklabOf);
  return srcPal.map((c,i)=>(!nearest&&i<dstCount)?i:nearestIndexLab(oklabOf(c),dl));
}
/** 使っている色（used[i]）が、今のパレットの同じ番号と同じ色か（同じなら「色番号のまま」を最初に選ぶ） */
function samePaletteFor(srcPal,dstPal,dstCount,used){
  for(let i=0;i<srcPal.length;i++){
    if(!used[i])continue;
    if(i>=dstCount)return false;
    const a=srcPal[i], b=dstPal[i];
    if(a[0]!==b[0]||a[1]!==b[1]||a[2]!==b[2])return false;
  }
  return true;
}
/** 専用ファイルの1画面を今の絵の1画面へ
    src: {w,h,aspectY,pix,line(nullも可),palette,lineColor} / dst: {w,h,aspectY,palette,count,bg}
    opt: {fit:大きさ（fitScale の 0〜3）, center:中央, matchShape:見た目を合わせる, nearest:近い色に置き換える, withLine:線画も読み込む}
    ドットの形が違うとき「見た目を合わせる」なら、縦長→正方は各行を2行に、正方→縦長は1行おきに取り込む。
    拡大・縮小は最近傍。はみ出た分は切り取り、足りない所は背景色（線画は透明）。返り値 {pix,line(線画を読まないときnull),lineColor} */
function importIndexed(src,dst,opt){
  let eh=src.h, rowOf=(y)=>y;
  if(opt.matchShape&&src.aspectY!==dst.aspectY){
    if(src.aspectY===2){ eh=src.h*2; rowOf=(y)=>y>>1; }         // 縦長→正方: 各行を2行に
    else{ eh=(src.h+1)>>1; rowOf=(y)=>y*2; }                     // 正方→縦長: 1行おきに
  }
  const ew=src.w, W=dst.w, H=dst.h;
  const s=fitScale(opt.fit,ew,eh,W,H);
  const pw=Math.max(1,Math.round(ew*s)), ph=Math.max(1,Math.round(eh*s));
  const ox=opt.center?((W-pw)>>1):0, oy=opt.center?((H-ph)>>1):0;
  const map=importColorMap(src.palette,dst.palette,dst.count,!!opt.nearest);
  const pix=new Int8Array(W*H).fill(dst.bg);
  const withLine=!!(opt.withLine&&src.line);
  const line=withLine?new Uint8Array(W*H):null;
  // 読み込み先のドット → 元のドット（拡大・縮小は最近傍。-1 は範囲の外）
  const xs=new Int32Array(W).fill(-1), ys=new Int32Array(H).fill(-1);
  for(let x=0;x<W;x++){ const tx=x-ox; if(tx>=0&&tx<pw)xs[x]=Math.min(ew-1,Math.floor((tx+0.5)*ew/pw)); }
  for(let y=0;y<H;y++){ const ty=y-oy; if(ty>=0&&ty<ph)ys[y]=rowOf(Math.min(eh-1,Math.floor((ty+0.5)*eh/ph))); }
  for(let y=0;y<H;y++){
    const sy=ys[y]; if(sy<0)continue;
    const so=sy*src.w, d=y*W;
    for(let x=0;x<W;x++){
      const sx=xs[x]; if(sx<0)continue;
      const v=src.pix[so+sx];
      pix[d+x]=(v>=0&&v<map.length)?map[v]:dst.bg;
      if(withLine)line[d+x]=src.line[so+sx]?1:0;
    }
  }
  const lc=src.lineColor|0;
  return {pix,line,lineColor:withLine?((lc>=0&&lc<map.length)?map[lc]:0):null};
}

// --- 画像の減色: パレットの2色と混合比率の組み合わせで、描画のディザと同じ模様を使って近い色を作る ---
/** 画像を今の絵に置く位置と大きさ（表示のドット）。fit=大きさ（fitScale の 0〜3）、center=中央。縦長ドットは縦の位置を偶数にそろえる */
function imagePlacement(iw,ih,W,dispH,aspectY,fit,center){
  const s=fitScale(fit,iw,ih,W,dispH);
  const pw=Math.max(1,Math.round(iw*s)), ph=Math.max(1,Math.round(ih*s));
  const ox=center?((W-pw)>>1):0;
  let oy=center?((dispH-ph)>>1):0;
  if(aspectY===2)oy-=(oy&1);
  return {s,pw,ph,ox,oy,scaled:s!==1};
}
// --- 画像の明るさ・コントラスト（減色の前に画像の色だけに当てる。余白と透明な所は背景色のまま） ---
/** 補正表（0〜255 → 0〜255）。bright・contrast は -100〜100。どちらも 0 なら null（補正なし）
    明るさ: 正は白へ、負は黒へ寄せる（100 で半分まで）。コントラスト: 真ん中（128）を中心に傾きを変える（-100 で一様な灰色、100 で2値）。
    R・G・B それぞれに、表示の値（sRGB）のまま当てる */
function toneLut(bright,contrast){
  const B=clamp(Math.round(+bright||0),-100,100), C=clamp(Math.round(+contrast||0),-100,100);
  if(!B&&!C)return null;
  const b=B/200, slant=Math.tan((C/100+1)*Math.PI/4), lut=new Uint8Array(256);
  for(let i=0;i<256;i++){
    let v=i/255;
    v=b<0?v*(1+b):v+(1-v)*b;
    v=(v-0.5)*slant+0.5;
    lut[i]=v<=0?0:v>=1?255:Math.round(v*255);
  }
  return lut;
}
/** RGBA の R・G・B に補正表を当てた写し（透明度はそのまま） */
function applyToneLut(rgba,lut){
  const out=new Uint8ClampedArray(rgba.length);
  for(let i=0;i<rgba.length;i+=4){ out[i]=lut[rgba[i]]; out[i+1]=lut[rgba[i+1]]; out[i+2]=lut[rgba[i+2]]; out[i+3]=rgba[i+3]; }
  return out;
}
/** 減色の候補を作る（パレット・段数・方法ごとに1回）。dither=true: 1色そのままと、2色の組×混合比率1〜段数-1。false: 1色ずつ（近い色だけ）
    離れた2色の混合（赤とシアンで灰色など）は選ばれにくくする補正を足す */
function makeQuantizer(palette,count,spec,dither){
  const lin=[], lab=[];
  for(let i=0;i<count;i++){
    const c=palette[i], l=[srgbToLinear(c[0]),srgbToLinear(c[1]),srgbToLinear(c[2])];
    lin.push(l); lab.push(oklabOfLinear(l[0],l[1],l[2]));
  }
  const ci=[], cj=[], cr=[], cl=[], pen=[];
  for(let i=0;i<count;i++){ ci.push(i); cj.push(i); cr.push(0); cl.push(lab[i]); pen.push(0); }
  if(dither){
    const L=spec.levels;
    for(let i=0;i<count;i++)for(let j=i+1;j<count;j++){
      const p=labDist2(lab[i],lab[j])*0.1;
      for(let r=1;r<L;r++){
        const t=r/L, a=lin[i], b=lin[j];
        ci.push(i); cj.push(j); cr.push(r);
        cl.push(oklabOfLinear(a[0]*(1-t)+b[0]*t,a[1]*(1-t)+b[1]*t,a[2]*(1-t)+b[2]*t));
        pen.push(p*(Math.abs(t-0.5)+0.5));
      }
    }
  }
  const K=ci.length, CL=new Float64Array(K*3);
  for(let k=0;k<K;k++){ CL[k*3]=cl[k][0]; CL[k*3+1]=cl[k][1]; CL[k*3+2]=cl[k][2]; }
  const exact=new Map();   // パレットと同じ色はそのまま（同じ色が2つあれば小さい番号）
  for(let i=count-1;i>=0;i--){ const c=palette[i]; exact.set((c[0]<<16)|(c[1]<<8)|c[2],i); }
  return {spec,count,palette:palette.slice(0,count).map(c=>c.slice()),dither:!!dither,K,CL,PEN:Float64Array.from(pen),
    ci:Int32Array.from(ci),cj:Int32Array.from(cj),cr:Int32Array.from(cr),memo:new Int32Array(32768).fill(-1),exact};
}
/** 色（RGB各5bitに丸めた key）にいちばん近い候補。答えは覚えておく（最大32768通り） */
function quantPick(q,key){
  let k=q.memo[key];
  if(k>=0)return k;
  const r=((key>>10)&31)*255/31, g=((key>>5)&31)*255/31, b=(key&31)*255/31;
  const lab=oklabOfLinear(srgbToLinear(r),srgbToLinear(g),srgbToLinear(b));
  const CL=q.CL, PEN=q.PEN, L0=lab[0], L1=lab[1], L2=lab[2];
  let bd=Infinity; k=0;
  for(let c=0,n=q.K;c<n;c++){
    const d0=L0-CL[c*3], d1=L1-CL[c*3+1], d2=L2-CL[c*3+2], d=d0*d0+d1*d1+d2*d2+PEN[c];
    if(d<bd){ bd=d; k=c; }
  }
  q.memo[key]=k;
  return k;
}
/** RGBA（論理のドット W×H）を色番号にする。透明は背景色、半透明は背景色と重ねる。
    混ぜる2色のどちらを置くかは解像度モードのディザ行列（位相0）で決める（描画のディザと同じ模様） */
function quantizeRgba(rgba,W,H,q,bg){
  const out=new Int8Array(W*H), d=q.spec, mxm=d.mx-1, mym=d.my-1;
  const bc=q.palette[bg]||[0,0,0], bgKey=(bc[0]<<16)|(bc[1]<<8)|bc[2];
  for(let y=0;y<H;y++){
    const row=d.matrix[y&mym];
    for(let x=0;x<W;x++){
      const i=y*W+x, o=i*4, a=rgba[o+3];
      if(a===0){ out[i]=bg; continue; }
      let r=rgba[o], g=rgba[o+1], b=rgba[o+2];
      if(a<255){ const t=a/255; r=Math.round(r*t+bc[0]*(1-t)); g=Math.round(g*t+bc[1]*(1-t)); b=Math.round(b*t+bc[2]*(1-t)); }
      const rgb=(r<<16)|(g<<8)|b;
      if(rgb===bgKey){ out[i]=bg; continue; }
      const ex=q.exact.get(rgb);
      if(ex!==undefined){ out[i]=ex; continue; }
      const k=quantPick(q,(Math.min(31,Math.round(r/8))<<10)|(Math.min(31,Math.round(g/8))<<5)|Math.min(31,Math.round(b/8)));
      out[i]=(row[x&mxm]<q.cr[k])?q.cj[k]:q.ci[k];
    }
  }
  return out;
}
/** タイルの各行を2回ずつ並べる（縦長の4×2 → 正方の4×4。正方ピクセルへの変換で使う） */
function tileDoubleRows(t){
  const n=new TilePattern(t.rows*2,t.cols);
  for(let y=0;y<t.rows;y++)for(let x=0;x<t.cols;x++){ n.tile[2*y][x]=t.tile[y][x]; n.tile[2*y+1][x]=t.tile[y][x]; }
  return n;
}
/** タイルの行を1行おきに取り出す（正方の4×4 → 縦長の4×2。行 b と b+2。縦長ドットへの変換で使う） */
function tileHalveRows(t,b){
  const n=new TilePattern(t.rows>>1,t.cols);
  for(let y=0;y<n.rows;y++)for(let x=0;x<t.cols;x++)n.tile[y][x]=t.tile[(2*y+b)%t.rows][x];
  return n;
}

/* =================================================================
   ファイル保存/読込 (ブラウザ連携)
   ================================================================= */
/* ---------- 保存（ファイルとして渡す）と、zip から開く ----------
   手元のファイルで開いているとき: ブラウザのダウンロード（一時URLはここ1か所だけ）。
   claude.ai で公開したページで開いているとき: ページから直接はダウンロードできないので、見る人に確認を出して渡す
   （公開ページの downloads の機能）。そこで渡せる拡張子は決まっているので、PNG 以外は zip（圧縮なし）に入れて渡す。
   その zip は、開く・インポート・パレット読込・タイルセット読込でそのまま選べる */
const viewerSave=(()=>{
  try{
    const c=window.claude;
    return (c&&typeof c.use==="function")?Promise.resolve(c.use("downloads")).catch(()=>null):null;
  }catch(e){ return null; }
})();
/** blob を name で保存する。保存できたら true（手元のファイルでは、ダウンロードに渡したら true） */
function download(blob,name){
  if(viewerSave)return saveInViewer(blob,name);
  browserDownload(blob,name);
  return Promise.resolve(true);
}
function browserDownload(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
/** 公開ページで保存する。見る人が確認で「保存」を選んだら true */
async function saveInViewer(blob,name){
  const dl=await viewerSave;
  if(!dl){
    // 保存の機能が使えない: ふつうのダウンロードを試す。ページが枠の中なら届かないので知らせる
    let framed=true;
    try{ framed=window.top!==window.self; }catch(e){}
    if(framed)toast(t("このページでは保存できません。"),4000);
    browserDownload(blob,name);
    return !framed;
  }
  const zip=!/\.png$/i.test(name);
  const filename=zip?name+".zip":name;
  try{
    const data=zip?zipOne(name,new Uint8Array(await blob.arrayBuffer())):blob;
    await dl.save({filename,data});
  }catch(e){
    const code=e&&e.code;
    if(code==="declined")return false;   // 見る人が保存をやめた
    if(code==="rate_limited")toast(t("保存の確認がまだ開いています。閉じてからもう一度保存してください。"),4000);
    else if(code==="too_large")toast(t("ファイルが大きすぎて保存できません。"),4000);
    else if(code==="rejected_extension"||code==="extension_not_enabled")toast(t("このページではこの形式のファイルを保存できません。"),4000);
    else toast(t("このページでは保存できません。"),4000);
    return false;
  }
  if(zip)toast(t("{f} として保存しました（開くときは、この zip をそのまま選べます）").replace("{f}",filename),4000);
  return true;
}
/** CRC-32（zip の中身の確かめに使う） */
function crc32(u){
  let tb=crc32.table;
  if(!tb){
    tb=crc32.table=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); tb[n]=c>>>0; }
  }
  let c=0xFFFFFFFF;
  for(let i=0;i<u.length;i++)c=tb[(c^u[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
/** ファイル1つだけを入れた zip（圧縮なし。名前は UTF-8） */
function zipOne(name,data){
  const nm=new TextEncoder().encode(name), n=nm.length, len=data.length, crc=crc32(data);
  const d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const date=((Math.max(1980,d.getFullYear())-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const c=30+n+len, e=c+46+n;
  const out=new Uint8Array(e+22), dv=new DataView(out.buffer);
  const head=(o,sig)=>{ dv.setUint32(o,sig,true); };
  // ファイルの前の見出し
  head(0,0x04034b50); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
  dv.setUint16(10,time,true); dv.setUint16(12,date,true);
  dv.setUint32(14,crc,true); dv.setUint32(18,len,true); dv.setUint32(22,len,true); dv.setUint16(26,n,true);
  out.set(nm,30); out.set(data,30+n);
  // 目次
  head(c,0x02014b50); dv.setUint16(c+4,20,true); dv.setUint16(c+6,20,true); dv.setUint16(c+8,0x0800,true);
  dv.setUint16(c+12,time,true); dv.setUint16(c+14,date,true);
  dv.setUint32(c+16,crc,true); dv.setUint32(c+20,len,true); dv.setUint32(c+24,len,true); dv.setUint16(c+28,n,true);
  out.set(nm,c+46);
  // 終わり
  head(e,0x06054b50); dv.setUint16(e+8,1,true); dv.setUint16(e+10,1,true); dv.setUint32(e+12,46+n,true); dv.setUint32(e+16,c,true);
  return out;
}
/** 圧縮された中身（deflate）を戻す。ブラウザにその機能がなければ null */
async function inflateRaw(u){
  if(typeof DecompressionStream!=="function")return null;
  try{
    const ds=new DecompressionStream("deflate-raw"), w=ds.writable.getWriter();
    w.write(u).catch(()=>{}); w.close().catch(()=>{});
    const r=ds.readable.getReader(), parts=[];
    let n=0;
    for(;;){ const {value,done}=await r.read(); if(done)break; parts.push(value); n+=value.length; }
    const out=new Uint8Array(n);
    let o=0;
    for(const v of parts){ out.set(v,o); o+=v.length; }
    return out;
  }catch(e){ return null; }
}
const ZIP_MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",bmp:"image/bmp",webp:"image/webp"};
/** zip なら、中から拡張子が exts のどれかのファイルを1つ取り出して File にする（最初に見つかったもの）。
    zip でなければそのまま返す。開けなければ知らせて null */
async function unzipPick(f,exts){
  const h=new Uint8Array(await f.slice(0,4).arrayBuffer());
  const sig=h.length===4?(h[0]|(h[1]<<8)|(h[2]<<16)|(h[3]<<24))>>>0:0;
  if(sig!==0x04034b50&&sig!==0x06054b50&&!/\.zip$/i.test(f.name))return f;
  const fail=async(msg)=>{ await Modal.alert(msg); return null; };
  const u=new Uint8Array(await f.arrayBuffer()), dv=new DataView(u.buffer,u.byteOffset,u.byteLength);
  let e=-1;
  for(let i=u.length-22;i>=0&&i>=u.length-22-65535;i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0)return fail(t("この zip は開けません。"));
  const cnt=dv.getUint16(e+10,true);
  let p=dv.getUint32(e+16,true);
  const want=new RegExp("\\.("+exts.join("|")+")$","i");
  for(let k=0;k<cnt&&p+46<=u.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const flag=dv.getUint16(p+8,true), method=dv.getUint16(p+10,true), crc=dv.getUint32(p+16,true);
    const csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true), off=dv.getUint32(p+42,true);
    const nlen=dv.getUint16(p+28,true), raw=u.subarray(p+46,p+46+nlen);
    p+=46+nlen+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
    let name;
    try{ name=new TextDecoder((flag&0x800)?"utf-8":"shift_jis").decode(raw); }catch(err){ name=new TextDecoder().decode(raw); }
    const base=name.replace(/^.*[\\/]/,"");
    if(!base||name.startsWith("__MACOSX/")||base.startsWith("._")||!want.test(base))continue;
    if(flag&1)return fail(t("暗号化された zip は開けません。"));
    if(off+30>u.length||dv.getUint32(off,true)!==0x04034b50)return fail(t("この zip は開けません。"));
    const s=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);
    const comp=u.subarray(s,s+csize);
    const data=method===0?comp:method===8?await inflateRaw(comp):null;
    if(!data||data.length!==usize||crc32(data)!==crc)return fail(t("この zip は開けません（中のファイルを取り出してから開いてください）。"));
    const ext=base.slice(base.lastIndexOf(".")+1).toLowerCase();
    return new File([data],base,{type:ZIP_MIME[ext]||""});
  }

/** ファイル名から拡張子を除いた名前（保存するときの名前に使う） */

/** 切り替えボタンの組（.seg）。options=[[値,表示],...]。_sync() で押された表示を今の値に合わせる */
function segControl(options,get,set,label){
  const seg=el("span",{class:"seg",role:"group"});
  if(label)seg.setAttribute("aria-label",label);
  seg._btns=options.map(([v,text])=>{
    const b=el("button",{type:"button","aria-pressed":"false"},text);
    b.addEventListener("click",()=>{ if(!b.disabled)set(v); });
    seg.append(b);
    return [v,b];
  });
  seg._sync=()=>{ const cur=get(); for(const [v,b] of seg._btns)b.setAttribute("aria-pressed",String(v===cur)); };
  return seg;
}

function applyRpi(d){
