  if(COLOR[d.color].editable)colors.palette=d.palette.map(c=>c.slice());   // 8色デジタルは固定の色
  engine.currentDotMode=d.dot;
  for(let s=0;s<2;s++){
    const sc=engine.screens[s], ds=d.screens[s];
    sc.pix.set(ds.pix); sc.line.set(ds.line);
    sc.lineColor=d.lineColor[s]; sc.lineVisible=d.lineVisible[s];

  }

/** .rp8 を開く: 640×200（縦長ドット）・8色。パレットとカラーモード（8色デジタル／8色アナログ）はファイルのもの。
    .rp8 は1画面なので、表画面とその線画に読み、裏画面は空（背景色）にする */
function applyRp8(ab){
  stashColorSettings();
  if(engine.res.id!==2||colors.count!==8)configure(2,PaletteMode.Digital8);
  engine.showScreen(0);
  engine.screens[1].pix.fill(App.bgColorIndex); engine.screens[1].line.fill(0); engine.screens[1].touched=false;
  decodeRp8(ab,engine,colors);
  engine.screens[0].touched=true;
}
/** .rpp を開く: 16色アナログ。大きさが正方4種類のどれかと同じならそのモード、違えば全体が入るいちばん小さい正方モードに左上詰め
    （640×800 より大きい分は切り取る）。線画はない。大きさが違ったときはお知らせの文を返す */
function applyRpp(d){
  const fit=rppTargetRes(d.w,d.h);
  configure(fit.res,PaletteMode.Analog16);
  colors.palette=d.palette.map(c=>c.slice());
  const W=engine.w, H=engine.h, cw=Math.min(W,d.w), ch=Math.min(H,d.h);
  for(let s=0;s<2;s++){
    const sc=engine.screens[s], src=d.screens[s];
    sc.pix.fill(App.bgColorIndex); sc.line.fill(0); sc.touched=!!src;
    if(!src)continue;
    for(let y=0;y<ch;y++)sc.pix.set(src.subarray(y*d.w,y*d.w+cw),y*W);
  }
  engine.showScreen(0);
  if(fit.exact)return null;
  const r=RES[fit.res];
  return (fit.crop?t("この .rpp は {w}×{h} です。640×800（正方ピクセル）で開き、はみ出た分は切り取りました。")
    :t("この .rpp は {w}×{h} です。全体が入る {rw}×{rh}（正方ピクセル）で開き、左上に置きました。"))
    .replace("{w}",d.w).replace("{h}",d.h).replace("{rw}",r.w).replace("{rh}",r.h);
}

/* ---------- 画像の減色 ---------- */
const _quantCache=[];
/** 減色の候補（今のパレット・ディザの形・方法ごとに作る。答えも覚えておく） */
function getQuantizer(dither){
  const key=JSON.stringify([colors.palette.slice(0,colors.count),engine.dither.spec.key,!!dither]);
  let e=_quantCache.find(c=>c.key===key);
  if(!e){
    e={key,q:makeQuantizer(colors.palette,colors.count,engine.dither.spec,!!dither)};
    _quantCache.unshift(e);
    if(_quantCache.length>4)_quantCache.length=4;
  }
  return e.q;
}
/** 画像を、今の絵の大きさの RGBA（論理のドット）にする。画像のない所は透明のまま（減色で背景色になる。明るさ・コントラストが余白に掛からない）
    拡大・縮小しないとき: 縦長ドットは1行おき（2行目）を取る（スキャンラインで書き出した PNG の黒い行を避ける）。拡大・縮小するときは縦も半分にする */
function imageToRgba(img,fit,center){
  const W=engine.w, H=engine.h, ay=engine.aspectY, dispH=H*ay;
  const pl=imagePlacement(img.naturalWidth||img.width,img.naturalHeight||img.height,W,dispH,ay,fit,center);
  const c=document.createElement("canvas");
  c.width=W; c.height=pl.scaled?H:dispH;
  const x=c.getContext("2d",{willReadFrequently:true});
  if(pl.scaled){
    x.imageSmoothingEnabled=true;
    if("imageSmoothingQuality" in x)x.imageSmoothingQuality="high";
    x.drawImage(img,pl.ox,pl.oy/ay,pl.pw,pl.ph/ay);
    return x.getImageData(0,0,W,H).data;
  }
  x.imageSmoothingEnabled=false;
  x.drawImage(img,pl.ox,pl.oy);
  const d=x.getImageData(0,0,W,dispH).data;
  if(ay===1)return d;
  const out=new Uint8ClampedArray(W*H*4);
  for(let y=0;y<H;y++)out.set(d.subarray((2*y+1)*W*4,(2*y+2)*W*4),y*W*4);
  return out;
}
/** RGBA（論理のドット）に明るさ・コントラストの補正を当ててから、今のパレットに減色して色番号にする */
function rgbaToIndices(rgba,dither,bright,contrast){
  const lut=toneLut(bright,contrast);
  return quantizeRgba(lut?applyToneLut(rgba,lut):rgba,engine.w,engine.h,getQuantizer(dither),App.bgColorIndex);
}
/** 画像を今のパレットに減色して、今の絵の1画面分の色番号にする（bright・contrast は -100〜100、省略は 0） */
function imageToIndices(img,fit,center,dither,bright,contrast){
  return rgbaToIndices(imageToRgba(img,fit,center),dither,bright,contrast);
}

/* ---------- インポート（別のファイルの画面や画像を、今の絵の表画面か裏画面へ） ---------- */
const ImportDlg={active:null};
function imageTypeLabel(f){
  const m=(f.type||"").toLowerCase(), n=f.name.toLowerCase();
  if(m.includes("png")||n.endsWith(".png"))return "PNG";
  if(m.includes("jpeg")||/\.jpe?g$/.test(n))return "JPEG";
  if(m.includes("gif")||n.endsWith(".gif"))return "GIF";
  if(m.includes("bmp")||n.endsWith(".bmp"))return "BMP";
  if(m.includes("webp")||n.endsWith(".webp"))return "WebP";
  return t("画像");
}
/** 見出しの区切り（日本語は「・」、英語は「 · 」） */
function infoSep(){ return App.lang==="en"?" · ":"・"; }
/** インポートで読み込む元（中身から見分ける）。専用ファイルは screens[s]={pix,line(無ければnull),lineColor}（無い画面は null）。読めなければ null */
async function readImportSource(f){
  const ab=await f.arrayBuffer(), name=f.name;
  if(isRpi(ab)){
    const d=decodeRpi(ab); if(!d)return null;
    const r=RES[d.res];
    return {kind:"rpi",name,w:d.w,h:d.h,aspectY:r.aspectY,palette:d.palette,screen:d.screen,
      info:"RPI"+infoSep()+d.w+"×"+d.h+" "+t(r.aspectY===2?"縦長":"正方")+infoSep()+t(COLOR_MODE_LABELS[d.color]),
      screens:d.screens.map((s,i)=>({pix:s.pix,line:s.line,lineColor:d.lineColor[i]}))};
  }
  if(isRp8(ab)){
    const d=parseRp8(ab); if(!d)return null;
    return {kind:"rp8",name,w:d.w,h:d.h,aspectY:2,palette:d.palette,screen:0,
      info:d.magic+infoSep()+d.w+"×"+d.h+" "+t("縦長")+infoSep()+t(COLOR_MODE_LABELS[d.palMode]),
      screens:[{pix:d.pix,line:d.line,lineColor:d.lineColor},null]};
  }
  if(isRpp(ab)){
    const d=decodeRpp(ab); if(!d)return null;
    return {kind:"rpp",name,w:d.w,h:d.h,aspectY:1,palette:d.palette,screen:0,
      info:d.magic+infoSep()+d.w+"×"+d.h,
      screens:d.screens.map(p=>p?{pix:p,line:null,lineColor:0}:null)};
  }
  if(/\.(rpi|rp8|rpp)$/i.test(name))return null;
  const img=await loadImageFile(f);
  if(!img)return null;
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  return {kind:"image",name,img,w,h,info:imageTypeLabel(f)+infoSep()+w+"×"+h};
}
/** ファイル→インポート…で選んだファイル。ダイアログを開いているとき（別のファイル…）は、読み込む元だけを替える */
async function importFile(f){
  endPolyline();
  const src=await readImportSource(f);
  if(!src){ await Modal.alert(t("このファイルはインポートできません（.rpi・.rp8・.rpp と、PNG・JPEG などの画像を読み込めます）。")); return false; }
  if(ImportDlg.active){ ImportDlg.active.setSource(src); return true; }
  return await importDialog(src);
}
/** 読み込む元の小さな見本（48×30に収める） */
function paintImportThumb(cv,src){
  const ay=src.aspectY||1, dispW=src.w, dispH=src.h*ay;
  const sc=Math.min(48/dispW,30/dispH), w=Math.max(1,Math.round(dispW*sc)), h=Math.max(1,Math.round(dispH*sc));
  cv.width=w; cv.height=h;
  const x=cv.getContext("2d");
  x.imageSmoothingEnabled=true;
  if(src.kind==="image"){ x.drawImage(src.img,0,0,w,h); return; }
  const s=src.screens[src.screen]||src.screens[0];
  const full=document.createElement("canvas"); full.width=dispW; full.height=dispH;
  const fx=full.getContext("2d"), im=fx.createImageData(dispW,dispH), b32=new Uint32Array(im.data.buffer);
  const pal=src.palette.map(c=>(0xFF000000|(c[2]<<16)|(c[1]<<8)|c[0])>>>0), black=0xFF000000>>>0;
  const lc=pal[s.lineColor]||black;
  for(let y=0;y<dispH;y++){
    const so=Math.floor(y/ay)*src.w;
    for(let i=0;i<dispW;i++)b32[y*dispW+i]=(s.line&&s.line[so+i])?lc:(pal[s.pix[so+i]]||black);
  }
  fx.putImageData(im,0,0);
  x.drawImage(full,0,0,w,h);
}
/** インポートダイアログ: 読み込む元・読み込み先・大きさ・位置・ドットの形と色（専用ファイル）／減色と明るさ・コントラスト（画像）を選び、
    プレビューを見て読み込む */
async function importDialog(src0){
  const st={to:engine.screen};
  const body=el("div",{class:"impdlg"});
  const pv=el("canvas",{class:"imp-pv",role:"img","aria-label":t("読み込んだ結果のプレビュー")});
  // スライダーを動かしている間のプレビューは、1フレームに1回だけ描き直す
  let raf=0;
  const later=()=>{ if(!raf)raf=requestAnimationFrame(()=>{ raf=0; update(); }); };
  const now=()=>{ if(raf){ cancelAnimationFrame(raf); raf=0; } update(); };
  // 線画も読み込むか（専用ファイルで、読み込む元の画面に線画レイヤーがあるとき）
  const withLine=()=>{ const s=st.src; if(s.kind==="image")return false; const sc=s.screens[st.from]; return !!(st.withLine&&sc&&sc.line); };
  function defaults(){
    const s=st.src, img=s.kind==="image";
    st.from=(s.screens&&s.screens[s.screen])?s.screen:0;
    st.fit=img?1:0; st.center=img; st.shape=true; st.dither=true; st.nearest=false; st.withLine=false;
    st.bright=0; st.contrast=0;   // 明るさ・コントラスト（画像だけ。別のファイルに替えたら 0 から）
    if(!img){
      // パレットが同じなら色番号のまま、違えば近い色（使っている色と、線画があればその線色で比べる）
      const used=new Uint8Array(16);
      for(const sc of s.screens){
        if(!sc)continue;
        for(let i=0;i<sc.pix.length;i++){ const v=sc.pix[i]; if(v>=0&&v<16)used[v]=1; }
        if(sc.line&&sc.line.some(v=>v))used[sc.lineColor]=1;
      }
      st.nearest=!samePaletteFor(s.palette,colors.palette,colors.count,used);
      const cur=s.screens[st.from];
      st.withLine=!!(cur&&cur.line&&cur.line.some(v=>v));
      st.high=s.palette.length>colors.count&&used.slice(colors.count).some(v=>v);
    }
    st._key=null;
  }
  function compute(){
    const s=st.src, line=withLine(), img=s.kind==="image";
    const key=[st.from,line,st.fit,st.center,st.shape,st.nearest,st.dither,img?st.bright:0,img?st.contrast:0].join();
    if(st._key===key&&st._src===s)return st._res;
    let res;
    if(img){
      // 置いた画像（RGBA）は大きさと位置が同じなら使い回す（明るさ・コントラストを動かしている間は、補正と減色だけやり直す）
      const pk=[st.fit,st.center].join();

      res={pix:rgbaToIndices(st._rgba,st.dither,st.bright,st.contrast),line:null,lineColor:null};
    }
    else{
      const sc=s.screens[st.from];
      res=importIndexed({w:s.w,h:s.h,aspectY:s.aspectY,pix:sc.pix,line:sc.line,palette:s.palette,lineColor:sc.lineColor},
        {w:engine.w,h:engine.h,aspectY:engine.aspectY,palette:colors.palette,count:colors.count,bg:App.bgColorIndex},
        {fit:st.fit,center:st.center,matchShape:st.shape,nearest:st.nearest,withLine:line});

    st._key=key; st._src=s; st._res=res;
    return res;
  }
  function drawPreview(){
    const r=compute(), W=engine.w, H=engine.h, dispH=engine.displayH, tsc=engine.screens[st.to], line=withLine();

    DrawingEngine.prototype.renderTo.call({colors,w:W,h:H,aspectY:engine.aspectY,currentDotMode:engine.currentDotMode,
      pixels:r.pix,linePixels:line?r.line:tsc.line,lineLayerColor:line?r.lineColor:tsc.lineColor,lineLayerVisible:tsc.lineVisible},
      new Uint32Array(im.data.buffer));
    fx.putImageData(im,0,0);

  function update(){

        :"正方ピクセルの絵を縦長ドットの絵へ読み込む。「見た目を合わせる」は1行おきに取り込む。"));
      if(s.kind==="rpp"&&!s.screens[1])notes.push(t("RPP1・RPP2 のファイルには表画面しかない。"));
      if(st.high)notes.push(t("今のカラーモードにない色番号（8〜15番）は、近い色に置き換える。"));
    }
    st.note.textContent=notes.join("");
    st.note.style.display=notes.length?"":"none";
    const msg=line?(st.to?"裏画面の通常レイヤーと線画レイヤーが置き換わります。元に戻すで戻せます":"表画面の通常レイヤーと線画レイヤーが置き換わります。元に戻すで戻せます")
      :(st.to?"裏画面の通常レイヤーが置き換わります。裏画面の線画はそのまま残ります。元に戻すで戻せます":"表画面の通常レイヤーが置き換わります。表画面の線画はそのまま残ります。元に戻すで戻せます");
    st.warn.replaceChildren(icon("warn",16),el("span",{text:t(msg)}));

    paintImportThumb(thumb,s);
    const other=el("button",{class:"btn",type:"button",text:t("別のファイル…"),onclick:()=>$("fileImport").click()});

    // 明るさ・コントラスト: スライダーと数値（-100〜100）

    }else{
      if(s.aspectY!==engine.aspectY)row(t("ドットの形"),seg([[false,t("そのまま")],[true,t("見た目を合わせる")]],"shape",t("ドットの形")));
      row(t("色"),seg([[false,t("色番号のまま")],[true,t("近い色に置き換える")]],"nearest",t("色")));

}
/** インポートの結果を読み込み先の画面へ入れる（マスクに関係なく画面全体）。元に戻す履歴には読み込み先の通常レイヤー
    （線画も読み込むときは線画レイヤーと線色も）を記録する。表示していない画面へ読み込んだら、その画面を表示する */
function applyImport(res,to,withLine){
  endPolyline();
  engine.pushUndo(withLine?[to*2,to*2+1]:[to*2],withLine?[to]:null);
  const sc=engine.screens[to];
  sc.pix.set(res.pix);
  if(withLine){ sc.line.set(res.line); sc.lineColor=res.lineColor; }

/* ---------- 正方ピクセルに変換 ---------- */
/** 設定→正方ピクセルに変換…: 640×200（縦長ドット）→640×400、640×400（縦長ドット）→640×800。各行を2行に複製するので見た目は変わらない。
    ディザとタイルは4×4に。描画色は混合比率を2倍（位相はそのまま）、選択中のタイルは各行を2回ずつ並べた4×4に。
    タイル保存欄と擬似透過は正方用に切り替わる。元に戻す履歴の対象外で、実行前に確かめる（履歴はリセット） */
async function convertToSquareDialog(){
  if(engine.aspectY!==2)return false;
  const from=engine.res, to=RES.find(r=>r.aspectY===1&&r.w===from.w&&r.h===from.h*2);
  if(!to)return false;
  const msg=t("{a}（縦長ドット）を {b}（正方ピクセル）に変換します。各行を2行に複製するので、見た目は変わりません。ディザとタイルは4×4になり、タイル保存欄と擬似透過は正方ピクセル用に切り替わります。この変換は元に戻せず、元に戻す履歴もリセットされます。変換しますか？")
    .replace("{a}",from.w+"×"+from.h).replace("{b}",to.w+"×"+to.h);
  if(!await Modal.confirm(msg,t("正方ピクセルに変換")))return false;
  convertToSquare();
  return true;
}
function convertToSquare(){
  if(engine.aspectY!==2)return false;
  const from=engine.res, to=RES.find(r=>r.aspectY===1&&r.w===from.w&&r.h===from.h*2);
  endPolyline();
  const sl=container.scrollLeft, stp=container.scrollTop;
  const oldD=engine.dither.spec;
  const tileOn=App.isTileActive&&engine.currentTile!==null;
  const lt=App.lastTile?tileDoubleRows(App.lastTile):null;
  engine.convertToSquare(to);
  gradPalette.configure(to.dither); gridPalette.configure(to.dither);
  switchTiling(oldD);   // 保存欄・擬似透過・直前のタイルは正方用に。描画色の混合比率は2倍、位相はそのまま
  if(lt){
    // 選択中のタイル（直前のタイル）は各行を2回ずつ並べた4×4に。タイルの位相は縦のずれが同じになるように（縦長の1行 = 正方の2行）
    App.lastTile=lt;
    if(tileOn){
      App.isTileActive=true; engine.currentTile=lt;
      const p=App.selectedPattern.phase||0;
      App.selectedPattern.phase=(p&3)|(((p>>2)&1)<<3);
      patternChanged();
    }
  }
  validateActiveTile();
  allocOffscreen();
  App.dirty=true;
  afterModeChange(false);
  if(UI.refs.selPhase)UI.refs.selPhase.value=String(App.selectedPattern.phase||0);
  container.scrollLeft=sl; container.scrollTop=stp;   // 表示の大きさは同じなので、見ている位置もそのまま
  UI.updateStatusBar(); UI.syncOptionBar(); UI.updatePaletteDisplay();
  refreshCanvas();
  markSettings();
  toast(t("正方ピクセルに変換しました（{w}×{h}）").replace("{w}",to.w).replace("{h}",to.h));
  return true;
}

/* ---------- 縦長ドットに変換（段階6の追加: 正方ピクセル→縦長ドット） ---------- */
/** 変換先の縦長ドットのモード（幅が同じで高さが半分: 640×400→640×200、640×800→640×400）。無ければ null（幅320のモードなど） */
function tallResFor(res){ return res&&res.aspectY===1?(RES.find(r=>r.aspectY===2&&r.w===res.w&&r.h*2===res.h)||null):null; }
/** 設定→縦長ドットに変換…: 1行おきに取り出す。通常レイヤーは偶数の行（Y=0,2,4…）か奇数の行（Y=1,3,5…）、
    線画レイヤーは同じ行か「2行を重ねる」（上下どちらかの行に線があれば線にする＝描いた所を優先）。
    表示中の画面のプレビューつき。元に戻す履歴の対象外で、履歴はリセットされる（正方ピクセルに変換と同じ） */
async function convertToTallDialog(){
  const from=engine.res, to=tallResFor(from);
  if(!to)return false;
  const st=App.toTall||(App.toTall={row:0,lineOr:false});   // 前回の選択（ページを開いている間だけ覚える）
  const body=el("div",{class:"impdlg ctdlg"});
  const pv=el("canvas",{class:"imp-pv",role:"img","aria-label":t("変換した結果のプレビュー")});
  const cap=el("span",{class:"imp-cap"});
  const segs=[];
  const seg=(opts,key,label)=>{ const g=segControl(opts,()=>st[key],(v)=>{ st[key]=v; update(); },label); segs.push(g); return g; };
  const grid=el("div",{class:"imp-opts"});
  const row=(label,c)=>grid.append(el("span",{class:"nd-lbl",text:label}),el("span",{class:"nd-row"},c));
  row(t("通常レイヤー"),seg([[0,t("偶数の行")],[1,t("奇数の行")]],"row",t("通常レイヤー")));
  row(t("線画レイヤー"),seg([[false,t("同じ行")],[true,t("2行を重ねる")]],"lineOr",t("線画レイヤー")));
  function drawPreview(){
    const W=to.w, H=to.h, dispH=H*2, sc=engine.screens[engine.screen];
    const pix=DrawingEngine.halveRows(sc.pix,W,from.h,st.row,false), line=DrawingEngine.halveRows(sc.line,W,from.h,st.row,st.lineOr);
    const full=document.createElement("canvas"); full.width=W; full.height=dispH;
    const fx=full.getContext("2d"), im=fx.createImageData(W,dispH);
    // 変換したあとの表示中の画面（縦長ドットの表示・通常レイヤーの表示と下地の色も今のまま）
    DrawingEngine.prototype.renderTo.call({colors,w:W,h:H,aspectY:2,currentDotMode:engine.currentDotMode,pixels:pix,linePixels:line,
      lineLayerColor:sc.lineColor,lineLayerVisible:sc.lineVisible,normalLayerVisible:sc.pixVisible!==false,baseColor:engine.baseColor},
      new Uint32Array(im.data.buffer));
    fx.putImageData(im,0,0);
    const k=Math.min(1,320/W,200/dispH), pw=Math.max(1,Math.round(W*k)), ph=Math.max(1,Math.round(dispH*k));
    pv.width=pw; pv.height=ph;
    const px=pv.getContext("2d");
    px.imageSmoothingEnabled=k<1;
    px.drawImage(full,0,0,pw,ph);
    cap.textContent=(k<1?t("プレビュー（表示中の画面・{w}×{h}の表示を1/{n}に縮小）"):t("プレビュー（表示中の画面・{w}×{h}の表示・等倍）"))
      .replace("{w}",W).replace("{h}",dispH).replace("{n}",Math.round(1/k));
  }
  function update(){ for(const s of segs)s._sync(); drawPreview(); }
  body.append(
    el("p",{class:"ct-lead",text:t("{a}（正方ピクセル）を {b}（縦長ドット）に変換します。1行おきに取り出すので、縦のドット数は半分になります。")
      .replace("{a}",from.w+"×"+from.h).replace("{b}",to.w+"×"+to.h)}),
    el("div",{class:"imp-main"},el("div",{class:"imp-pvbox"},pv,cap),grid),
    el("p",{class:"dlg-note",text:t("偶数の行は Y が 0・2・4…、奇数の行は Y が 1・3・5… の行です（Y はステータスバーの座標）。「2行を重ねる」は、上下どちらかの行に線があれば線にします（描いた所を優先）。ディザとタイルは4×2になり、タイル保存欄と擬似透過は縦長ドット用に切り替わります。")}),
    el("div",{class:"nd-warn",role:"note"},icon("warn",16),el("span",{text:t("この変換は元に戻せず、元に戻す履歴もリセットされます。")})));
  update();
  const ok=await Modal.open(t("縦長ドットに変換"),body,[{label:t("キャンセル"),value:false},{label:t("変換"),value:true,primary:true}]);
  if(!ok)return false;
  convertToTall(st.row,st.lineOr);
  return true;
}
/** 正方ピクセル→縦長ドット。row 0=偶数の行・1=奇数の行、lineOr なら線画は2行を重ねる。
    ディザとタイルは4×2に。描画色の混合比率は半分（段数の比。混ざっていた色は混ざったまま）。
    選択中のタイル（直前のタイル）は、取り出す行に出ていた2行を並べた4×2にし、縦の位相も合わせる（変換の前に描いた模様と同じ行が出る） */
function convertToTall(row,lineOr){
  const from=engine.res, to=tallResFor(from);
  if(!to)return false;
  endPolyline();
  const sl=container.scrollLeft, stp=container.scrollTop;
  const oldD=engine.dither.spec;
  const tileOn=App.isTileActive&&engine.currentTile!==null;
  const k=row?1:0, ph=App.selectedPattern.phase||0;
  // 正方の行 Y に出るタイルの行は (Y+縦の位相)%4。縦長の行 y は正方の行 2y+k なので、q=k+縦の位相 とすると
  // 出る行は 2×((y+(q>>1))%2)+(q&1)。→ タイルの行 q&1 と q&1+2 を並べ、縦長の縦の位相を (q>>1)&1 にする
  const q=k+((ph>>2)&3);
  const lt=App.lastTile&&App.lastTile.rows===4?tileHalveRows(App.lastTile,tileOn?(q&1):k):null;
  engine.convertToTall(to,k,!!lineOr);
  gradPalette.configure(to.dither); gridPalette.configure(to.dither);
  switchTiling(oldD);   // 保存欄・擬似透過・直前のタイルは縦長用に。描画色の混合比率は半分、位相は段数で割った余り
  if(lt){
    App.lastTile=lt;
    if(tileOn){
      App.isTileActive=true; engine.currentTile=lt;
      App.selectedPattern.phase=(ph&3)|(((q>>1)&1)<<2);
      patternChanged();
    }
  }
  validateActiveTile();
  allocOffscreen();
  App.dirty=true;
  afterModeChange(false);
  if(UI.refs.selPhase)UI.refs.selPhase.value=String(App.selectedPattern.phase||0);
  container.scrollLeft=sl; container.scrollTop=stp;   // 表示の大きさは同じなので、見ている位置もそのまま
  UI.updateStatusBar(); UI.syncOptionBar(); UI.updatePaletteDisplay();
  refreshCanvas();
  markSettings();
  toast(t("縦長ドットに変換しました（{w}×{h}）").replace("{w}",to.w).replace("{h}",to.h));
  return true;
}

/* ---------- 幅640に拡大（段階6の追加: 幅320のモード → 幅640のモード） ---------- */
/** 拡大先のモード。tall なら縦長ドット（同じ行数: 320×200→640×200、320×400→640×400）、でなければ正方ピクセル（縦も2倍: 320×200→640×400、320×400→640×800）。
    幅320の正方ピクセルのときだけ。無ければ null */
function enlargeRes(tall,res=engine.res){
  if(!res||res.w!==320||res.aspectY!==1)return null;
  return RES.find(r=>r.w===640&&(tall?(r.aspectY===2&&r.h===res.h):(r.aspectY===1&&r.h===res.h*2)))||null;
}
/** 設定→幅640に拡大…: 変換先（縦長ドット・正方ピクセル）を選ぶ。どちらも1ドットを並べて増やすだけなので、見た目は変わらない */
async function enlargeDialog(){
  const from=engine.res, rt=enlargeRes(true), rs=enlargeRes(false);
  if(!rt||!rs)return false;
  const st=App.enlarge||(App.enlarge={tall:true});   // 前回の選択（ページを開いている間だけ覚える）
  const card=(tall)=>{
    const r=tall?rt:rs;
    const b=el("button",{class:"nd-card",type:"button",role:"radio","aria-checked":"false","aria-label":r.w+"×"+r.h+" "+t(tall?"縦長ドット":"正方ピクセル")},

  };

  }
  const body=el("div",{class:"enldlg"},
    el("p",{class:"ct-lead",text:t("{a}（正方ピクセル）を幅640に拡大します。1ドットを並べて増やすので、見た目は変わりません。").replace("{a}",from.w+"×"+from.h)}),
    el("div",{class:"enl-cards",role:"radiogroup","aria-label":t("変換先")},...cards),
    note,
    el("div",{class:"nd-warn",role:"note"},icon("warn",16),el("span",{text:t("この変換は元に戻せず、元に戻す履歴もリセットされます。")})));
  sync();
  const ok=await Modal.open(t("幅640に拡大"),body,[{label:t("キャンセル"),value:false},{label:t("幅640に|拡大"),value:true,primary:true}]);
  if(!ok)return false;
  enlargeTo640(st.tall);

}
/** 幅320 → 幅640 に拡大する。画面での大きさと見ている所はそのまま（倍率を半分にする）。
    縦長ドットにするときは、ディザとタイルを4×2に（描画色の混合比率は半分。選択中のタイルは縦長ドットへの変換と同じく1行おきに取り出した4×2に） */
function enlargeTo640(tall){
  const to=enlargeRes(tall);
  if(!to)return false;
  endPolyline();
  const a=viewCenterAnchor(), z0=App.zoom;
  const oldD=engine.dither.spec;
  const tileOn=App.isTileActive&&engine.currentTile!==null;
  const ph=App.selectedPattern.phase||0, q=(ph>>2)&3;
  const lt=tall&&App.lastTile&&App.lastTile.rows===4?tileHalveRows(App.lastTile,tileOn?(q&1):0):null;
  engine.enlargeTo(to);
  gradPalette.configure(to.dither); gridPalette.configure(to.dither);
  switchTiling(oldD);   // 縦長ドットにするときだけ変わる（保存欄・擬似透過・直前のタイル・混合比率）
  if(lt){
    App.lastTile=lt;
    if(tileOn){
      App.isTileActive=true; engine.currentTile=lt;
      App.selectedPattern.phase=(ph&3)|(((q>>1)&1)<<2);
      patternChanged();
    }
  }
  validateActiveTile();
  allocOffscreen();
  App.dirty=true;
  afterModeChange(true);
  // 表示は縦横とも2倍になるので、倍率を半分にして、画面の真ん中に見えていた所を真ん中のままにする
  App.zoom=normalizeZoom(z0/2);
  updateSpacer();
  container.scrollLeft=Math.max(0,a.x*2*App.zoom+padX-a.vx);
  container.scrollTop=Math.max(0,a.y*2*App.zoom+padY-a.vy);
  onZoomChanged();
  if(UI.refs.selPhase)UI.refs.selPhase.value=String(App.selectedPattern.phase||0);
  UI.updateStatusBar(); UI.syncOptionBar(); UI.updatePaletteDisplay();
  refreshCanvas();
  markSettings();
  toast(t("幅640に拡大しました（{w}×{h}・{k}）").replace("{w}",to.w).replace("{h}",to.h).replace("{k}",t(tall?"縦長ドット":"正方ピクセル")));
  return true;
}

function buildMenus(){
  const bar=$("menubar");
  bar.querySelectorAll(".menu-root").forEach(e=>e.remove());
  const menus=menuDefs();
  for(const m of menus){
    const root=el("div",{class:"menu-root"});
    const btn=el("button",{class:"menu-btn",text:m.label});
    const drop=el("div",{class:"menu-drop"});
    for(const it of m.items){
      if(it.sep){ drop.append(el("div",{class:"menu-sep"})); continue; }
      const item=el("div",{class:"menu-item"},
        el("span",{text:it.label}),
        it.sc?el("span",{class:"sc",text:it.sc}):null);
      item._def=it;
      item.addEventListener("click",()=>{ closeAllMenus(); it.action(); });
      drop.append(item);
    }
    root.append(btn,drop);
    btn.addEventListener("click",ev=>{
      ev.stopPropagation();
      const wasOpen=root.classList.contains("open");
      closeAllMenus();
      if(!wasOpen){ refreshMenuStates(root); root.classList.add("open"); positionDrop(root); }
    });
    btn.addEventListener("pointerenter",()=>{
      const anyOpen=document.querySelector(".menu-root.open");
      if(anyOpen&&anyOpen!==root){
        closeAllMenus(); refreshMenuStates(root); root.classList.add("open"); positionDrop(root);
      }
    });
    bar.append(root);
  }
  if(!buildMenus._wired){
    buildMenus._wired=true;
    document.addEventListener("pointerdown",ev=>{
      const tg=ev.target;
      if(!(tg&&tg.closest&&tg.closest(".menu-root")))closeAllMenus();
    });
  }
}
function closeAllMenus(){
  document.querySelectorAll(".menu-root.open").forEach(r=>r.classList.remove("open"));
}
function positionDrop(root){
  const drop=root.querySelector(".menu-drop");
  if(!drop)return;
  drop.style.left=""; drop.style.right=""; drop.style.top="";
  if(getComputedStyle(drop).position==="fixed"){
    // 狭幅レイアウト: menubarがスクロールコンテナのため、fixedでクリップ外に表示
    const br=root.getBoundingClientRect();
    drop.style.top=br.bottom+"px";
    let left=br.left;
    const dw=drop.getBoundingClientRect().width;
    if(dw>0&&left+dw>window.innerWidth-4)left=Math.max(4,window.innerWidth-4-dw);
    drop.style.left=left+"px";
    return;
  }
  const r=drop.getBoundingClientRect();
  if(r.width>0&&r.right>window.innerWidth-4){
    drop.style.left="auto"; drop.style.right="0";
  }
}
function refreshMenuStates(root){
  root.querySelectorAll(".menu-item").forEach(item=>{
    const def=item._def;
    if(!def)return;
    item.classList.toggle("checked",!!(def.checked&&def.checked()));
    item.classList.toggle("disabled",!!(def.disabled&&def.disabled()));
  });
}

<h2 id="m-modes">解像度モードとカラーモード</h2>
<p>新規作成で、解像度モードとカラーモードを別々に選びます。解像度モードが決めるのは1ドットの形と、ディザ・タイルの形だけで、ほかの機能はどの組み合わせでも同じです。</p>

<tr><th>ツール（キー）</th><th>使い方</th></tr>
<tr><td>ペン（<kbd>B</kbd>）</td><td>ドラッグで描きます。サイズ（1〜32）・擬似透過・筆圧を使えます。</td></tr>
<tr><td>消しゴム（<kbd>E</kbd>）</td><td>通常レイヤーは背景色で塗り、線画レイヤーは線を消します。サイズはペンとは別に持ちます。</td></tr>
<tr><td>直線（<kbd>L</kbd>）</td><td>ドラッグで直線を引きます。オプションの「連続線」をONにするか、<kbd>Shift</kbd>+クリックで、折れ線をつなげて描けます（<kbd>Shift</kbd>を離すか右クリックで終わり）。</td></tr>
<tr><td>矩形（<kbd>R</kbd>）・楕円（<kbd>O</kbd>）</td><td>ドラッグで描きます。オプションで「枠線」か「塗り」を選び、枠線の太さも変えられます。<kbd>Shift</kbd>を押しながらで正方形・正円、<kbd>Ctrl</kbd>を押しながらで始点を中心にして描きます（両方を押すと、中心から正方形・正円。ドラッグの途中で押しても離しても変わります）。縦長ドットでは、画面で見た形が正方形・正円になります。スマホ・タブレットでは、オプション帯のボタンでも同じことができます（<a href="#m-touch">タッチ操作</a>）。</td></tr>
<tr><td>塗潰し（<kbd>G</kbd>）</td><td>押した所と同じ色の範囲を塗ります。オプションで、線画を境界にできます（「線画のみ境界」は色の違いを無視して、線画で囲んだ所を塗ります）。</td></tr>
<tr><td>グラデ塗（<kbd>Shift</kbd>+<kbd>G</kbd>）</td><td>ドラッグした向きと長さで、パターンのパネルのグラデーションを全体に塗ります。</td></tr>
<tr><td>スポイト（<kbd>I</kbd>）</td><td>押した所の色を描画色にします。どのツールでも、右クリック（タッチは長押し）で同じことができます。</td></tr>
<tr><td>全体移動（<kbd>V</kbd>）</td><td>ドラッグで絵全体をずらします。はみ出た分は反対側へ回り込みます。表画面と裏画面をいっしょに動かすかを選べ、「数値で移動…」もあります。</td></tr>
</table>
<p class="note">※ 擬似透過が効くのはペンと塗潰し、筆圧でサイズが変わるのはペンと消しゴムです。消しゴムの色（背景色）は、設定→背景色設定… で変えられます。</p>

<h2 id="m-color">色とパターン</h2>
<h3>カラーのパネル</h3>
<ul>
<li><b>パレット</b>: クリックで描画色にします。ダブルクリックで色を編集します（8色アナログは512色、16色アナログは4096色から）。右クリックでマスクを切り替えます（×印の色の所には描けません）。</li>
<li><b>マスク切替</b>のボタンを押している間は、パレットのクリックがマスクの切り替えになります。全mask・全解除・反転もあります。</li>
<li><b>透明</b>: 通常レイヤーには何も描かず、線画レイヤーでは線を消します。</li>
<li><b>tile</b>: 直前に使ったタイルです。押すと、そのタイルで描きます。</li>
</ul>
<h3>パターンのパネル</h3>
<ul>
<li><b>グラデ</b>: 2〜4色の間を、縦長ドットは9段、正方ピクセルは17段のディザでつなぎます。色のボタンで各色（透明も選べます）を決め、帯を押すと、その段の混ぜ方が描画色になります。</li>
<li><b>グリッド</b>: 四隅の色から、混ぜ方の違うタイルを16×16個並べます。押したタイルで描けます。</li>
<li><b>タイル</b>: 64個の保存欄です。クリックで読み込み、右クリックで今のタイルを保存します（タッチは長押し）。セット保存・セット読込（.tls）・全消去があります。縦長ドット用（4×2）と正方ピクセル用（4×4）は別々に保存されます。</li>
<li>下の欄の<b>位相</b>で、ディザとタイルの模様をずらせます。<b>一筆ごとにずらす</b>をONにすると、一筆ごとに位相が1つ進みます。</li>
</ul>
<h3>擬似透過</h3>
<p>ペンと塗潰しのオプションです。描画色を透明と混ぜたディザで描くので、下の絵を残しながら塗れます（0で使いません）。</p>

<h2 id="m-layers">表画面・裏画面とレイヤー</h2>
<p>絵は表画面と裏画面の2画面です。どちらにも通常レイヤー（色）と線画レイヤー（1色の線）があり、線画は通常レイヤーの上に表示されます。</p>
<ul>
<li>レイヤーのパネルの見出し（表画面・裏画面）を押すと、その画面を表示します。描くのは表示中の画面です。</li>
<li>行（線画レイヤー・通常レイヤー）を押すと、そのレイヤーが<b>描画先</b>になります。</li>
<li><b>目のボタン</b>で表示・非表示を切り替えます。通常レイヤーを隠すと、下地の色（白・灰色・黒）の上に線画だけが見えます。下地のボタンを押すたびに色が変わります。隠しても絵は変わらず、隠したレイヤーに描き始めると1回だけ知らせます。</li>
<li>線画レイヤーの<b>線色</b>は画面ごとに1色で、あとから変えられます。</li>
<li><b>もう一方の画面から描く</b>: ペンなどで描いた所に、もう一方の画面の同じ位置の色を写します。「線画も含める」（通常レイヤーへ描くとき、相手の線画の所は線色で写す）と「透明も上書き」（線画レイヤーへ描くとき、相手の線画の透明な所でこちらの線画を消す）は、描画先に合う方が使えます。</li>
<li><b>表→裏</b>・<b>裏→表</b>で画面を丸ごと写し、<b>線画クリア</b>で表示中の画面の線画を消します。</li>
<li>元に戻すはレイヤーごとに記録するので、画面を切り替えても戻せます（最大50回・合計64MBまで）。</li>
</ul>

<h2 id="m-file">ファイル</h2>
<table>
<tr><th>メニュー</th><th>内容</th></tr>
<tr><td>新規作成…</td><td>解像度モード・カラーモード・縦長ドットの表示・背景色を選んで、新しい絵を作ります。</td></tr>
<tr><td>開く…（<kbd>Ctrl</kbd>+<kbd>O</kbd>）</td><td>.rpi・.rp8・.rpp と、PNG・JPEG などの画像を開きます。形式はファイルの中身で見分けます。</td></tr>
<tr><td>インポート…</td><td>別のファイルの画面や画像を、今の絵の表画面か裏画面へ読み込みます（<a href="#m-import">インポート</a>）。</td></tr>
<tr><td>保存…（<kbd>Ctrl</kbd>+<kbd>S</kbd>）</td><td>このアプリの形式 .rpi で保存します。モード・両方の画面と線画・パレット・線色などを全部残します。</td></tr>
<tr><td>互換形式で書き出し(.rp8)…</td><td>8色版の形式です。640×200 縦長・8色のときだけ使えます。表示中の画面とその線画を書き出します。</td></tr>
<tr><td>互換形式で書き出し(.rpp)…</td><td>16色版の形式（RPP3）です。正方ピクセルのときだけ使えます。表画面と裏画面を書き出し、線画は画面ごとに「焼き込む」か「捨てる」を選びます。8色の絵は、パレットの9〜16番を黒で埋めます。</td></tr>
<tr><td>PNG出力</td><td>見えているとおりの絵を、今の倍率（拡大）か等倍で書き出します。</td></tr>
<tr><td>パレット読込・保存</td><td>.pal です。8色アナログ用（8行・各0〜7）と16色アナログ用（16行・16進）があり、今のカラーモードと違うときは切り替えるかを確かめます。</td></tr>
</table>
<h3>開いたときのモード</h3>
<ul>
<li><b>.rp8</b>: 640×200 縦長・8色（ファイルのパレットとカラーモード）で開きます。裏画面は空になります。</li>
<li><b>.rpp</b>: 16色アナログで開きます。大きさが正方ピクセルの4種類のどれかと同じならそのモード、違えば全体が入るいちばん小さいモードに左上詰めで開きます（640×800に入らない分は切り取ります）。</li>
<li><b>画像</b>: 新規作成と同じダイアログで解像度モードとカラーモードを選び、大きさ（そのまま／画面に合わせる）・位置・減色の方法を選んで、表画面に入れます。書き出したPNGを開くと、元の絵に戻ります。</li>
</ul>
<h3>デスクトップ版との互換</h3>
<table>
<tr><th>デスクトップ版</th><th>やり取りできるファイル</th></tr>
<tr><td>8色版（RetroPixelPaint8）</td><td>.rp8（RP81・RP82）・.pal（8色）・.tls（4×2）</td></tr>
<tr><td>16色版（RetroPixelPaint）</td><td>.rpp（RPP1〜3）・.pal（16色）・.tls（4×4）</td></tr>
</table>
<p class="note">※ 保存と書き出しは、ブラウザのダウンロードとして行われます。ファイル名は開いたファイルの名前を引き継ぎます（最初は image）。保存していない変更があるときは、開く・新規作成の前に確かめます。</p>
<p class="note">※ claude.ai で公開したページで使うときは、保存・書き出しのたびに、保存してよいかの確認が出ます。PNG 以外（.rpi・.rp8・.rpp・.pal・.tls）は zip に入れて保存します（例: image.rpi.zip）。この zip は、開く・インポート・パレット読込・タイルセット読込でそのまま選べます。デスクトップ版で使うときは、zip から取り出してください。</p>

<h2 id="m-import">インポート</h2>
<p>ファイル→インポート… で、別のファイルの画面や画像を、今の絵の表画面か裏画面へ読み込みます。置き換わるのは読み込み先の画面だけで、元に戻せます。プレビューを見ながら選べます。</p>
<table>
<tr><th>項目</th><th>内容</th></tr>
<tr><td>読み込む元</td><td>.rpi・.rpp はファイルの表画面か裏画面、.rp8 は1画面、画像は全体です。「線画も読み込む」を選ぶと、線画レイヤーと線色も読み込みます。</td></tr>
<tr><td>読み込み先</td><td>今の絵の表画面か裏画面です。</td></tr>
<tr><td>大きさ</td><td>そのまま／画面に合わせる（縮小だけ）／幅を合わせる／高さを合わせる（拡大もします）。はみ出た分は切り取ります。</td></tr>
<tr><td>位置</td><td>左上か中央です。</td></tr>
<tr><td>ドットの形</td><td>縦長ドットと正方ピクセルが違うとき、「見た目を合わせる」は、縦長→正方では各行を2行に、正方→縦長では1行おきに取り込みます。</td></tr>
<tr><td>色</td><td>専用ファイルは「色番号のまま」か「近い色に置き換える」を選びます。</td></tr>
<tr><td>減色・明るさ・コントラスト</td><td>画像は「ディザで減色」か「近い色だけ」を選びます。減色の前に、明るさとコントラストを補正できます（−100〜100）。</td></tr>
</table>
<p class="note">※ インポートは、マスクに関係なく画面全体を置き換えます。画像の透明な所と余白は背景色になります。「別のファイル…」で、ダイアログを開いたまま読み込む元だけを替えられます。</p>

<h2 id="m-view">表示</h2>
<ul>
<li><b>倍率</b>: 最大16倍です。ステータスバーの＋・−、<kbd>Ctrl</kbd>+ホイール、ピンチで変えます。表示→「ズーム整数倍のみ」をONにすると整数倍だけになり、「全体表示」で画面に合わせます。</li>
<li><b>グリッド表示</b>: 4倍以上のとき、ドットの境目に線を出します。</li>
<li><b>縦長ドットの表示</b>: ダブルハイト（1ドットを縦2ピクセル）か、スキャンライン（上の行を黒）です。設定メニューかステータスバーで切り替えます。</li>
<li><b>ナビゲーター</b>（PC）: 全体の縮小図と、表示している範囲です。押すかドラッグで、その場所を表示します。</li>
</ul>

<h2 id="m-keys">マウス・キーボード</h2>
<table>
<tr><th>操作</th><th>機能</th></tr>
<tr><td>右クリック</td><td>スポイト（どのツールでも）</td></tr>
<tr><td><kbd>X</kbd>を押しながら描く</td><td>一時的に消しゴムになります（ペンの消しゴム側・サイドボタンでも同じ）。描画色がグラデ・グリッド・タイルの模様のときは、模様の透明でない所だけを消します。</td></tr>
<tr><td><kbd>Space</kbd>+ドラッグ・中ボタンのドラッグ</td><td>スクロール</td></tr>
<tr><td>ホイール（<kbd>Shift</kbd>で横）・矢印キー・<kbd>PageUp</kbd>・<kbd>PageDown</kbd></td><td>スクロール</td></tr>
<tr><td><kbd>Ctrl</kbd>+ホイール</td><td>マウスの位置を中心にズーム</td></tr>
<tr><td><kbd>B</kbd> <kbd>E</kbd> <kbd>L</kbd> <kbd>R</kbd> <kbd>O</kbd> <kbd>G</kbd> <kbd>Shift</kbd>+<kbd>G</kbd> <kbd>I</kbd> <kbd>V</kbd></td><td>ペン・消しゴム・直線・矩形・楕円・塗潰し・グラデ塗・スポイト・全体移動</td></tr>
<tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>サイズを小さく・大きく</td></tr>
<tr><td><kbd>Shift</kbd>+クリック（直線）</td><td>連続線</td></tr>
<tr><td><kbd>Shift</kbd>+ドラッグ（矩形・楕円）</td><td>正方形・正円</td></tr>
<tr><td><kbd>Ctrl</kbd>+ドラッグ（矩形・楕円）</td><td>始点を中心にして描く（<kbd>Shift</kbd>と一緒に押せます。Mac は<kbd>⌘</kbd>でも）</td></tr>
<tr><td><kbd>Delete</kbd></td><td>描画先のレイヤーを全消去（通常レイヤーはマスクを全解除して背景色で塗り、線画レイヤーは線画だけを消します）</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>元に戻す</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>・<kbd>Ctrl</kbd>+<kbd>Y</kbd></td><td>やり直し</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>保存（.rpi）</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>開く</td></tr>
<tr><td><kbd>F1</kbd></td><td>このマニュアル</td></tr>
</table>

<h2 id="m-touch">タッチ操作（スマホ・タブレット）</h2>
<table>
<tr><th>操作</th><th>機能</th></tr>
<tr><td>1本指でドラッグ</td><td>描きます（選んでいるツール）。</td></tr>
<tr><td>2本指でドラッグ・ピンチ</td><td>スクロール・ズームです。描き始めに2本目の指が触れたら、描きかけの線は取り消します。</td></tr>
<tr><td>長押し（約0.5秒）</td><td>スポイトです。直前のタップで描いた点や塗りは取り消します。</td></tr>
<tr><td>パレットを長押し</td><td>色の編集（8色アナログ・16色アナログのとき）</td></tr>
<tr><td>マスク</td><td>カラーの「マスク」ボタンをONにしてから、パレットを押します（もう一度押して解除）。</td></tr>
<tr><td>タイルの保存欄を長押し</td><td>登録（空いている欄はすぐ登録、使っている欄は置き換えか削除を選ぶ）。タップは読み込みです。</td></tr>
<tr><td>連続線</td><td>直線を選んで、オプション帯の「連続線」をONにします。頂点はタップかドラッグで置きます。</td></tr>
<tr><td>正方形・正円、中心から</td><td>矩形か楕円を選んで、オプション帯の「正方形」（楕円では「正円」）や「中心から」をONにします（<kbd>Shift</kbd>・<kbd>Ctrl</kbd>と同じ。両方ONにもできます）。ページを開き直すとOFFに戻ります。</td></tr>
<tr><td>上部バーのゴミ箱</td><td>描画先のレイヤーを全消去</td></tr>
<tr><td>パネルシート</td><td>上部バーのパネルのボタンで開け閉めします。シートの上の帯を下へスワイプしても閉じます。</td></tr>
</table>
<p class="note">※ ペン（スタイラス）で描いている間の、手のひらのタッチは無視します。</p>

<h2 id="m-pressure">筆圧（ペンタブレット）</h2>
<ul>
<li>オプションバーの<b>筆圧</b>をONにすると、ペン入力の筆圧を使います（Chrome・Edge がおすすめです。マウスは筆圧1.0）。</li>
<li><b>→サイズ</b>: 筆圧でサイズが1から設定値まで変わります（ペン・消しゴム）。</li>
<li><b>→グラデ色</b>: 筆圧でグラデーションの位置が変わります。弱いと最初の色、強いと最後の色です（ペン）。</li>
<li><b>カーブ</b>: 1.0（比例）〜4.0。大きいほど、強く押したときに効きます。</li>
</ul>

<h2 id="m-settings">設定の保存</h2>
<p>パレット・グラデ・グリッドの四隅・タイルの保存欄・サイズ・筆圧・線画の設定・背景色・下地の色・言語などは、このブラウザに自動で保存され、次に開いたときに戻ります。8色と16色、縦長ドットと正方ピクセルの設定は、それぞれ別に保存します。</p>
<p><b>絵は自動では保存されません。</b>ファイル→保存（.rpi）で保存してください。保存していない変更があるときは、ページを閉じる前にも確かめます。</p>
`;
}

<div class="toc">

<h2 id="m-overview">Overview</h2>
<p><b>Retro Pixel Paint</b> is a paint tool for retro-PC style pixel art.

<p>You can paint with in-between colors made by dithering two palette colors, or with tile patterns. A picture has two screens, the <b>front</b> and the <b>back</b>,
and each has a <b>normal layer</b> and a <b>line layer</b>.</p>
<p>It opens files from the desktop (VB.NET) 8-color and 16-color versions and can export in their formats. It runs entirely in the browser and never connects to the network.</p>

<h2 id="m-screen">Layout</h2>

<tr><td>Toolbar (left)</td><td>The nine tools, plus the drawing and background colors.</td></tr>
<tr><td>Right panels</td><td>Color, Pattern, Layers and Navigator. Click a header to collapse it.</td></tr>
<tr><td>Status bar</td><td>Coordinates, resolution mode, tall-dot display, color mode, shown screen, hints and zoom. Click the display or color mode to change it.</td></tr>
</table>
<h3>Phone (screens 820px wide or less)</h3>
<table>
<tr><th>Area</th><th>Contents</th></tr>
<tr><td>Top bar</td><td>Menu (≡), drawing color, Clear All (trash can), Undo, Redo, zoom and Panels.</td></tr>
<tr><td>Option strip</td><td>Settings of the current tool. It scrolls sideways.</td></tr>
<tr><td>Bottom toolbar</td><td>Pen, Eraser, Line, Shape, Fill, Picker, Shift. Choose Rect or Ellipse (Shape) and Fill or Grad Fill (Fill) in the option strip.</td></tr>
<tr><td>Panel sheet</td><td>Color, Pattern and Layers in tabs. Open it with the Panels button. Close it by pressing the button again, swiping the top of the sheet down, or tapping the dimmed canvas.</td></tr>
</table>

<h2 id="m-modes">Resolution &amp; Color Modes</h2>
<p>When you create a picture, you choose the resolution mode and the color mode separately. The resolution mode only decides the shape of a dot and of dithers and tiles; everything else works the same in every combination.</p>
<table>
<tr><th>Resolution mode</th><th>Details</th></tr>
<tr><td>Tall dots<br>640×200, 640×400</td><td>Each dot is shown 1 wide × 2 tall (640×400 or 640×800 on screen). Dithers are 4×2 with 8 levels, and tiles are 4×2. You can show them as Double Height or as Scanline (the upper row black).</td></tr>
<tr><td>Square pixels<br>320×200, 320×400, 640×400, 640×800</td><td>Each dot is shown 1×1. Dithers are 4×4 with 16 levels, and tiles are 4×4.</td></tr>
</table>
<table>
<tr><th>Color mode</th><th>Details</th></tr>
<tr><td>8 Digital Colors</td><td>Fixed 8 colors with 1 bit per RGB. The colors can't be changed.</td></tr>
<tr><td>8 Analog Colors</td><td>8 colors chosen from 512 (RGB 0–7 each).</td></tr>
<tr><td>16 Analog Colors</td><td>16 colors chosen from 4096 (RGB 0–15 each). The palette has 8 columns × 2 rows.</td></tr>
</table>
<ul>
<li>You can change the color mode later in the Settings menu or on the status bar. Going from 16 to 8 colors replaces colors 8–15 with the closest of colors 0–7 (this can't be undone).</li>
<li>In the 640-wide modes you can convert between tall dots and square pixels, and the 320-wide modes can be enlarged to 640 wide. Settings → <b>Convert to Square Pixels...</b> duplicates each row, so the picture looks the same (640×200 → 640×400, 640×400 → 640×800).</li>
<li>Settings → <b>Convert to Tall Dots...</b> keeps every other row (640×400 → 640×200, 640×800 → 640×400). For the normal layer choose the even rows (Y = 0, 2, 4...) or the odd rows (Y = 1, 3, 5...); for the line layer choose the same rows or Merge 2 rows (a dot is line if either row has line there, so drawn dots win). A preview shows the result.</li>
<li>Settings → <b>Enlarge to 640 Wide...</b> (320-wide modes) turns 320×200 into 640×200 (tall dots) or 640×400 (square pixels), and 320×400 into 640×400 (tall dots) or 640×800 (square pixels). Each dot becomes 2 side by side for tall dots, or 2×2 for square pixels, so the picture looks the same.</li>
<li>Resolution conversions and enlarging can't be undone (the undo history is cleared).</li>
<li>Phase and pseudo-transparency go from 0 to 7 for tall dots and from 0 to 15 for square pixels.</li>
</ul>

<h2 id="m-tools">Tools</h2>
<table>
<tr><th>Tool (key)</th><th>How to use</th></tr>
<tr><td>Pen (<kbd>B</kbd>)</td><td>Drag to draw. Uses the size (1–32), pseudo-transparency and pressure.</td></tr>
<tr><td>Eraser (<kbd>E</kbd>)</td><td>Paints the background color on the normal layer and removes lines on the line layer. It has its own size.</td></tr>
<tr><td>Line (<kbd>L</kbd>)</td><td>Drag to draw a line. Turn on Polyline in the options, or <kbd>Shift</kbd>+click, to chain segments (release <kbd>Shift</kbd> or right-click to finish).</td></tr>
<tr><td>Rect (<kbd>R</kbd>), Ellipse (<kbd>O</kbd>)</td><td>Drag to draw. Choose Outline or Fill in the options; the outline width can be changed. Hold <kbd>Shift</kbd> for a square or circle, and <kbd>Ctrl</kbd> to draw from the start point as the center (hold both for a square or circle from the center; pressing or releasing them mid-drag works too). With tall dots, the shape is square or round as it looks on screen. On phones and tablets, buttons in the option strip do the same (see <a href="#m-touch">Touch</a>).</td></tr>
<tr><td>Fill (<kbd>G</kbd>)</td><td>Fills the area of the same color as the clicked point. The line art can act as a boundary (Line art only ignores colors and fills what the lines enclose).</td></tr>
<tr><td>Grad Fill (<kbd>Shift</kbd>+<kbd>G</kbd>)</td><td>Fills the whole picture with the gradient of the Pattern panel, along the direction and length of your drag.</td></tr>
<tr><td>Picker (<kbd>I</kbd>)</td><td>Makes the clicked color the drawing color. Right-click (long-press on touch) does the same with any tool.</td></tr>
<tr><td>Shift All (<kbd>V</kbd>)</td><td>Drag to move the whole picture; what leaves one edge comes back on the other. You can move the front and back screens together, and Shift by Values… in the options moves by exact amounts.</td></tr>
</table>
<p class="note">* Pseudo-transparency works with the Pen and Fill; pressure changes the size of the Pen and Eraser. Set the eraser color (background color) with Background Color... in the Settings menu.</p>

<h2 id="m-color">Colors &amp; Patterns</h2>
<h3>Color panel</h3>
<ul>
<li><b>Palette</b>: click to choose the drawing color. Double-click to edit a color (from 512 colors for 8 Analog Colors, 4096 for 16 Analog Colors). Right-click to toggle a mask (colors marked × can't be painted over).</li>
<li>While the <b>mask toggle</b> button is on, clicking the palette toggles masks. Mask All, Unmask All and Invert are also there.</li>
<li><b>Transp.</b>: draws nothing on the normal layer and removes lines on the line layer.</li>
<li><b>tile</b>: the last tile you used. Click it to draw with that tile.</li>
</ul>
<h3>Pattern panel</h3>
<ul>
<li><b>Gradient</b>: joins 2 to 4 colors with dithers of 9 steps (tall dots) or 17 steps (square pixels). Set each color with its button (transparent is allowed) and click the bar to make that step the drawing color.</li>
<li><b>Grid</b>: from the four corner colors, 16×16 tiles with different mixes are laid out. Click a tile to draw with it.</li>
<li><b>Tile</b>: 64 slots. Click to load and right-click to store the current tile (long-press on touch). Save Set, Load Set (.tls) and Clear All are available. Tall-dot (4×2) and square-pixel (4×4) tiles are kept separately.</li>
<li><b>Phase</b> at the bottom shifts the dither and tile patterns. With <b>Shift per stroke</b> on, the phase advances by one with every stroke.</li>
</ul>
<h3>Pseudo-transparency</h3>
<p>An option of the Pen and Fill. It draws with a dither that mixes the drawing color with transparency, so the picture underneath stays partly visible (0 turns it off).</p>

<h2 id="m-layers">Screens &amp; Layers</h2>
<p>A picture has a front screen and a back screen. Each has a normal layer (colors) and a line layer (lines in one color), and the lines are shown above the normal layer.</p>
<ul>
<li>Click a screen header (Front or Back) in the Layers panel to show that screen. You always draw on the shown screen.</li>
<li>Click a row (Line Layer or Normal Layer) to make it the <b>target</b> you draw on.</li>
<li>The <b>eye buttons</b> show or hide a layer. With the normal layer hidden, only the lines are shown over a base color (white, gray or black); click the Base button to change it. Hiding changes nothing in the picture, and you get one notice when you start drawing on a hidden layer.</li>
<li>Each screen's line layer has one <b>line color</b>, which you can change at any time.</li>
<li><b>Draw from the other screen</b>: where you draw, the color at the same position on the other screen is copied. Include line art (when drawing on the normal layer, the other screen's lines are copied in its line color) and Overwrite transparent (when drawing on the line layer, your lines are erased where the other screen has none) apply to the matching target.</li>
<li><b>Front→Back</b> and <b>Back→Front</b> copy a whole screen, and <b>Clear Line Layer</b> removes the shown screen's lines.</li>
<li>Undo is recorded per layer, so it works across screen switches (up to 50 steps and 64 MB in total).</li>
</ul>

<h3>Modes when opening</h3>
<ul>
<li><b>.rp8</b>: opens as 640×200 tall dots with 8 colors (the file's palette and color mode). The back screen becomes empty.</li>

<li><b>Images</b>: in the same dialog as New, choose the resolution and color modes, then the size (As is / Fit to screen), position and color reduction; the image goes into the front screen. An exported PNG opens back as the original picture.</li>
</ul>

<h2 id="m-import">Import</h2>
<p>File → Import... reads a screen of another file, or an image, into the front or back screen of the current picture. Only the destination screen is replaced, and you can undo it. A preview shows the result while you choose.</p>
<table>
<tr><th>Item</th><th>Details</th></tr>
<tr><td>Source</td><td>The front or back screen of an .rpi or .rpp file, the one screen of an .rp8, or a whole image. Also import line art brings in the line layer and its line color.</td></tr>
<tr><td>Destination</td><td>The front or back screen of the current picture.</td></tr>
<tr><td>Size</td><td>As is / Fit to screen (shrink only) / Fit width / Fit height (these two also enlarge). Whatever doesn't fit is cropped.</td></tr>
<tr><td>Position</td><td>Top left or Center.</td></tr>
<tr><td>Dot shape</td><td>When tall dots meet square pixels, Match look doubles each row (tall → square) or takes every other row (square → tall).</td></tr>
<tr><td>Colors (files)</td><td>Keep numbers, or Nearest colors.</td></tr>
<tr><td>Colors, Brightness, Contrast (images)</td><td>Dither or Nearest only. Brightness and contrast can be adjusted before the reduction (−100 to 100).</td></tr>
</table>
<p class="note">* Import replaces the whole screen regardless of masks. Transparent areas of images and margins become the background color. Other File... switches only the source while the dialog stays open.</p>

<h2 id="m-view">View</h2>
<ul>
<li><b>Zoom</b>: up to 16×. Change it with + and − on the status bar, <kbd>Ctrl</kbd>+wheel or a pinch. View → Integer Zoom Only limits it to whole numbers, and Fit to Window fits the picture to the screen.</li>
<li><b>Show Grid</b>: at 4× or more, lines are drawn between the dots.</li>
<li><b>Tall-dot display</b>: Double Height (a dot is 2 pixels tall) or Scanline (the upper row black). Switch it in the Settings menu or on the status bar.</li>
<li><b>Navigator</b> (PC): a small view of the whole picture and the shown area. Click or drag in it to show that place.</li>
</ul>

<h2 id="m-pressure">Pen Pressure</h2>
<ul>
<li>Turn on <b>Pressure</b> in the option bar to use the pressure of pen input (Chrome or Edge recommended; a mouse always has pressure 1.0).</li>

<li><b>→ Grad Color</b>: pressure picks a position in the gradient, from the first color (light) to the last color (strong) (Pen).</li>

</ul>

function initUI(){
  // ≡メニュー・チップのメニューは外側を押すと閉じる
  document.addEventListener("pointerdown",ev=>{
    const tg=ev.target;
    const inside=(sel)=>!!(tg&&tg.closest&&tg.closest(sel));
    let closed=false;
    if(document.body.classList.contains("menu-open")&&!inside("#menuSheet")&&!inside("#btnMenu")){ closeMenuSheet(); closed=true; }
    if(!inside("#popMenu")){ const pm=$("popMenu"); if(pm&&pm.classList.contains("show"))closed=true; hidePopMenu(); }
    if(!inside(".menu-root")&&document.querySelector(".menu-root.open"))closed=true;   // PCのメニューは別の所で閉じる
    if(closed)ev._menuClosed=true;   // メニューを閉じた押下は、キャンバスでは何もしない
  },true);
  $("sheetShade").addEventListener("pointerdown",()=>closeSheet());
  // iOS Safariのピンチによるページズーム抑止
  document.addEventListener("gesturestart",ev=>ev.preventDefault());
  document.addEventListener("gesturechange",ev=>ev.preventDefault());
}
function applyStaticLang(){

function rebuildUIForLanguage(){
  closeAllMenus();
  closeMenuSheet();
  hidePopMenu();
  buildMenus();
  const phase=UI.refs.selPhase?UI.refs.selPhase.value:"0";
  UI.build();
  UI.refs.selPhase.value=phase;
  requestRender();
  UI.syncFromEngine();
  UI.updateToolButtons();
  UI.updatePaletteDisplay();
  UI.updateZoomButtons();
  UI.paintThumbs();
  applyStaticLang();
  updateStatus(null,null);
}
function setLanguage(lang){
  if(App.lang===lang)return;
  App.lang=lang;
  rebuildUIForLanguage();
  markSettings();
}

/* =================================================================
   設定の永続化 (window.storage → localStorage → メモリ の順で利用)
   ================================================================= */
const Persist={
  mem:{},
  async get(key){
    try{
      if(typeof window!=="undefined"&&window.storage){
        const r=await window.storage.get(key);
        if(r&&r.value!=null)return r.value;
      }
    }catch(e){}
    try{ const v=localStorage.getItem(key); if(v!=null)return v; }catch(e){}
    return (key in this.mem)?this.mem[key]:null;
  },
  async set(key,val){
    let ok=false;
    try{
      if(typeof window!=="undefined"&&window.storage){
        await window.storage.set(key,val); ok=true;
      }
    }catch(e){}
    if(!ok){
      try{ localStorage.setItem(key,val); ok=true; }catch(e){}
    }
    if(!ok)this.mem[key]=val;
  }
};

/** 擬似透過の値（今の形の分は engine から） */
function transOf(kind){ return kind===engine.dither.spec.key?engine.pressure.pseudoTransparency:App.transByKind[kind]; }
function tilesToJson(store){
  return store.map(t=>{
    if(!t)return null;
    const v=[];
    for(const row of t.tile)for(const c of row)v.push(c);
    return v;
  });
}
function tilesFromJson(arr,store,d){
  if(!Array.isArray(arr))return;
  for(let i=0;i<64&&i<arr.length;i++){
    const v=arr[i];
    if(Array.isArray(v)&&v.length===d.mx*d.my){
      const t=new TilePattern(d.my,d.mx);
      let pi=0;
      for(let py=0;py<d.my;py++)for(let px=0;px<d.mx;px++){t.tile[py][px]=v[pi];pi++;}
      store[i]=t;
    }
  }
}
/** 今の色数の、色番号を使う設定（線色・グラデ・グリッド。背景色は App.bgColorIndex と App.bgByCount） */
function currentColorSet(){
  return {lineColor:[engine.screens[0].lineColor,engine.screens[1].lineColor],gradStops:gradPalette.stopCount,
    grad:gradPalette.stopColors.slice(0,4),grid:[gridPalette.cornerTL,gridPalette.cornerTR,gridPalette.cornerBL,gridPalette.cornerBR]};
}
/** 色数 n の、色番号を使う設定を入れる（範囲の外の番号は入れない） */
function applyColorSet(cs,n){
  if(!cs||typeof cs!=="object")return;
  const ok=(v,lo)=>Number.isInteger(v)&&v>=lo&&v<n;
  if(Array.isArray(cs.lineColor))for(let s=0;s<2;s++)if(ok(cs.lineColor[s],0))engine.screens[s].lineColor=cs.lineColor[s];
  if(typeof cs.gradStops==="number")gradPalette.stopCount=clamp(cs.gradStops|0,2,4);
  if(Array.isArray(cs.grad))for(let i=0;i<4&&i<cs.grad.length;i++)if(ok(cs.grad[i],-2))gradPalette.stopColors[i]=cs.grad[i];
  if(Array.isArray(cs.grid)){
    const k=["cornerTL","cornerTR","cornerBL","cornerBR"];
    for(let i=0;i<4;i++)if(ok(cs.grid[i],TRANSPARENT_INDEX))gridPalette[k[i]]=cs.grid[i];
  }
}
/** 今の色数の設定とパレットを覚えておく（色数やカラーモードを替える前と、保存の前） */
function stashColorSettings(){
  App.colorSets[colors.count]=currentColorSet();
  if(colors.spec.editable)App.palettes[colors.mode]=colors.palette.map(c=>c.slice());
}
function validPalette(p,n){
  if(!Array.isArray(p)||p.length<n)return null;
  const out=[];
  for(let i=0;i<n;i++){
    const c=p[i];
    if(!Array.isArray(c)||c.length<3||!c.slice(0,3).every(v=>typeof v==="number"))return null;
    out.push([c[0]&255,c[1]&255,c[2]&255]);
  }
  return out;
}
function saveSettings(){
  _settingsTimer=null;
  try{
    stashColorSettings();
    const n=colors.count;
    const common={
      mode:{res:engine.res.id,color:colors.mode}, lastNew:App.lastNew,
      lang:App.lang, showGrid:App.showGrid, zoomSnapInteger:App.zoomSnapInteger,
      brushSize:engine.brushSize, eraserSize:engine.eraserSize, ditherAuto:engine.dither.autoPhasePerStroke,
      pressureOn:engine.pressure.isEnabled, pressBSize:engine.pressure.pressureBrushSize,
      pressGrad:engine.pressure.pressureGradient, pressCurve:engine.pressure.pressureCurve,
      dotMode:engine.currentDotMode, shiftSync:App.shiftSync,
      srcIncludeLine:App.srcIncludeLine, srcOverwriteTransparent:App.srcOverwriteTransparent,
      lineVisible:[engine.screens[0].lineVisible,engine.screens[1].lineVisible],
      lineFillBound:engine.lineLayerFillBoundary, lineOnlyBound:engine.lineLayerOnlyBoundary,
      shapeFill:App.shapeFill, lastShape:App.lastShape, lastFill:App.lastFill,
      panels:App.panels, patternTab:App.patternTab, sheetTab:App.sheetTab,
      baseColor:App.baseColor,   // 通常レイヤーを隠したときの下地の色（通常レイヤーの表示そのものは保存しない）
    };
    // 色数ごと: 今の色数の背景色は今の背景色、もう一方は最後に使った番号
    const colorKey=(m,pm)=>Object.assign({},App.colorSets[m]||{},{bg:m===n?App.bgColorIndex:App.bgByCount[m]},App.palettes[pm]?{pal:App.palettes[pm]}:{});
    Persist.set(SETTINGS_KEYS.common,JSON.stringify(common));
    Persist.set(SETTINGS_KEYS.color8,JSON.stringify(colorKey(8,PaletteMode.Custom8)));
    Persist.set(SETTINGS_KEYS.color16,JSON.stringify(colorKey(16,PaletteMode.Analog16)));
    Persist.set(SETTINGS_KEYS.tall,JSON.stringify({tiles:tilesToJson(App.tileStores.tall4x2),trans:transOf("tall4x2")}));
    Persist.set(SETTINGS_KEYS.square,JSON.stringify({tiles:tilesToJson(App.tileStores.bayer4),trans:transOf("bayer4")}));
  }catch(e){}
}
function parseJsonObj(s){
  if(s==null)return null;
  try{ const o=JSON.parse(s); return (o&&typeof o==="object"&&!Array.isArray(o))?o:null; }catch(e){ return null; }
}
/** 元の8色ペイントの設定（rpp8_settings_v1 の1つのキー）を、共通・色数ごと・タイリングごとに振り分ける（段階4までの統合版の項目も読む） */
function migrateSettings(o){
  const cm=o.palMode==="A16"?PaletteMode.Analog16:(o.palMode==="C8"?PaletteMode.Custom8:PaletteMode.Digital8);
  const n=COLOR[cm].count;
  const common={mode:{res:RES_DEFAULT,color:cm}};
  for(const k of ["lastNew","lang","showGrid","zoomSnapInteger","brushSize","eraserSize","ditherAuto","pressureOn","pressBSize","pressGrad","pressCurve",
    "dotMode","shiftSync","srcIncludeLine","srcOverwriteTransparent","lineFillBound","lineOnlyBound","shapeFill","lastShape","lastFill","panels","patternTab","sheetTab"])
    if(k in o)common[k]=o[k];
  common.lineVisible=[o.lineVisible,o.lineVisibleBack];
  const cur={bg:o.lastBg,lineColor:[o.lineColor,o.lineColorBack],gradStops:o.gradStops,grad:o.grad,grid:[o.gridTL,o.gridTR,o.gridBL,o.gridBR]};
  if(cm!==PaletteMode.Digital8&&Array.isArray(o.pal))cur.pal=o.pal;
  const other=(m)=>typeof o["bg"+m]==="number"?{bg:o["bg"+m]}:null;
  return {common,c8:n===8?cur:other(8),c16:n===16?cur:other(16),
    tall:{tiles:o.tiles,trans:o.pressTrans},square:{tiles:o.tilesSq,trans:o.pressTransSq}};
}
async function loadSettings(){
  let S=null;
  try{
    const common=parseJsonObj(await Persist.get(SETTINGS_KEYS.common));
    if(common){
      S={common,c8:parseJsonObj(await Persist.get(SETTINGS_KEYS.color8)),c16:parseJsonObj(await Persist.get(SETTINGS_KEYS.color16)),
        tall:parseJsonObj(await Persist.get(SETTINGS_KEYS.tall)),square:parseJsonObj(await Persist.get(SETTINGS_KEYS.square))};
    }else{
      const old=parseJsonObj(await Persist.get(SETTINGS_KEY));
      if(old)S=migrateSettings(old);
    }
  }catch(e){}
  if(!S)return;
  try{ applySettings(S); }catch(e){}
}
function applySettings({common:o,c8,c16,tall,square}){
  // カラーモードとパレット（そのモードで最後に使ったもの）、起動するときの解像度モード
  const mode=(o.mode&&typeof o.mode==="object")?o.mode:{};
  const cm=COLOR[mode.color]?mode.color:PaletteMode.Digital8;
  if(RES[mode.res])App.startRes=mode.res;
  App.palettes[PaletteMode.Custom8]=validPalette(c8&&c8.pal,8);
  App.palettes[PaletteMode.Analog16]=validPalette(c16&&c16.pal,16);
  colors.initDefault(cm);
  if(colors.spec.editable&&App.palettes[cm])colors.palette=App.palettes[cm].map(c=>c.slice());
  // 色数ごとの設定: 今の色数の分はすぐ入れ、もう一方は色数を替えるときに入れる
  const n=colors.count;
  for(const [m,cs] of [[8,c8],[16,c16]]){
    if(cs&&typeof cs.bg==="number")App.bgByCount[m]=clamp(cs.bg|0,0,m-1);
    App.colorSets[m]=cs||null;
  }
  applyColorSet(n===16?c16:c8,n);
  App.bgColorIndex=clamp(App.bgByCount[n]??7,0,n-1);
  // 共通
  if(o.dotMode===1)engine.currentDotMode=DotMode.Scanline;
  if(typeof o.brushSize==="number")engine.brushSize=clamp(o.brushSize,1,BRUSH_MAX);
  if(typeof o.eraserSize==="number")engine.eraserSize=clamp(o.eraserSize,1,BRUSH_MAX);
  if(typeof o.pressBSize==="boolean")engine.pressure.pressureBrushSize=o.pressBSize;
  if(typeof o.pressGrad==="boolean")engine.pressure.pressureGradient=o.pressGrad;
  if(typeof o.pressCurve==="number")engine.pressure.pressureCurve=o.pressCurve;
  if(typeof o.ditherAuto==="boolean")engine.dither.autoPhasePerStroke=o.ditherAuto;
  if(o.pressureOn===true)engine.pressure.enable();
  if(Array.isArray(o.lineVisible))for(let s=0;s<2;s++)if(typeof o.lineVisible[s]==="boolean")engine.screens[s].lineVisible=o.lineVisible[s];
  if(typeof o.srcIncludeLine==="boolean")App.srcIncludeLine=o.srcIncludeLine;
  if(typeof o.srcOverwriteTransparent==="boolean")App.srcOverwriteTransparent=o.srcOverwriteTransparent;
  if(typeof o.shiftSync==="boolean")App.shiftSync=o.shiftSync;
  if(o.lastNew&&RES[o.lastNew.res]&&COLOR[o.lastNew.color])App.lastNew={res:o.lastNew.res,color:o.lastNew.color};
  if(typeof o.lineFillBound==="boolean")engine.lineLayerFillBoundary=o.lineFillBound;
  if(typeof o.lineOnlyBound==="boolean")engine.lineLayerOnlyBoundary=o.lineOnlyBound;
  if(typeof o.shapeFill==="boolean")App.shapeFill=o.shapeFill;
  if(o.lastShape==="rect"||o.lastShape==="ellipse")App.lastShape=o.lastShape;
  if(o.lastFill==="fill"||o.lastFill==="grad")App.lastFill=o.lastFill;
  if(o.panels&&typeof o.panels==="object"){
    for(const k of ["color","pattern","layer","nav"])if(typeof o.panels[k]==="boolean")App.panels[k]=o.panels[k];
  }
  if(o.patternTab==="grad"||o.patternTab==="grid"||o.patternTab==="tile")App.patternTab=o.patternTab;
  if(o.sheetTab==="color"||o.sheetTab==="pattern"||o.sheetTab==="layer")App.sheetTab=o.sheetTab;
  if(typeof o.showGrid==="boolean")App.showGrid=o.showGrid;
  if(typeof o.zoomSnapInteger==="boolean")App.zoomSnapInteger=o.zoomSnapInteger;
  if(o.lang==="ja"||o.lang==="en")App.lang=o.lang;
  if(BASE_COLORS[o.baseColor]){ App.baseColor=o.baseColor; engine.baseColor=BASE_COLORS[o.baseColor].rgb.slice(); }
  // タイリングごと: タイル保存欄と擬似透過
  tilesFromJson(tall&&tall.tiles,App.tileStores.tall4x2,DITHER.tall4x2);
  tilesFromJson(square&&square.tiles,App.tileStores.bayer4,DITHER.bayer4);
  if(tall&&typeof tall.trans==="number")App.transByKind.tall4x2=clamp(tall.trans,0,DITHER.tall4x2.levels-1);
  if(square&&typeof square.trans==="number")App.transByKind.bayer4=clamp(square.trans,0,DITHER.bayer4.levels-1);
  engine.pressure.pseudoTransparency=App.transByKind[engine.dither.spec.key];
  gradPalette.generate();
  gridPalette.generate();
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&_settingsTimer){
    clearTimeout(_settingsTimer);
    saveSettings();
  }
});

/* =================================================================
   解像度モード・カラーモードの設定（新しいキャンバス）
   engine・colors・gradPalette・gridPalette は作り直さず、中身だけ入れ替える。絵と元に戻す履歴は消える。
   カラーモードが変わるときは、そのモードで最後に使ったパレット（無ければ既定）と、その色数で最後に使った色番号の設定になる（段階5）
   ================================================================= */
function configure(resId,colorId){
  const res=RES[resId];
  if(!res||!COLOR[colorId])return false;
  endPolyline();
  const oldD=engine.dither.spec;
  engine.configure(res);
  if(colors.mode!==colorId)switchColorMode(colorId);
  gradPalette.configure(res.dither);
  gridPalette.configure(res.dither);
  switchTiling(oldD);
  validateActiveTile();
  allocOffscreen();
  afterModeChange(true);
  return true;
}
/** 新しい絵（新規作成・開く）のカラーモードにする。パレットはそのモードで最後に使ったもの（無ければ既定）。
    色数が変わるときは、その色数で最後に使った色番号の設定（背景色・線色・グラデ・グリッド）に替える（無ければ近い色へ）。
    タイル保存欄はそのまま（今の色数で表せない番号を含むタイルは斜線で、選べない）。描画色は今の色数の番号にする */
function switchColorMode(colorId){
  const oldPal=colors.palette.map(c=>c.slice()), oldN=colors.count;
  stashColorSettings();
  colors.initDefault(colorId);
  if(colors.spec.editable&&App.palettes[colorId])colors.palette=App.palettes[colorId].map(c=>c.slice());
  const n=colors.count;
  if(oldN===n)return;
  const map=nearestMap(oldPal,colors.palette);
  const f=(v)=>(v>=0&&v<map.length)?map[v]:v;
  if(App.colorSets[n])applyColorSet(App.colorSets[n],n);
  else if(oldN>n){
    for(const sc of engine.screens)sc.lineColor=f(sc.lineColor);
    gradPalette.stopColors=gradPalette.stopColors.map(f);
    gridPalette.cornerTL=f(gridPalette.cornerTL); gridPalette.cornerTR=f(gridPalette.cornerTR);
    gridPalette.cornerBL=f(gridPalette.cornerBL); gridPalette.cornerBR=f(gridPalette.cornerBR);
  }
  if(oldN>n){
    App.selectedLeft=f(App.selectedLeft);
    App.selectedPattern.c1=f(App.selectedPattern.c1); App.selectedPattern.c2=f(App.selectedPattern.c2);
    patternChanged();
  }
  for(let i=n;i<MAX_COLORS;i++)engine.colorMask[i]=false;
  App.bgColorIndex=clamp(App.bgByCount[n]??7,0,n-1);
}
/** 選択中のタイルが今の色数で表せない番号を含むなら、タイルの選択をやめる */
function validateActiveTile(){
  if(App.isTileActive&&!(engine.currentTile&&tileUsable(engine.currentTile))){ App.isTileActive=false; engine.currentTile=null; }
}
/** タイルの形（縦長4×2／正方4×4）が変わったとき: タイル保存欄・直前のタイル・擬似透過を今の形の分に替え、描画色の混合比率と位相を段数に合わせる */
function switchTiling(oldD){
  const d=engine.dither.spec;
  if(d.key===oldD.key)return;
  App.lastTiles[oldD.key]=App.lastTile;
  App.transByKind[oldD.key]=engine.pressure.pseudoTransparency;
  App.storedTiles=App.tileStores[d.key];
  App.lastTile=App.lastTiles[d.key];
  engine.pressure.pseudoTransparency=clamp(App.transByKind[d.key]||0,0,d.levels-1);
  if(App.isTileActive&&App.lastTile&&tileUsable(App.lastTile)){ engine.currentTile=App.lastTile; }
  else{ App.isTileActive=false; engine.currentTile=null; }
  // 混合比率は段数の比で伸び縮み（8段→16段は2倍）。混ざっていた色は混ざったまま。位相は段数で割った余り
  const p=App.selectedPattern;
  if(p.ratio>=oldD.levels)p.ratio=d.levels;
  else if(p.ratio>0)p.ratio=clamp(Math.round(p.ratio*d.levels/oldD.levels),1,d.levels-1);
  p.phase=(p.phase||0)%d.levels;
  patternChanged();
}
/** 解像度モード・カラーモードが変わったあと、画面の部品と表示を今のモードに合わせる */
function afterModeChange(resChanged){
  if(!UI.refs.cvsPal)return;   // 起動の途中（UIを作る前）
  UI.onModeChanged();
  buildMenus();
  if(resChanged){
    App.zoom=normalizeZoom(App.zoom);
    updateSpacer();
    scrollToCanvasPoint(engine.w/2,engine.h/2);
    onZoomChanged();
  }
  refreshCanvas();
}
/** 色の近さ（RGBの差の2乗和）で、old の各色に new のいちばん近い色番号を当てた表（new にある番号はそのまま） */
function nearestMap(oldPal,newPal){
  const map=[];
  for(let i=0;i<MAX_COLORS;i++){
    if(i<newPal.length||!oldPal[i]){ map.push(Math.min(i,newPal.length-1)); continue; }
    const c=oldPal[i];
    let best=0,bd=Infinity;
    for(let j=0;j<newPal.length;j++){
      const p=newPal[j], dr=c[0]-p[0], dg=c[1]-p[1], db=c[2]-p[2], d=dr*dr+dg*dg+db*db;
      if(d<bd){ bd=d; best=j; }
    }
    map.push(best);
  }
  return map;
}
/** 色番号を表 map で置き換える: ピクセル（元に戻す履歴も）、背景色・線色・グラデ・グリッド四隅・描画色、タイル（保存欄・直前・使用中） */
function remapColorIndices(map){
  const f=(v)=>(v>=0&&v<map.length)?map[v]:v;
  const arr=(a)=>{ for(let i=0;i<a.length;i++){ const v=a[i]; if(v>=0&&v<map.length&&map[v]!==v)a[i]=map[v]; } };
  for(const sc of engine.screens){ arr(sc.pix); sc.lineColor=f(sc.lineColor); }
  for(const st of engine._undoStack.concat(engine._redoStack)){
    st.layers.forEach((id,k)=>{ if(!(id&1))arr(st.data[k]); });
    if(st.lcv)st.lcv=st.lcv.map(f);   // インポートで記録した線色
  }
  App.bgColorIndex=f(App.bgColorIndex);
  gradPalette.stopColors=gradPalette.stopColors.map(f);
  gridPalette.cornerTL=f(gridPalette.cornerTL); gridPalette.cornerTR=f(gridPalette.cornerTR);
  gridPalette.cornerBL=f(gridPalette.cornerBL); gridPalette.cornerBR=f(gridPalette.cornerBR);
  App.selectedLeft=f(App.selectedLeft);
  App.selectedPattern.c1=f(App.selectedPattern.c1); App.selectedPattern.c2=f(App.selectedPattern.c2);
  patternChanged();
  const tl=(t)=>{ if(t)for(const row of t.tile)for(let x=0;x<row.length;x++)row[x]=f(row[x]); };
  for(const k in App.tileStores)App.tileStores[k].forEach(tl);
  for(const k in App.lastTiles)tl(App.lastTiles[k]);
  tl(App.lastTile); tl(engine.currentTile);
  gradPalette.generate(); gridPalette.generate();
}
/** 置き換えで絵の見た目が変わるか（表画面・裏画面の通常レイヤーで使っている色と、線画がある画面の線色） */
function pictureChanges(oldPal,newPal,map){
  const used=new Uint8Array(MAX_COLORS);
  for(const sc of engine.screens){
    const px=sc.pix;
    for(let i=0;i<px.length;i++){ const v=px[i]; if(v>=0&&v<MAX_COLORS)used[v]=1; }
    if(sc.lineColor>=0&&sc.lineColor<MAX_COLORS&&sc.line.some(v=>v!==0))used[sc.lineColor]=1;
  }
  const same=(a,b)=>!!(a&&b&&a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]);
  for(let i=0;i<MAX_COLORS;i++)if(used[i]&&!same(oldPal[i],newPal[map[i]]))return true;
  return false;
}

/* =================================================================
   初期化
   ================================================================= */
function buildLogo(){
  const sw=$("logoSwatches");
  const d8=[[0,0,0],[0,0,255],[255,0,0],[255,0,255],[0,255,0],[0,255,255],[255,255,0],[255,255,255]];
  for(const c of d8){
    sw.append(el("i",{style:`background:rgb(${c[0]},${c[1]},${c[2]});`}));
  }
}

async function init(){
  buildLogo();
  initUI();
  await loadSettings();
  buildMenus();
  UI.build();
  configure(App.startRes??RES_DEFAULT,colors.mode);   // 前回の終わりの解像度モード（初めては 640×200 縦長）
  engine.clearAll(App.bgColorIndex);   // 表画面・裏画面とも背景色
  resizeViewCanvas();
  if(isNarrow())App.zoom=normalizeZoom(fitZoomRaw());   // スマホは全体表示から
  updateSpacer();
  scrollToCanvasPoint(engine.w/2,engine.h/2);
  UI.syncFromEngine();
  UI.updatePaletteDisplay();
  UI.updateToolButtons();
  UI.updateZoomButtons();
  UI.updatePressureDisplay();
  UI.paintThumbs();
  applyStaticLang();
  updateStatus(null,null);
  refreshCanvas();
}
init();
